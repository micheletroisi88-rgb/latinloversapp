    // ==================== HELPERS ====================
    const formatDate = (dateStr) => {
      const date = new Date(dateStr);
      const oggi = new Date();
      const domani = new Date(oggi);
      domani.setDate(domani.getDate() + 1);
      
      if (date.toDateString() === oggi.toDateString()) return "Oggi";
      if (date.toDateString() === domani.toDateString()) return "Domani";
      
      const giorni = ["Dom", "Lun", "Mar", "Mer", "Gio", "Ven", "Sab"];
      const mesi = ["gen", "feb", "mar", "apr", "mag", "giu", "lug", "ago", "set", "ott", "nov", "dic"];
      return `${giorni[date.getDay()]} ${date.getDate()} ${mesi[date.getMonth()]}`;
    };

    const isPassaggioScaduto = (data, orario) => {
      return new Date() > new Date(`${data}T${orario}`);
    };

      Check: ({size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="20 6 9 17 4 12"/></svg>,
      Sparkles: ({size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3L12 3Z"/></svg>,

    };

    // ==================== PROFILE IMAGE ====================
    function ProfileImage({ src, name, size = 48 }) {
      return (
        <div className="relative" style={{ width: size, height: size }}>
          {src ? (
            <img src={src} alt={name} className="w-full h-full rounded-full object-cover border-2 border-white shadow" />
          ) : (
            <div className="w-full h-full rounded-full bg-gradient-to-br from-pink-500 to-purple-500 flex items-center justify-center text-white font-bold shadow" 
                 style={{ fontSize: size * 0.4 }}>
              {name?.charAt(0)?.toUpperCase() || '?'}
            </div>
          )}
        </div>
      );
    }

    // ==================== MAIN APP ====================
    function App() {
      const [loading, setLoading] = useState(true);
      const [currentUser, setCurrentUser] = useState(null);
      const [profiles, setProfiles] = useState({});
      const [passaggi, setPassaggi] = useState([]);
      const [locali, setLocali] = useState([]);
      const [activeTab, setActiveTab] = useState('home');
      const [showOfferForm, setShowOfferForm] = useState(false);
      const [showLogin, setShowLogin] = useState(false);
      const [showRegistration, setShowRegistration] = useState(false);
      const [toast, setToast] = useState(null);

      useEffect(() => {
        loadInitialData();
      }, []);

      const loadInitialData = async () => {
        try {
          // Carica utente dalla sessione locale
          const savedUser = localStorage.getItem('mll-current-user');
          if (savedUser) {
            const user = JSON.parse(savedUser);
            
            // Ricarica dati utente dal DB
            const { data } = await supabase
              .from('profiles')
              .select('*')
              .eq('id', user.id)
              .single();
            
            if (data) {
              setCurrentUser(data);
              localStorage.setItem('mll-current-user', JSON.stringify(data));
            }
          }

          // Carica passaggi disponibili (solo offerte)
          const { data: passaggiData } = await supabase
            .from('passaggi')
            .select('*')
            .eq('tipo', 'offerta')
            .eq('stato', 'aperto')
            .gte('data', new Date().toISOString().split('T')[0])
            .order('data', { ascending: true });

          setPassaggi(passaggiData || []);

          // Carica tutti i profili
          const { data: profilesData } = await supabase
            .from('profiles')
            .select('*');

          const profilesMap = {};
          (profilesData || []).forEach(p => {
            profilesMap[p.id] = p;
          });
          setProfiles(profilesMap);

          // Carica locali
          const { data: localiData } = await supabase
            .from('locali')
            .select('*')
            .eq('attivo', true)
            .order('nome');

          setLocali(localiData || []);

        } catch (error) {
          console.error('Errore caricamento:', error);
          showToast('Errore di connessione', 'error');
        } finally {
          setLoading(false);
        }
      };

      const showToast = (msg, type = 'success') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3000);
      };

      const handleRegister = async (data) => {
        try {
          // Genera un UUID semplice
          const userId = crypto.randomUUID();

          const { data: newProfile, error } = await supabase
            .from('profiles')
            .insert([{
              id: userId,
              tipo_utente: 'ballerino',
              nome: data.nome.trim(),
              cognome: data.cognome?.trim() || '',
              email: data.email.toLowerCase().trim(),
              telefono: data.telefono.trim(),
              instagram: data.instagram.replace('@', '').trim(),
              zona: data.zona,
              punti: 20,
              passaggi_offerti: 0,
              passaggi_ricevuti: 0,
              is_admin: false,
              sospeso: false
            }])
            .select()
            .single();

          if (error) {
            if (error.code === '23505') {
              showToast('Email già registrata', 'error');
            } else {
              showToast('Errore registrazione', 'error');
            }
            return;
          }

          localStorage.setItem('mll-current-user', JSON.stringify(newProfile));
          setCurrentUser(newProfile);
          setShowRegistration(false);
          showToast('Benvenuto! +20 punti 🎉');
          loadInitialData();
        } catch (error) {
          console.error('Errore:', error);
          showToast('Errore registrazione', 'error');
        }
      };

      const handleLogin = async (email) => {
        try {
          const { data, error } = await supabase
            .from('profiles')
            .select('*')
            .eq('email', email.toLowerCase().trim())
            .single();

          if (error || !data) {
            showToast('Utente non trovato', 'error');
            return;
          }

          if (data.sospeso) {
            showToast('Account sospeso', 'error');
            return;
          }

          localStorage.setItem('mll-current-user', JSON.stringify(data));
          setCurrentUser(data);
          setShowLogin(false);
          showToast(`Bentornato ${data.nome}! 🎉`);
          loadInitialData();
        } catch (error) {
          console.error('Errore:', error);
          showToast('Errore login', 'error');
        }
      };

      const handleLogout = () => {
        localStorage.removeItem('mll-current-user');
        setCurrentUser(null);
        setActiveTab('home');
      };

      const handleOfferRide = async (data) => {
        try {
          const { data: newPassaggio, error } = await supabase
            .from('passaggi')
            .insert([{
              tipo: 'offerta',
              user_id: currentUser.id,
              locale: data.locale,
              data: data.data,
              orario: data.orario,
              zona_partenza: data.zonaPartenza || currentUser.zona,
              posti_disponibili: parseInt(data.posti),
              ritorno: data.ritorno,
              note: data.note,
              accetta_prenotazioni: data.accettaPrenotazioni,
              accetta_whatsapp: data.accettaWhatsapp,
              prenotazioni: [],
              stato: 'aperto'
            }])
            .select()
            .single();

          if (error) throw error;

          setShowOfferForm(false);
          showToast('Passaggio pubblicato! 🚗');
          loadInitialData();
        } catch (error) {
          console.error('Errore:', error);
          showToast('Errore pubblicazione', 'error');
        }
      };

      const handleBookRide = async (passaggioId) => {
        try {
          const passaggio = passaggi.find(p => p.id === passaggioId);
          if (!passaggio) return;

          const prenotazioni = passaggio.prenotazioni || [];
          
          if (prenotazioni.some(p => p.userId === currentUser.id)) {
            showToast('Già prenotato!', 'error');
            return;
          }

          if (prenotazioni.length >= passaggio.posti_disponibili) {
            showToast('Nessun posto disponibile', 'error');
            return;
          }

          const newPrenotazioni = [...prenotazioni, {
            userId: currentUser.id,
            nome: `${currentUser.nome} ${currentUser.cognome || ''}`.trim(),
            telefono: currentUser.telefono,
            stato: 'prenotato',
            data: new Date().toISOString()
          }];

          const { error } = await supabase
            .from('passaggi')
            .update({ prenotazioni: newPrenotazioni })
            .eq('id', passaggioId);

          if (error) throw error;

          showToast('Prenotazione inviata! ✅');
          loadInitialData();
        } catch (error) {
          console.error('Errore:', error);
          showToast('Errore prenotazione', 'error');
        }
      };

      const getPassaggiDisponibili = () => {
        return passaggi.filter(p => 
          p.stato === 'aperto' && 
          (p.prenotazioni?.length || 0) < p.posti_disponibili && 
          p.user_id !== currentUser?.id &&
          !isPassaggioScaduto(p.data, p.orario)
        );
      };

      if (loading) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-pink-500 to-purple-600 flex items-center justify-center">
            <div className="text-center">
              <div className="text-6xl mb-4 pulse">💗</div>
              <p className="text-white text-sm">Caricamento...</p>
            </div>
          </div>
        );
      }

      if (!currentUser) {
        return (
          <WelcomeScreen 
            showLogin={showLogin}
            showRegistration={showRegistration}
            onShowLogin={() => setShowLogin(true)}
            onShowRegistration={() => setShowRegistration(true)}
            onLogin={handleLogin}
            onRegister={handleRegister}
            onCancel={() => {
              setShowLogin(false);
              setShowRegistration(false);
            }}
          />
        );
      }

      return (
        <div className="min-h-screen bg-gray-50">
          {/* Header */}
          <div className="bg-gradient-to-r from-pink-500 to-purple-600 text-white p-4 sticky top-0 z-40">
            <div className="flex items-center gap-3">
              <ProfileImage src={currentUser.profile_image} name={currentUser.nome} size={48} />
              <div className="flex-1">
                <h2 className="font-bold">{currentUser.nome} {currentUser.cognome}</h2>
                <p className="text-sm text-pink-100">💎 {currentUser.punti} punti</p>
              </div>
              <button onClick={loadInitialData} className="p-2 hover:bg-white/20 rounded-lg" title="Ricarica">
                <Icons.RefreshCw size={20} />
              </button>
              <button onClick={handleLogout} className="p-2 hover:bg-white/20 rounded-lg">
                <Icons.LogOut size={20} />
              </button>
            </div>
          </div>

          {/* Content */}
          <div className="p-4 pb-24">
            {activeTab === 'home' && (
              <HomeTab 
                passaggi={getPassaggiDisponibili()} 
                currentUser={currentUser}
                profiles={profiles}
                onOfferClick={() => setShowOfferForm(true)}
                onBook={handleBookRide}
              />
            )}
            {activeTab === 'passaggi' && (
              <PassaggiTab 
                passaggi={getPassaggiDisponibili()}
                currentUser={currentUser}
                profiles={profiles}
                onBook={handleBookRide}
              />
            )}
            {activeTab === 'profilo' && (
              <ProfiloTab 
                currentUser={currentUser}
                onLogout={handleLogout}
              />
            )}
          </div>

          {/* Bottom Nav */}
          <div className="fixed bottom-0 left-0 right-0 bg-white border-t px-2 py-2 safe-bottom z-50">
            <div className="flex justify-around max-w-lg mx-auto">
              {[
                { id: 'home', icon: Icons.Home, label: 'Home' },
                { id: 'passaggi', icon: Icons.Car, label: 'Passaggi' },
                { id: 'profilo', icon: Icons.User, label: 'Profilo' },
              ].map(tab => (
                <button 
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`flex flex-col items-center py-1 px-3 rounded-xl transition ${
                    activeTab === tab.id ? 'text-pink-500 bg-pink-50' : 'text-gray-400'
                  }`}
                >
                  <tab.icon size={22} />
                  <span className="text-xs mt-1 font-medium">{tab.label}</span>
                </button>
              ))}
            </div>
          </div>

          {showOfferForm && (
            <OfferRideModal 
              currentUser={currentUser}
              locali={locali}
              onSubmit={handleOfferRide}
              onClose={() => setShowOfferForm(false)}
            />
          )}

          {toast && (
            <div className={`fixed top-20 left-4 right-4 p-4 rounded-xl shadow-lg z-50 text-center font-medium ${
              toast.type === 'error' ? 'bg-red-500' : 'bg-green-500'
            } text-white slide-up`}>
              {toast.msg}
            </div>
          )}
        </div>
      );
    }

    // ==================== WELCOME SCREEN ====================
    function WelcomeScreen({ showLogin, showRegistration, onShowLogin, onShowRegistration, onLogin, onRegister, onCancel }) {
      return (
        <div className="min-h-screen bg-gradient-to-br from-pink-500 to-purple-600 p-4">
          <div className="max-w-md mx-auto pt-8">
            <div className="text-center mb-6">
              <div className="text-6xl mb-3">💗</div>
              <h1 className="text-3xl font-bold text-white">Milano Latin Lovers</h1>
              <p className="text-pink-100">Condividi passaggi per le serate</p>
            </div>
            {!showRegistration && !showLogin ? (
              <div className="bg-white rounded-3xl p-6 shadow-2xl">
                <h2 className="text-xl font-bold text-gray-800 mb-3 text-center">Benvenuto!</h2>
                <p className="text-gray-600 mb-5 text-center text-sm">Unisciti alla community</p>
                <button 
                  onClick={onShowRegistration}
                  className="w-full bg-gradient-to-r from-pink-500 to-purple-500 text-white py-4 rounded-xl font-semibold shadow-lg mb-3"
                >
                  🚀 Registrati
                </button>
                <button 
                  onClick={onShowLogin}
                  className="w-full border-2 border-pink-500 text-pink-500 py-4 rounded-xl font-semibold"
                >
                  👤 Accedi
                </button>
                <p className="text-center text-gray-400 text-xs mt-4">+20 punti bonus!</p>
              </div>
            ) : showRegistration ? (
              <RegistrationForm onSubmit={onRegister} onCancel={onCancel} />
            ) : (
              <LoginForm onLogin={onLogin} onCancel={onCancel} />
            )}
          </div>
        </div>
      );
    }

    // ==================== HOME TAB ====================
    function HomeTab({ passaggi, currentUser, profiles, onOfferClick, onBook }) {
      return (
        <div className="space-y-5">
          <div className="grid grid-cols-2 gap-3">
            <button 
              onClick={onOfferClick}
              className="bg-gradient-to-br from-pink-500 to-pink-600 text-white p-4 rounded-xl shadow-lg flex items-center justify-center gap-2"
            >
              <Icons.Car size={20} />
              <span className="font-semibold text-sm">Offri Passaggio</span>
            </button>
            <button className="bg-gradient-to-br from-purple-500 to-purple-600 text-white p-4 rounded-xl shadow-lg flex items-center justify-center gap-2">
              <Icons.Calendar size={20} />
              <span className="font-semibold text-sm">Eventi</span>
            </button>
          </div>

          <div>
            <h2 className="text-lg font-bold mb-3">🚗 Passaggi Disponibili</h2>
            {passaggi.length === 0 ? (
              <div className="bg-white rounded-xl p-8 text-center">
                <Icons.Car size={48} className="mx-auto text-gray-300 mb-2" />
                <p className="text-gray-400">Nessun passaggio disponibile</p>
              </div>
            ) : (
              <div className="space-y-3">
                {passaggi.slice(0, 5).map(p => (
                  <PassaggioCard 
                    key={p.id} 
                    passaggio={p} 
                    currentUser={currentUser}
                    driver={profiles[p.user_id]}
                    onBook={onBook}
                  />
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }// ==================== PASSAGGI TAB ====================
    function PassaggiTab({ passaggi, currentUser, profiles, onBook }) {
      const [filter, setFilter] = useState('tutti');
      
      const filteredPassaggi = passaggi.filter(p => {
        if (filter === 'oggi') {
          return p.data === new Date().toISOString().split('T')[0];
        }
        if (filter === 'settimana') {
          const oggi = new Date();
          const settimana = new Date();
          settimana.setDate(oggi.getDate() + 7);
          return new Date(p.data) <= settimana;
        }
        return true;
      });

      return (
        <div className="space-y-4">
          <div className="flex gap-2 overflow-x-auto no-scrollbar pb-2">
            {['tutti', 'oggi', 'settimana'].map(f => (
              <button
                key={f}
                onClick={() => setFilter(f)}
                className={`px-4 py-2 rounded-full font-medium text-sm whitespace-nowrap ${
                  filter === f 
                    ? 'bg-pink-500 text-white' 
                    : 'bg-white text-gray-600 border border-gray-200'
                }`}
              >
                {f === 'tutti' ? '🌍 Tutti' : f === 'oggi' ? '📅 Oggi' : '📆 Questa settimana'}
              </button>
            ))}
          </div>

          {filteredPassaggi.length === 0 ? (
            <div className="bg-white rounded-xl p-8 text-center">
              <Icons.Car size={48} className="mx-auto text-gray-300 mb-2" />
              <p className="text-gray-400">Nessun passaggio trovato</p>
            </div>
          ) : (
            <div className="space-y-3">
              {filteredPassaggi.map(p => (
                <PassaggioCard 
                  key={p.id} 
                  passaggio={p} 
                  currentUser={currentUser}
                  driver={profiles[p.user_id]}
                  onBook={onBook}
                  expanded={true}
                />
              ))}
            </div>
          )}
        </div>
      );
    }

    // ==================== PROFILO TAB ====================
    function ProfiloTab({ currentUser, onLogout }) {
      return (
        <div className="space-y-4">
          <div className="bg-white rounded-xl p-6 shadow-sm">
            <div className="flex items-center gap-4 mb-4">
              <ProfileImage src={currentUser.profile_image} name={currentUser.nome} size={80} />
              <div className="flex-1">
                <h2 className="text-xl font-bold">{currentUser.nome} {currentUser.cognome}</h2>
                <p className="text-gray-500 text-sm">{currentUser.zona}</p>
                <p className="text-pink-500 font-semibold mt-1">💎 {currentUser.punti} punti</p>
              </div>
            </div>
            
            <div className="grid grid-cols-2 gap-3 pt-4 border-t">
              <div className="text-center">
                <p className="text-2xl font-bold text-pink-500">{currentUser.passaggi_offerti}</p>
                <p className="text-xs text-gray-500">Passaggi offerti</p>
              </div>
              <div className="text-center">
                <p className="text-2xl font-bold text-purple-500">{currentUser.passaggi_ricevuti}</p>
                <p className="text-xs text-gray-500">Passaggi ricevuti</p>
              </div>
            </div>
          </div>

          <div className="bg-white rounded-xl p-4 shadow-sm">
            <h3 className="font-bold mb-3 flex items-center gap-2">
              <Icons.User size={18} />
              Info Contatto
            </h3>
            <div className="space-y-2 text-sm">
              <div className="flex justify-between">
                <span className="text-gray-500">Email:</span>
                <span className="font-medium">{currentUser.email}</span>
              </div>
              <div className="flex justify-between">
                <span className="text-gray-500">Telefono:</span>
                <span className="font-medium">{currentUser.telefono}</span>
              </div>
              {currentUser.instagram && (
                <div className="flex justify-between">
                  <span className="text-gray-500">Instagram:</span>
                  <span className="font-medium">@{currentUser.instagram}</span>
                </div>
              )}
            </div>
          </div>

          <button 
            onClick={onLogout}
            className="w-full bg-red-500 text-white py-4 rounded-xl font-semibold flex items-center justify-center gap-2"
          >
            <Icons.LogOut size={20} />
            Disconnetti
          </button>
        </div>
      );
    }

    // ==================== PASSAGGIO CARD ====================
    function PassaggioCard({ passaggio, currentUser, driver, onBook, expanded = false }) {
      const [showDetails, setShowDetails] = useState(expanded);
      const prenotazioni = passaggio.prenotazioni || [];
      const postiLiberi = passaggio.posti_disponibili - prenotazioni.length;
      const isPrenotato = prenotazioni.some(p => p.userId === currentUser?.id);

      return (
        <div className="bg-white rounded-xl shadow-sm overflow-hidden">
          <div className="p-4">
            <div className="flex items-start gap-3 mb-3">
              <ProfileImage 
                src={driver?.profile_image} 
                name={driver?.nome || '?'} 
                size={48} 
              />
              <div className="flex-1">
                <h3 className="font-bold">{driver?.nome || 'Utente'} {driver?.cognome || ''}</h3>
                <p className="text-sm text-gray-500">{passaggio.zona_partenza}</p>
              </div>
              <div className="text-right">
                <span className={`px-3 py-1 rounded-full text-xs font-semibold ${
                  postiLiberi > 0 ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'
                }`}>
                  {postiLiberi > 0 ? `${postiLiberi} posti` : 'Completo'}
                </span>
              </div>
            </div>

            <div className="space-y-2">
              <div className="flex items-center gap-2 text-sm">
                <Icons.MapPin size={16} className="text-pink-500" />
                <span className="font-semibold">{passaggio.locale}</span>
              </div>
              <div className="flex items-center gap-4 text-sm text-gray-600">
                <div className="flex items-center gap-1">
                  <Icons.Calendar size={16} />
                  <span>{formatDate(passaggio.data)}</span>
                </div>
                <div className="flex items-center gap-1">
                  <Icons.Clock size={16} />
                  <span>{passaggio.orario}</span>
                </div>
              </div>
              {passaggio.ritorno && (
                <div className="flex items-center gap-1 text-sm text-purple-600">
                  <Icons.RefreshCw size={16} />
                  <span>Ritorno disponibile</span>
                </div>
              )}
            </div>

            {passaggio.note && showDetails && (
              <div className="mt-3 p-3 bg-gray-50 rounded-lg">
                <p className="text-sm text-gray-600">💬 {passaggio.note}</p>
              </div>
            )}

            <div className="flex gap-2 mt-4">
              {!showDetails && (
                <button
                  onClick={() => setShowDetails(true)}
                  className="flex-1 py-2 border border-gray-200 rounded-lg text-sm font-medium text-gray-600"
                >
                  Dettagli
                </button>
              )}
              {postiLiberi > 0 && !isPrenotato && passaggio.accetta_prenotazioni && (
                <button
                  onClick={() => onBook(passaggio.id)}
                  className="flex-1 bg-gradient-to-r from-pink-500 to-purple-500 text-white py-2 rounded-lg font-semibold text-sm"
                >
                  Prenota
                </button>
              )}
              {isPrenotato && (
                <div className="flex-1 bg-green-100 text-green-700 py-2 rounded-lg font-semibold text-sm text-center flex items-center justify-center gap-1">
                  <Icons.Check size={16} />
                  Prenotato
                </div>
              )}
              {passaggio.accetta_whatsapp && driver?.telefono && (
                
                  href={`https://wa.me/${driver.telefono.replace(/[^0-9]/g, '')}`}
                  target="_blank"
                  rel="noopener noreferrer"
                  className="px-4 py-2 bg-green-500 text-white rounded-lg font-semibold text-sm"
                >
                  WhatsApp
                </a>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ==================== OFFER RIDE MODAL ====================
    function OfferRideModal({ currentUser, locali, onSubmit, onClose }) {
      const [formData, setFormData] = useState({
        locale: '',
        data: '',
        orario: '',
        zonaPartenza: currentUser.zona,
        posti: '3',
        ritorno: false,
        note: '',
        accettaPrenotazioni: true,
        accettaWhatsapp: true
      });

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.locale || !formData.data || !formData.orario) {
          alert('Compila tutti i campi obbligatori');
          return;
        }
        onSubmit(formData);
      };

      return (
        <div className="fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-4">
          <div className="bg-white rounded-t-3xl sm:rounded-3xl w-full max-w-lg max-h-[90vh] overflow-y-auto slide-up">
            <div className="sticky top-0 bg-white p-4 border-b flex items-center justify-between">
              <h2 className="text-xl font-bold">🚗 Offri un Passaggio</h2>
              <button onClick={onClose} className="p-2 hover:bg-gray-100 rounded-full">
                <Icons.X size={24} />
              </button>
            </div>

            <form onSubmit={handleSubmit} className="p-4 space-y-4">
              <div>
                <label className="block text-sm font-medium mb-2">Locale *</label>
                <select
                  value={formData.locale}
                  onChange={(e) => setFormData({...formData, locale: e.target.value})}
                  className="w-full p-3 border rounded-lg"
                  required
                >
                  <option value="">Seleziona locale</option>
                  {locali.map(l => (
                    <option key={l.id} value={l.nome}>{l.nome} - {l.zona}</option>
                  ))}
                </select>
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-sm font-medium mb-2">Data *</label>
                  <input
                    type="date"
                    value={formData.data}
                    onChange={(e) => setFormData({...formData, data: e.target.value})}
                    min={new Date().toISOString().split('T')[0]}
                    className="w-full p-3 border rounded-lg"
                    required
                  />
                </div>
                <div>
                  <label className="block text-sm font-medium mb-2">Orario *</label>
                  <input
                    type="time"
                    value={formData.orario}
                    onChange={(e) => setFormData({...formData, orario: e.target.value})}
                    className="w-full p-3 border rounded-lg"
                    required
                  />
                </div>
              </div>

              <div>
                <label className="block text-sm font-medium mb-2">Zona Partenza</label>
                <input
                  type="text"
                  value={formData.zonaPartenza}
                  onChange={(e) => setFormData({...formData, zonaPartenza: e.target.value})}
                  className="w-full p-3 border rounded-lg"
                  placeholder="es. Porta Venezia"
                />
              </div>

              <div>
                <label className="block text-sm font-medium mb-2">Posti Disponibili</label>
                <select
                  value={formData.posti}
                  onChange={(e) => setFormData({...formData, posti: e.target.value})}
                  className="w-full p-3 border rounded-lg"
                >
                  {[1,2,3,4,5].map(n => (
                    <option key={n} value={n}>{n}</option>
                  ))}
                </select>
              </div>

              <div>
                <label className="block text-sm font-medium mb-2">Note</label>
                <textarea
                  value={formData.note}
                  onChange={(e) => setFormData({...formData, note: e.target.value})}
                  className="w-full p-3 border rounded-lg"
                  rows="3"
                  placeholder="Info aggiuntive..."
                />
              </div>

              <div className="space-y-2">
                <label className="flex items-center gap-2">
                  <input
                    type="checkbox"
                    checked={formData.ritorno}
                    onChange={(e) => setFormData({...formData, ritorno: e.target.checked})}
                    className="w-5 h-5 text-pink-500"
                  />
                  <span className="text-sm">Ritorno disponibile</span>
                </label>
                <label className="flex items-center gap-2">
                  <input
                    type="checkbox"
                    checked={formData.accettaPrenotazioni}
                    onChange={(e) => setFormData({...formData, accettaPrenotazioni: e.target.checked})}
                    className="w-5 h-5 text-pink-500"
                  />
                  <span className="text-sm">Accetta prenotazioni dirette</span>
                </label>
                <label className="flex items-center gap-2">
                  <input
                    type="checkbox"
                    checked={formData.accettaWhatsapp}
                    onChange={(e) => setFormData({...formData, accettaWhatsapp: e.target.checked})}
                    className="w-5 h-5 text-pink-500"
                  />
                  <span className="text-sm">Mostra WhatsApp</span>
                </label>
              </div>

              <button
                type="submit"
                className="w-full bg-gradient-to-r from-pink-500 to-purple-500 text-white py-4 rounded-xl font-bold"
              >
                Pubblica Passaggio
              </button>
            </form>
          </div>
        </div>
      );
    }

    // ==================== LOGIN FORM ====================
    function LoginForm({ onLogin, onCancel }) {
      const [email, setEmail] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (email.trim()) {
          onLogin(email);
        }
      };

      return (
        <div className="bg-white rounded-3xl p-6 shadow-2xl fade-in">
          <h2 className="text-xl font-bold mb-4 text-center">Accedi</h2>
          <form onSubmit={handleSubmit} className="space-y-4">
            <div>
              <label className="block text-sm font-medium mb-2">Email</label>
              <input
                type="email"
                value={email}
                onChange={(e) => setEmail(e.target.value)}
                className="w-full p-3 border rounded-xl"
                placeholder="la tua email"
                required
              />
            </div>
            <button
              type="submit"
              className="w-full bg-gradient-to-r from-pink-500 to-purple-500 text-white py-4 rounded-xl font-semibold"
            >
              Accedi
            </button>
            <button
              type="button"
              onClick={onCancel}
              className="w-full border-2 border-gray-300 text-gray-600 py-4 rounded-xl font-semibold"
            >
              Annulla
            </button>
          </form>
        </div>
      );
    }

    // ==================== REGISTRATION FORM ====================
    function RegistrationForm({ onSubmit, onCancel }) {
      const [formData, setFormData] = useState({
        nome: '',
        cognome: '',
        email: '',
        telefono: '',
        instagram: '',
        zona: ''
      });

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!formData.nome || !formData.email || !formData.telefono) {
          alert('Compila tutti i campi obbligatori');
          return;
        }
        onSubmit(formData);
      };

      return (
        <div className="bg-white rounded-3xl p-6 shadow-2xl fade-in max-h-[80vh] overflow-y-auto">
          <h2 className="text-xl font-bold mb-4 text-center">Registrati</h2>
          <form onSubmit={handleSubmit} className="space-y-3">
            <div>
              <label className="block text-sm font-medium mb-1">Nome *</label>
              <input
                type="text"
                value={formData.nome}
                onChange={(e) => setFormData({...formData, nome: e.target.value})}
                className="w-full p-3 border rounded-xl"
                required
              />
            </div>
            <div>
              <label className="block text-sm font-medium mb-1">Cognome</label>
              <input
                type="text"
                value={formData.cognome}
                onChange={(e) => setFormData({...formData, cognome: e.target.value})}
                className="w-full p-3 border rounded-xl"
              />
            </div>
            <div>
              <label className="block text-sm font-medium mb-1">Email *</label>
              <input
                type="email"
                value={formData.email}
                onChange={(e) => setFormData({...formData, email: e.target.value})}
                className="w-full p-3 border rounded-xl"
                required
              />
            </div>
            <div>
              <label className="block text-sm font-medium mb-1">Telefono *</label>
              <input
                type="tel"
                value={formData.telefono}
                onChange={(e) => setFormData({...formData, telefono: e.target.value})}
                className="w-full p-3 border rounded-xl"
                placeholder="+39..."
                required
              />
            </div>
            <div>
              <label className="block text-sm font-medium mb-1">Instagram</label>
              <input
                type="text"
                value={formData.instagram}
                onChange={(e) => setFormData({...formData, instagram: e.target.value})}
                className="w-full p-3 border rounded-xl"
                placeholder="@username"
              />
            </div>
            <div>
              <label className="block text-sm font-medium mb-1">Zona</label>
              <input
                type="text"
                value={formData.zona}
                onChange={(e) => setFormData({...formData, zona: e.target.value})}
                className="w-full p-3 border rounded-xl"
                placeholder="es. Porta Venezia"
              />
            </div>
            <button
              type="submit"
              className="w-full bg-gradient-to-r from-pink-500 to-purple-500 text-white py-4 rounded-xl font-semibold mt-4"
            >
              Registrati
            </button>
            <button
              type="button"
              onClick={onCancel}
              className="w-full border-2 border-gray-300 text-gray-600 py-3 rounded-xl font-semibold"
            >
              Annulla
            </button>
          </form>
        </div>
      );
    }

    // ==================== RENDER ====================
    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
