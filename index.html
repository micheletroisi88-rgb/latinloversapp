    // ==================== IMAGE HELPERS ====================
    const compressImage = (file, maxSize=400, q=0.7) => new Promise(res => {
      const r = new FileReader();
      r.onload = e => {
        const img = new Image();
        img.onload = () => {
          const c = document.createElement('canvas');
          // Mantieni proporzioni originali, scala solo se necessario
          let w = img.width, h = img.height;
          if (w > maxSize || h > maxSize) {
            if (w > h) { h = Math.round(h * maxSize / w); w = maxSize; }
            else { w = Math.round(w * maxSize / h); h = maxSize; }
          }
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          res(c.toDataURL('image/jpeg', q));
        };
        img.src = e.target.result;
      };
      r.readAsDataURL(file);
    });

    // ==================== RATING BADGE ====================
    function RatingBadge({ rating, size='normal' }) {
      if (!rating) return null;
      const sizeClass = size === 'small' ? 'text-xs px-1.5 py-0.5' : 'text-sm px-2 py-1';
      const color = rating.avg >= 8 ? 'bg-green-100 text-green-700' : rating.avg >= 5 ? 'bg-yellow-100 text-yellow-700' : 'bg-red-100 text-red-700';
      return <span className={`${sizeClass} ${color} rounded-full font-bold inline-flex items-center gap-1`}>⭐ {rating.avg}/10</span>;
    }

            </button>
          ))}
        </div>
      );
    }

      const handleChange = async e => { if (e.target.files[0] && onChange) onChange(await compressImage(e.target.files[0], 200, 0.8)); };
      return (
        <div className="relative" style={{ width: size, height: size }} onClick={onClick}>
          {src ? <img src={src} alt={name} className={`w-full h-full rounded-full object-cover border-2 border-white shadow ${onClick ? 'cursor-pointer' : ''}`} />
            : <div className={`w-full h-full rounded-full bg-gradient-to-br from-pink-500 to-purple-500 flex items-center justify-center text-white font-bold shadow ${onClick ? 'cursor-pointer' : ''}`} style={{ fontSize: size * 0.4 }}>{name?.charAt(0).toUpperCase()}</div>}
          {editable && (<>
            <button onClick={(e) => { e.stopPropagation(); ref.current?.click(); }} className="absolute bottom-0 right-0 bg-pink-500 text-white rounded-full p-1 shadow"><Icons.Camera size={size * 0.25} /></button>
            <input ref={ref} type="file" accept="image/*" onChange={handleChange} className="hidden" />
          </>)}
        </div>
      );
    }

    // ==================== ADDRESS INPUT ====================
    function AddressInput({ value, onChange, errors }) {
      const [v, setV] = useState(value || { indirizzo: '', citta: '', cap: '', provincia: 'MI' });
      const [zona, setZona] = useState('');
      const [showSug, setShowSug] = useState(false);

      useEffect(() => {
        if (v.indirizzo && v.citta) {
          const z = calcolaZona(v.indirizzo, v.citta, v.cap);
          setZona(z);
          onChange({ ...v, zona: z });
        } else { setZona(''); onChange({ ...v, zona: '' }); }
      }, [v.indirizzo, v.citta, v.cap]);

      const suggestions = useMemo(() => {
        if (v.provincia !== 'MI' || !v.citta || v.citta.length < 2) return [];
        return [...CITTA_MI, "Milano"].filter(c => c.toLowerCase().includes(v.citta.toLowerCase())).slice(0, 5);
      }, [v.citta, v.provincia]);

      return (
        <div className="space-y-3">
          <div>
            <label className="block text-sm font-medium text-gray-700 mb-1">📍 Indirizzo *</label>
            <input type="text" value={v.indirizzo} onChange={e => setV({ ...v, indirizzo: e.target.value })}
              className={`w-full border rounded-xl px-4 py-3 ${errors?.indirizzo ? 'border-red-500' : 'border-gray-300'}`} placeholder="Via e numero" />
          </div>
          <div className="grid grid-cols-2 gap-3">
            <div className="relative">
              <label className="block text-sm font-medium text-gray-700 mb-1">Città *</label>
              <input type="text" value={v.citta} onChange={e => { setV({ ...v, citta: e.target.value }); setShowSug(true); }}
                onFocus={() => setShowSug(true)} onBlur={() => setTimeout(() => setShowSug(false), 200)}
                className={`w-full border rounded-xl px-4 py-3 ${errors?.citta ? 'border-red-500' : 'border-gray-300'}`} placeholder="Milano" />
              {showSug && suggestions.length > 0 && (
                <div className="absolute z-10 w-full mt-1 bg-white border rounded-xl shadow-lg overflow-hidden">
                  {suggestions.map((c, i) => <button key={i} type="button" onClick={() => { setV({ ...v, citta: c }); setShowSug(false); }} className="w-full px-4 py-2 text-left hover:bg-pink-50 text-sm">{c}</button>)}
                </div>
              )}
            </div>
            <div>
              <label className="block text-sm font-medium text-gray-700 mb-1">CAP</label>
              <input type="text" value={v.cap} onChange={e => setV({ ...v, cap: e.target.value.replace(/\D/g, '').slice(0, 5) })}
                className="w-full border border-gray-300 rounded-xl px-4 py-3" placeholder="20100" maxLength={5} />
            </div>
          </div>
          <div>
            <label className="block text-sm font-medium text-gray-700 mb-1">Provincia</label>
            <select value={v.provincia} onChange={e => setV({ ...v, provincia: e.target.value })} className="w-full border border-gray-300 rounded-xl px-4 py-3">
              {PROVINCE.map(p => <option key={p.s} value={p.s}>{p.n}</option>)}
            </select>
          </div>
          {zona && (
            <div className="bg-gradient-to-r from-pink-500 to-purple-500 text-white p-3 rounded-xl flex items-center gap-2 fade-in">
              <Icons.MapPin size={18} /><div><p className="text-xs opacity-80">Zona</p><p className="font-bold">{zona}</p></div>
            </div>
          )}
        </div>
      );
    }

    // ==================== MAIN APP ====================
    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [users, setUsers] = useState({});
      const [passaggi, setPassaggi] = useState([]);
      const [richieste, setRichieste] = useState([]); // Richieste di passaggio
      const [eventi, setEventi] = useState([]);
      const [premi, setPremi] = useState([]);
      const [locali, setLocali] = useState([]);
      const [reviews, setReviews] = useState([]);
      const [pendingReviews, setPendingReviews] = useState([]);
      const [gare, setGare] = useState([]);
      const [adminNotifications, setAdminNotifications] = useState([]);
      const [followers, setFollowers] = useState({}); // { oderId: [followerId1, followerId2...] }
      const [messages, setMessages] = useState([]); // { id, fromId, toId, text, date, read }
      const [userNotifications, setUserNotifications] = useState([]); // { id, type, fromId, toId, date, read }
      const [banners, setBanners] = useState([]); // { id, title, text, image, link, createdAt }
      const [instagramPosts, setInstagramPosts] = useState([]); // { id, url, caption, createdAt }
      const [showBannerForm, setShowBannerForm] = useState(false);
      const [showInstagramForm, setShowInstagramForm] = useState(false);
      const [activeTab, setActiveTab] = useState('home');
      const [loading, setLoading] = useState(true);
      const [showRegistration, setShowRegistration] = useState(false);
      const [showLogin, setShowLogin] = useState(false);
      const [showOfferForm, setShowOfferForm] = useState(false);
      const [showSearchForm, setShowSearchForm] = useState(false); // Form cerca passaggio
      const [showEventForm, setShowEventForm] = useState(false);
      const [editEvent, setEditEvent] = useState(null);
      const [showGaraForm, setShowGaraForm] = useState(null); // 'leader' o 'follower'
      const [showReviewModal, setShowReviewModal] = useState(null);
      const [showMiniProfile, setShowMiniProfile] = useState(null);
      const [showEditProfile, setShowEditProfile] = useState(false);
      const [showPrizesModal, setShowPrizesModal] = useState(false);
      const [showMessages, setShowMessages] = useState(null); // userId per chat aperta
      const [showNotifications, setShowNotifications] = useState(false);
      const [showEventDetail, setShowEventDetail] = useState(null); // evento da visualizzare
      const [eventInterests, setEventInterests] = useState({}); // { eventId: { oderId: 'yes'|'no'|'maybe' } }
      const [showParticipants, setShowParticipants] = useState(null); // { evento, type: 'yes'|'no'|'maybe' }
      const [toast, setToast] = useState(null);
      const [deferredPrompt, setDeferredPrompt] = useState(null);

      useEffect(() => {
        setCurrentUser(Storage.get('mll-current-user'));
        setUsers(Storage.get('mll-users') || {});
        setPassaggi(Storage.get('mll-passaggi') || []);
        setRichieste(Storage.get('mll-richieste') || []);
        setEventi(Storage.get('mll-eventi') || []);
        setPremi(Storage.get('mll-premi') || DEFAULT_PREMI);
        setLocali(Storage.get('mll-locali') || DEFAULT_LOCALI);
        setReviews(Storage.get('mll-reviews') || []);
        setPendingReviews(Storage.get('mll-pending-reviews') || []);
        setGare(Storage.get('mll-gare') || []);
        setAdminNotifications(Storage.get('mll-admin-notifications') || []);
        setFollowers(Storage.get('mll-followers') || {});
        setMessages(Storage.get('mll-messages') || []);
        setUserNotifications(Storage.get('mll-user-notifications') || []);
        setBanners(Storage.get('mll-banners') || []);
        setInstagramPosts(Storage.get('mll-instagram-posts') || []);
        setEventInterests(Storage.get('mll-event-interests') || {});
        setLoading(false);
        window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); setDeferredPrompt(e); });
      }, []);

      // Controlla se l'utente corrente è stato sospeso
      useEffect(() => {
        if (currentUser && users[currentUser.id]?.sospeso) {
          showToast('Il tuo account è stato sospeso', 'error');
          Storage.remove('mll-current-user');
          setCurrentUser(null);
        }
      }, [users]);

      // Sistema notifiche compleanno
      useEffect(() => {
        if (!currentUser || Object.keys(users).length === 0) return;
        
        const oggi = new Date();
        const oggiStr = `${String(oggi.getMonth() + 1).padStart(2, '0')}-${String(oggi.getDate()).padStart(2, '0')}`;
        const lastBirthdayCheck = Storage.get('mll-last-birthday-check') || '';
        
        // Controlla solo una volta al giorno
        if (lastBirthdayCheck === oggiStr) return;
        Storage.set('mll-last-birthday-check', oggiStr);
        
        // Trova utenti che compiono gli anni oggi
        Object.values(users).forEach(u => {
          if (!u.dataNascita || u.id === currentUser.id) return;
          const nascita = new Date(u.dataNascita);
          const compleannoStr = `${String(nascita.getMonth() + 1).padStart(2, '0')}-${String(nascita.getDate()).padStart(2, '0')}`;
          
          if (compleannoStr === oggiStr) {
            // Trova i followers di questo utente (i suoi amici)
            const suoiFollowers = followers[u.id] || [];
            
            // Se l'utente corrente segue questa persona, mostra notifica
            if (suoiFollowers.includes(currentUser.id)) {
              const eta = oggi.getFullYear() - nascita.getFullYear();
              const notif = { 
                id: `bday_${u.id}_${oggiStr}`, 
                type: 'birthday', 
                fromId: u.id, 
                toId: currentUser.id, 
                message: `🎂 Oggi ${u.nome} compie ${eta} anni! Fagli gli auguri!`,
                date: new Date().toISOString(), 
                read: false 
              };
              
              // Evita duplicati
              const existingNotifs = Storage.get('mll-user-notifications') || [];
              if (!existingNotifs.find(n => n.id === notif.id)) {
                const notifs = [...existingNotifs, notif];
                Storage.set('mll-user-notifications', notifs);
                setUserNotifications(notifs);
              }
            }
          }
        });
      }, [currentUser, users, followers]);

      const showToast = (msg, type='success') => { setToast({ msg, type }); setTimeout(() => setToast(null), 3000); };

      const updateUser = (updates) => {
        const u = { ...currentUser, ...updates };
        const us = { ...users, [currentUser.id]: u };
        Storage.set('mll-current-user', u); Storage.set('mll-users', us);
        setCurrentUser(u); setUsers(us);
      };

      // Sistema Followers
      const handleFollow = (userId) => {
        if (!currentUser || userId === currentUser.id) return;
        const userFollowers = followers[userId] || [];
        if (userFollowers.includes(currentUser.id)) return; // Già seguito
        const newFollowers = { ...followers, [userId]: [...userFollowers, currentUser.id] };
        Storage.set('mll-followers', newFollowers);
        setFollowers(newFollowers);
        // Crea notifica per l'utente seguito
        const notif = { id: `notif_${Date.now()}`, type: 'follow', fromId: currentUser.id, toId: userId, date: new Date().toISOString(), read: false };
        const notifs = [...userNotifications, notif];
        Storage.set('mll-user-notifications', notifs);
        setUserNotifications(notifs);
        showToast('Ora segui questo utente! 👥');
      };

      const handleUnfollow = (userId) => {
        if (!currentUser || userId === currentUser.id) return;
        const userFollowers = followers[userId] || [];
        const newFollowers = { ...followers, [userId]: userFollowers.filter(id => id !== currentUser.id) };
        Storage.set('mll-followers', newFollowers);
        setFollowers(newFollowers);
        showToast('Hai smesso di seguire');
      };

      const getFollowersCount = (userId) => (followers[userId] || []).length;
      const getFollowingCount = (userId) => Object.keys(followers).filter(key => (followers[key] || []).includes(userId)).length;
      const isFollowing = (userId) => (followers[userId] || []).includes(currentUser?.id);

      // Sistema Messaggi
      const handleSendMessage = (toId, text) => {
        if (!currentUser || !text.trim()) return;
        const msg = { id: `msg_${Date.now()}`, fromId: currentUser.id, toId, text: text.trim(), date: new Date().toISOString(), read: false };
        const msgs = [...messages, msg];
        Storage.set('mll-messages', msgs);
        setMessages(msgs);
        // Crea notifica
        const notif = { id: `notif_${Date.now()}`, type: 'message', fromId: currentUser.id, toId, date: new Date().toISOString(), read: false };
        const notifs = [...userNotifications, notif];
        Storage.set('mll-user-notifications', notifs);
        setUserNotifications(notifs);
      };

      const getConversation = (userId) => messages.filter(m => (m.fromId === currentUser?.id && m.toId === userId) || (m.fromId === userId && m.toId === currentUser?.id)).sort((a, b) => new Date(a.date) - new Date(b.date));
      
      const getConversations = () => {
        if (!currentUser) return [];
        const convUsers = new Set();
        messages.forEach(m => {
          if (m.fromId === currentUser.id) convUsers.add(m.toId);
          if (m.toId === currentUser.id) convUsers.add(m.fromId);
        });
        return Array.from(convUsers).map(userId => {
          const conv = getConversation(userId);
          const lastMsg = conv[conv.length - 1];
          const unread = conv.filter(m => m.toId === currentUser.id && !m.read).length;
          return { userId, lastMsg, unread };
        }).sort((a, b) => new Date(b.lastMsg?.date || 0) - new Date(a.lastMsg?.date || 0));
      };

      const markMessagesRead = (userId) => {
        const updated = messages.map(m => (m.fromId === userId && m.toId === currentUser?.id) ? { ...m, read: true } : m);
        Storage.set('mll-messages', updated);
        setMessages(updated);
      };

      const getMyNotifications = () => userNotifications.filter(n => n.toId === currentUser?.id).sort((a, b) => new Date(b.date) - new Date(a.date));
      const getUnreadNotificationsCount = () => userNotifications.filter(n => n.toId === currentUser?.id && !n.read).length;
      const getUnreadMessagesCount = () => messages.filter(m => m.toId === currentUser?.id && !m.read).length;
      
      const markUserNotificationRead = (notifId) => {
        const updated = userNotifications.map(n => n.id === notifId ? { ...n, read: true } : n);
        Storage.set('mll-user-notifications', updated);
        setUserNotifications(updated);
      };

      const markAllUserNotificationsRead = () => {
        const updated = userNotifications.map(n => n.toId === currentUser?.id ? { ...n, read: true } : n);
        Storage.set('mll-user-notifications', updated);
        setUserNotifications(updated);
      };

      // Sistema Banner Pubblicitari
      const handleCreateBanner = (data) => {
        const banner = { id: `banner_${Date.now()}`, ...data, createdAt: new Date().toISOString() };
        const newBanners = [banner, ...banners];
        Storage.set('mll-banners', newBanners);
        setBanners(newBanners);
        setShowBannerForm(false);
        showToast('Banner creato! 📢');
      };

      const handleDeleteBanner = (id) => {
        const newBanners = banners.filter(b => b.id !== id);
        Storage.set('mll-banners', newBanners);
        setBanners(newBanners);
        showToast('Banner eliminato');
      };

      // Broadcast messaggio a tutti gli utenti
      const handleBroadcastMessage = (text) => {
        if (!text.trim() || !currentUser?.isAdmin) return;
        const allUserIds = Object.keys(users).filter(id => id !== currentUser.id);
        const newMessages = allUserIds.map(toId => ({
          id: `msg_${Date.now()}_${toId}`,
          fromId: currentUser.id,
          toId,
          text: text.trim(),
          date: new Date().toISOString(),
          read: false,
          isBroadcast: true
        }));
        const updatedMessages = [...messages, ...newMessages];
        Storage.set('mll-messages', updatedMessages);
        setMessages(updatedMessages);
        // Crea notifiche per tutti
        const newNotifs = allUserIds.map(toId => ({
          id: `notif_${Date.now()}_${toId}`,
          type: 'broadcast',
          fromId: currentUser.id,
          toId,
          date: new Date().toISOString(),
          read: false
        }));
        const updatedNotifs = [...userNotifications, ...newNotifs];
        Storage.set('mll-user-notifications', updatedNotifs);
        setUserNotifications(updatedNotifs);
        showToast(`Messaggio inviato a ${allUserIds.length} utenti! 📨`);
      };

      // Sistema Post Instagram
      const handleAddInstagramPost = (data) => {
        const post = { id: `ig_${Date.now()}`, ...data, createdAt: new Date().toISOString() };
        const newPosts = [post, ...instagramPosts];
        Storage.set('mll-instagram-posts', newPosts);
        setInstagramPosts(newPosts);
        setShowInstagramForm(false);
        showToast('Post Instagram aggiunto! 📸');
      };

      const handleDeleteInstagramPost = (id) => {
        const newPosts = instagramPosts.filter(p => p.id !== id);
        Storage.set('mll-instagram-posts', newPosts);
        setInstagramPosts(newPosts);
        showToast('Post rimosso');
      };

      // Sistema interesse eventi
      const handleEventInterest = (eventId, interest) => {
        if (!currentUser) return;
        const newInterests = { ...eventInterests };
        if (!newInterests[eventId]) newInterests[eventId] = {};
        
        // Se clicca lo stesso interesse, lo rimuove
        if (newInterests[eventId][currentUser.id] === interest) {
          delete newInterests[eventId][currentUser.id];
        } else {
          newInterests[eventId][currentUser.id] = interest;
        }
        
        Storage.set('mll-event-interests', newInterests);
        setEventInterests(newInterests);
        
        const msgs = { yes: 'Ci vado! 👍', no: 'Non ci vado 👎', maybe: 'Ci penso... 🤔' };
        if (newInterests[eventId][currentUser.id]) {
          showToast(msgs[interest]);
        }
      };

      const getEventInterestCounts = (eventId) => {
        const interests = eventInterests[eventId] || {};
        return {
          yes: Object.values(interests).filter(i => i === 'yes').length,
          no: Object.values(interests).filter(i => i === 'no').length,
          maybe: Object.values(interests).filter(i => i === 'maybe').length
        };
      };

      const getMyEventInterest = (eventId) => {
        return eventInterests[eventId]?.[currentUser?.id] || null;
      };

      const getEventParticipants = (eventId, type) => {
        const interests = eventInterests[eventId] || {};
        return Object.entries(interests)
          .filter(([userId, interest]) => interest === type)
          .map(([userId]) => users[userId])
          .filter(Boolean);
      };

      const handleRegister = (data) => {
        const id = `user_${Date.now()}`;
        const u = { id, ...data, punti: 20, passaggiOfferti: 0, passaggiRicevuti: 0, isAdmin: false, canUploadEvents: false };
        const us = { ...users, [id]: u };
        Storage.set('mll-users', us); Storage.set('mll-current-user', u);
        setUsers(us); setCurrentUser(u); setShowRegistration(false);
        showToast('Benvenuto! +20 punti 🎉');
      };

      const handleLogin = user => {
        if (user.sospeso) {
          showToast('Account sospeso. Contatta l\'amministratore.', 'error');
          return;
        }
        Storage.set('mll-current-user', user);
        setCurrentUser(user); setShowLogin(false);
        showToast(`Bentornato ${user.nome}! 🎉`);
      };

      const handleLogout = () => { Storage.remove('mll-current-user'); setCurrentUser(null); setActiveTab('home'); };

      const handleCreateEvent = data => {
        if (data.id) {
          // Modifica evento esistente
          const evs = eventi.map(e => e.id === data.id ? { ...e, ...data } : e);
          Storage.set('mll-eventi', evs); setEventi(evs); setShowEventForm(false); setEditEvent(null);
          showToast('Serata modificata! ✏️');
        } else {
          // Nuovo evento
          const ev = { id: `ev_${Date.now()}`, ...data, createdBy: currentUser.id };
          const evs = [...eventi, ev];
          Storage.set('mll-eventi', evs); setEventi(evs); setShowEventForm(false);
          showToast('Serata creata! ✨');
        }
      };

      const handleEditEvent = ev => {
        setEditEvent(ev);
        setShowEventForm(true);
      };

      const handleDeleteEvent = id => {
        const evs = eventi.filter(e => e.id !== id);
        Storage.set('mll-eventi', evs); setEventi(evs);
        showToast('Serata eliminata');
      };

      const handleOfferRide = data => {
        const p = {
          id: `ride_${Date.now()}`, driverId: currentUser.id, driverName: `${currentUser.nome} ${currentUser.cognome || ''}`.trim(),
          driverTelefono: currentUser.telefono, driverEmail: currentUser.email,
          driverInstagram: currentUser.instagram, driverZona: currentUser.zona,
          driverImage: currentUser.profileImage, ...data,
          passeggeri: [], maxPasseggeri: parseInt(data.posti), stato: 'aperto'
        };
        const ps = [...passaggi, p];
        Storage.set('mll-passaggi', ps); setPassaggi(ps); setShowOfferForm(false);
        showToast('Passaggio pubblicato! 🚗');
      };

      const handleSearchRide = data => {
        const r = {
          id: `req_${Date.now()}`, 
          userId: currentUser.id, 
          userName: `${currentUser.nome} ${currentUser.cognome || ''}`.trim(),
          userTelefono: currentUser.telefono, 
          userInstagram: currentUser.instagram, 
          userZona: currentUser.zona,
          userImage: currentUser.profileImage, 
          ...data,
          stato: 'aperto',
          createdAt: new Date().toISOString()
        };
        const rs = [...richieste, r];
        Storage.set('mll-richieste', rs); setRichieste(rs); setShowSearchForm(false);
        showToast('Richiesta pubblicata! 🔍');
      };

      const handleDeleteRichiesta = id => {
        if (confirm('Eliminare questa richiesta?')) {
          const rs = richieste.filter(r => r.id !== id);
          Storage.set('mll-richieste', rs); setRichieste(rs);
          showToast('Richiesta eliminata');
        }
      };

      const handleBookRide = async (passaggioId, viaApp) => {
        const p = passaggi.find(x => x.id === passaggioId);
        if (!p || p.passeggeri.length >= p.maxPasseggeri || p.passeggeri.some(x => x.userId === currentUser.id)) return;

        const updated = passaggi.map(x => x.id === passaggioId ? { ...x, passeggeri: [...x.passeggeri, {
          userId: currentUser.id, nome: `${currentUser.nome} ${currentUser.cognome || ''}`.trim(),
          telefono: currentUser.telefono, instagram: currentUser.instagram, zona: currentUser.zona,
          profileImage: currentUser.profileImage, stato: 'prenotato', viaApp
        }]} : x);
        Storage.set('mll-passaggi', updated); setPassaggi(updated);
        showToast('Prenotazione inviata! ✅');
      };

      const handleCancelBooking = id => {
        const updated = passaggi.map(p => p.id === id ? { ...p, passeggeri: p.passeggeri.filter(x => x.userId !== currentUser.id) } : p);
        Storage.set('mll-passaggi', updated); setPassaggi(updated);
        showToast('Prenotazione annullata');
      };

      const handleConfirmRide = (passaggioId, oderId) => {
        let pts = 10;
        if (currentUser.isFirstRide !== false) pts += 20;
        const p = passaggi.find(x => x.id === passaggioId);
        const passenger = p?.passeggeri.find(x => x.userId === oderId);
        
        const updated = passaggi.map(p => p.id === passaggioId ? { ...p, passeggeri: p.passeggeri.map(x => x.userId === oderId ? { ...x, stato: 'completato' } : x) } : p);
        Storage.set('mll-passaggi', updated); setPassaggi(updated);
        updateUser({ punti: currentUser.punti + pts, passaggiOfferti: currentUser.passaggiOfferti + 1, isFirstRide: false });
        
        const dueDate = new Date(); dueDate.setHours(dueDate.getHours() + 24);
        const newPending = [
          { id: `pr_${Date.now()}_1`, passaggioId, fromUserId: currentUser.id, toUserId: oderId, toName: passenger?.nome, type: 'passenger', dueDate: dueDate.toISOString(), locale: p?.locale, data: p?.data },
          { id: `pr_${Date.now()}_2`, passaggioId, fromUserId: oderId, toUserId: currentUser.id, toName: currentUser.nome, type: 'driver', dueDate: dueDate.toISOString(), locale: p?.locale, data: p?.data }
        ];
        const updatedPending = [...pendingReviews, ...newPending];
        Storage.set('mll-pending-reviews', updatedPending); setPendingReviews(updatedPending);
        showToast(`+${pts} punti! 🎉`);
      };

      const handleDeleteRide = (rideId) => {

        Storage.set('mll-passaggi', updated); setPassaggi(updated);
        showToast('Passaggio eliminato');

      const handleRespondGara = (garaId) => {
        const g = gare.find(x => x.id === garaId);

        const updated = gare.map(x => x.id === garaId ? {
          ...x,
          risposte: [...x.risposte, {
            userId: currentUser.id,
            nome: `${currentUser.nome} ${currentUser.cognome || ''}`.trim(),
            telefono: currentUser.telefono,
            instagram: currentUser.instagram,
            profileImage: currentUser.profileImage,
            zona: currentUser.zona,
            date: new Date().toISOString()

      const getMieCandidature = () => gare.filter(g => g.risposte.some(r => r.userId === currentUser?.id));

        const userReviews = reviews.filter(r => r.toUserId === userId);
        if (userReviews.length === 0) return null;
        return { avg: Math.round(userReviews.reduce((sum, r) => sum + r.rating, 0) / userReviews.length * 10) / 10, count: userReviews.length };
      };

      const getReadyPendingReviews = () => {
        const now = new Date();
        return pendingReviews.filter(pr => pr.fromUserId === currentUser?.id && new Date(pr.dueDate) <= now && !reviews.some(r => r.passaggioId === pr.passaggioId && r.fromUserId === pr.fromUserId && r.toUserId === pr.toUserId));
      };

      const handleSubmitReview = (pendingReview, rating) => {
        const newReview = { id: `rev_${Date.now()}`, passaggioId: pendingReview.passaggioId, fromUserId: pendingReview.fromUserId, toUserId: pendingReview.toUserId, rating, type: pendingReview.type, date: new Date().toISOString() };
        const updatedReviews = [...reviews, newReview];
        Storage.set('mll-reviews', updatedReviews); setReviews(updatedReviews);
        const updatedPending = pendingReviews.filter(pr => pr.id !== pendingReview.id);
        Storage.set('mll-pending-reviews', updatedPending); setPendingReviews(updatedPending);
        setShowReviewModal(null);
        showToast('Valutazione inviata! ⭐');
      };

      const handleSkipReview = (pr) => {
        const updatedPending = pendingReviews.filter(p => p.id !== pr.id);
        Storage.set('mll-pending-reviews', updatedPending); setPendingReviews(updatedPending);
        setShowReviewModal(null);
      };

      const handleBecomeAdmin = code => {
        if (code === ADMIN_CODE) { updateUser({ isAdmin: true }); showToast('Sei Admin! 👑'); return true; }
        return false;
      };

      // Premi
      const handleAddPremio = (premio) => {
        const updated = [...premi, { ...premio, id: `premio_${Date.now()}` }].sort((a, b) => a.punti - b.punti);
        Storage.set('mll-premi', updated); setPremi(updated);
        showToast('Premio aggiunto! 🎁');
      };
      const handleUpdatePremio = (id, updates) => {
        const updated = premi.map(p => p.id === id ? { ...p, ...updates } : p).sort((a, b) => a.punti - b.punti);
        Storage.set('mll-premi', updated); setPremi(updated);
      };
      const handleDeletePremio = (id) => {
        const updated = premi.filter(p => p.id !== id);
        Storage.set('mll-premi', updated); setPremi(updated);
      };
      const handleRedeemPrize = (premio) => {
        if (currentUser.punti >= premio.punti) {
          updateUser({ punti: currentUser.punti - premio.punti });
          // Notifica admin
          const notif = { id: `notif_${Date.now()}`, type: 'premio', userId: currentUser.id, userName: `${currentUser.nome} ${currentUser.cognome || ''}`, userPhone: currentUser.telefono, premio: premio.nome, punti: premio.punti, date: new Date().toISOString(), read: false };
          const updatedNotif = [...adminNotifications, notif];
          Storage.set('mll-admin-notifications', updatedNotif); setAdminNotifications(updatedNotif);
          showToast(`${premio.nome} riscattato! 🎁`);
        }
      };

      // Locali
      const handleAddLocale = (locale) => {
        const updated = [...locali, { ...locale, id: `locale_${Date.now()}` }].sort((a, b) => a.nome.localeCompare(b.nome));
        Storage.set('mll-locali', updated); setLocali(updated);
        showToast('Locale aggiunto! 🏠');
      };
      const handleUpdateLocale = (id, updates) => {
        const updated = locali.map(l => l.id === id ? { ...l, ...updates } : l).sort((a, b) => a.nome.localeCompare(b.nome));
        Storage.set('mll-locali', updated); setLocali(updated);
      };
      const handleDeleteLocale = (id) => {
        const updated = locali.filter(l => l.id !== id);
        Storage.set('mll-locali', updated); setLocali(updated);
        showToast('Locale eliminato');
      };
      // Helper per ottenere lista locali con "Altro..."
      const getLocaliList = () => [...locali, { id: 'altro', nome: 'Altro...' }];

      // Admin: gestione utenti
      const handleToggleUserEventUpload = (userId) => {
        const u = users[userId];
        if (u) {
          const updated = { ...users, [userId]: { ...u, canUploadEvents: !u.canUploadEvents } };
          Storage.set('mll-users', updated); setUsers(updated);
          if (userId === currentUser?.id) updateUser({ canUploadEvents: !u.canUploadEvents });
          showToast(u.canUploadEvents ? 'Upload disabilitato' : 'Upload abilitato');
        }
      };

      const handleSuspendUser = (userId) => {
        const u = users[userId];
        if (u && confirm(u.sospeso ? `Riattivare l'account di ${u.nome}?` : `Sospendere l'account di ${u.nome}?`)) {
          const updated = { ...users, [userId]: { ...u, sospeso: !u.sospeso } };
          Storage.set('mll-users', updated); setUsers(updated);
          showToast(u.sospeso ? 'Account riattivato' : 'Account sospeso');
        }
      };

      const handleDeleteUser = (userId) => {
        const u = users[userId];
        if (u && confirm(`Eliminare definitivamente l'account di ${u.nome}? Questa azione non può essere annullata.`)) {
          const { [userId]: deleted, ...remaining } = users;
          Storage.set('mll-users', remaining); setUsers(remaining);
          // Rimuovi anche i followers
          const updatedFollowers = { ...followers };
          delete updatedFollowers[userId];
          Object.keys(updatedFollowers).forEach(key => {
            updatedFollowers[key] = updatedFollowers[key].filter(id => id !== userId);
          });
          Storage.set('mll-followers', updatedFollowers); setFollowers(updatedFollowers);
          showToast('Account eliminato');
        }
      };

      const markNotificationRead = (id) => {
        const updated = adminNotifications.map(n => n.id === id ? { ...n, read: true } : n);
        Storage.set('mll-admin-notifications', updated); setAdminNotifications(updated);
      };

      // Helper per formattare data locale (evita problemi timezone)
      const getLocalDateStr = (date) => {
        const d = date || new Date();
        const year = d.getFullYear();
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      };

      const oggi = getLocalDateStr(new Date());
      const getClassifica = () => Object.values(users).filter(u => u.tipoUtente !== 'locale').sort((a, b) => b.punti - a.punti).slice(0, 20);
      const getPassaggiDisponibili = () => passaggi.filter(p => p.stato === 'aperto' && p.passeggeri.length < p.maxPasseggeri && p.driverId !== currentUser?.id && !isScadutoDaOre(p.data, p.orario, 6));
      const getMieiPassaggi = () => passaggi.filter(p => p.driverId === currentUser?.id);
      const getMiePrenotazioni = () => passaggi.filter(p => p.passeggeri.some(x => x.userId === currentUser?.id));
      const getRichiesteDisponibili = () => richieste.filter(r => r.stato === 'aperto' && r.userId !== currentUser?.id && !isScadutoDaOre(r.data, r.orario, 6));
      const getMieRichieste = () => richieste.filter(r => r.userId === currentUser?.id);
      const getProssimiEventi = () => {
        const max = new Date(); max.setDate(max.getDate() + 7);
        const maxStr = getLocalDateStr(max);
        return eventi.filter(e => e.data >= oggi && e.data <= maxStr).sort((a, b) => a.data.localeCompare(b.data));
      };
      // Tutti gli eventi futuri (senza limite 7 giorni) - per form ricerca/creazione
      const getEventiFuturi = () => eventi.filter(e => e.data >= oggi).sort((a, b) => a.data.localeCompare(b.data));
      const getAllUsers = () => Object.values(users);
      const unreadNotifications = adminNotifications.filter(n => !n.read).length;

      if (loading) return <div className="min-h-screen bg-gradient-to-br from-pink-500 to-purple-600 flex items-center justify-center"><div className="text-6xl animate-bounce">🩷</div></div>;

      if (!currentUser) return (
        <div className="min-h-screen bg-gradient-to-br from-pink-500 to-purple-600 p-4">
          <div className="max-w-md mx-auto pt-8">
            <div className="text-center mb-6">
              <div className="text-6xl mb-3">🩷</div>
              <h1 className="text-3xl font-bold text-white">Milano Latin Lovers</h1>
              <p className="text-pink-100">Programma Passaggi</p>
            </div>
            {!showRegistration && !showLogin ? (
              <div className="bg-white rounded-3xl p-6 shadow-2xl">
                <h2 className="text-xl font-bold text-gray-800 mb-3 text-center">Benvenuto!</h2>
                <p className="text-gray-600 mb-5 text-center text-sm">Offri o cerca passaggi per le serate</p>
                <button onClick={() => setShowRegistration(true)} className="w-full bg-gradient-to-r from-pink-500 to-purple-500 text-white py-4 rounded-xl font-semibold shadow-lg mb-3">🚀 Registrati</button>
                <button onClick={() => setShowLogin(true)} className="w-full border-2 border-pink-500 text-pink-500 py-4 rounded-xl font-semibold">👤 Accedi</button>
                <p className="text-center text-gray-400 text-xs mt-4">+20 punti bonus!</p>
              </div>
            ) : showRegistration ? (
              <RegistrationForm onSubmit={handleRegister} onCancel={() => setShowRegistration(false)} />
            ) : (
              <LoginForm users={users} onLogin={handleLogin} onCancel={() => setShowLogin(false)} onRegister={() => { setShowLogin(false); setShowRegistration(true); }} />
            )}
          </div>
        </div>
      );

      // I locali ora usano l'app normale con tab limitati

      return (
        <div className="min-h-screen bg-gray-50 no-scrollbar">

          <div className="bg-gradient-to-r from-pink-500 to-purple-600 text-white p-4 pb-4 sticky top-0 z-40">
            {/* Top row: icone notifiche/messaggi */}
            <div className="flex justify-end gap-3 mb-2">
              <button onClick={() => setShowNotifications(true)} className="relative p-1.5 bg-white/20 rounded-full">
                <Icons.Bell size={20} />
                {getUnreadNotificationsCount() > 0 && (
                  <span className="absolute -top-1 -right-1 bg-yellow-400 text-gray-900 text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-bold border-2 border-white">{getUnreadNotificationsCount()}</span>
                )}
              </button>
              <button onClick={() => setShowMessages('list')} className="relative p-1.5 bg-white/20 rounded-full">
                <Icons.MessageCircle size={20} />
                {getUnreadMessagesCount() > 0 && (
                  <span className="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center font-bold border-2 border-white">{getUnreadMessagesCount()}</span>
                )}
              </button>
            </div>
            
            {/* Profile row stile Instagram */}
            <div className="flex items-center gap-4">
              <ProfileImage src={currentUser.profileImage} name={currentUser.nome} size={64} onClick={() => setShowEditProfile(true)} />
              <div className="flex-1">
                {/* Badge preferenza ballo */}
                {currentUser.preferenzaBallo && (
                  <span className={`text-[10px] px-2 py-0.5 rounded-full font-bold ${
                    currentUser.preferenzaBallo === 'bachata' ? 'bg-orange-500 text-white' :
                    currentUser.preferenzaBallo === 'salsa' ? 'bg-red-500 text-white' :
                    'bg-purple-500 text-white'
                  }`}>
                    {currentUser.preferenzaBallo === 'bachata' ? '🧡 BACHATA' :
                     currentUser.preferenzaBallo === 'salsa' ? '❤️ SALSA' : '💜 50-50'}
                  </span>
                )}
                <div className="flex items-center gap-2 mb-1">
                  <h1 className="text-lg font-bold">{currentUser.nome} {currentUser.cognome}</h1>
                  {currentUser.isAdmin && <span className="bg-yellow-400 text-yellow-900 text-[10px] px-1.5 py-0.5 rounded-full font-bold">ADMIN</span>}
                </div>
                {currentUser.instagram && <p className="text-pink-200 text-xs mb-2">@{currentUser.instagram}</p>}
                
                {/* Stats row stile Instagram */}
                <div className="flex gap-4">

                    <p className="text-[10px] text-pink-100">punti</p>

                  <div className="text-center">
                    <p className="text-lg font-bold">{getFollowersCount(currentUser.id)}</p>
                    <p className="text-[10px] text-pink-100">follower</p>
                  </div>
                  <div className="text-center">
                    <p className="text-lg font-bold">{getFollowingCount(currentUser.id)}</p>
                    <p className="text-[10px] text-pink-100">seguiti</p>

                </div>

            </div>
            
            {/* Zona */}

            </div>
            )}
          </div>

        return eta;
      };

            <button onClick={onCancel} className="w-full mt-4 text-gray-500 py-2">Indietro</button>

      const validate = () => {
        const e = {};
        if (!form.nome.trim()) e.nome = 1;
        if (!form.telefono.trim()) e.telefono = 1;
        if (!form.email.trim() || !form.email.includes('@')) e.email = 1;
        if (tipoUtente === 'ballerino') {
          if (!form.dataNascita) e.dataNascita = 1;
          if (!form.preferenzaBallo) e.preferenzaBallo = 1;
          if (!addr.indirizzo || !addr.citta) { e.indirizzo = 1; e.citta = 1; }
          if (!accettaTermini) e.termini = 1;
        }
        setErrors(e);
        return !Object.keys(e).length;

        e.preventDefault();
        if (validate()) {
          const eta = calcolaEta(form.dataNascita);

            ...form, 
            tipoUtente, 
            eta,
            instagram: form.instagram.replace('@', ''), 
            zona: addr.zona || '',

            dataRegistrazione: new Date().toISOString()

              </div>
              {tipoUtente === 'ballerino' && (
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">Cognome</label>
                  <input type="text" value={form.cognome} onChange={e => setForm({ ...form, cognome: e.target.value })}
                    className="w-full border border-gray-300 rounded-xl px-4 py-3" />
                </div>
              )}
            </div>
            {tipoUtente === 'ballerino' && (
              <>
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">🎂 Data di Nascita *</label>
                  <input type="date" value={form.dataNascita} onChange={e => setForm({ ...form, dataNascita: e.target.value })}
                    className={`w-full border rounded-xl px-4 py-3 ${errors.dataNascita ? 'border-red-500' : 'border-gray-300'}`} 
                    max={new Date(new Date().setFullYear(new Date().getFullYear() - 18)).toISOString().split('T')[0]} />
                  {form.dataNascita && <p className="text-sm text-gray-500 mt-1">Età: {calcolaEta(form.dataNascita)} anni</p>}
                </div>
                <div className={`p-4 rounded-xl ${errors.preferenzaBallo ? 'bg-red-50 border border-red-300' : 'bg-purple-50'}`}>
                  <p className="text-sm font-medium text-gray-700 mb-3">💃 Ti piace di più? *</p>
                  <div className="grid grid-cols-3 gap-2">
                    <button type="button" onClick={() => setForm({ ...form, preferenzaBallo: 'bachata' })}
                      className={`py-3 rounded-xl text-sm font-bold transition ${form.preferenzaBallo === 'bachata' ? 'bg-orange-500 text-white' : 'bg-white border-2 border-gray-200 text-gray-700'}`}>
                      🧡 Bachata
                    </button>
                    <button type="button" onClick={() => setForm({ ...form, preferenzaBallo: 'salsa' })}
                      className={`py-3 rounded-xl text-sm font-bold transition ${form.preferenzaBallo === 'salsa' ? 'bg-red-500 text-white' : 'bg-white border-2 border-gray-200 text-gray-700'}`}>
                      ❤️ Salsa

                    <button type="button" onClick={() => setForm({ ...form, preferenzaBallo: '50-50' })}
                      className={`py-3 rounded-xl text-sm font-bold transition ${form.preferenzaBallo === '50-50' ? 'bg-purple-500 text-white' : 'bg-white border-2 border-gray-200 text-gray-700'}`}>
                      💜 50-50
                    </button>
                  </div>
                </div>
              </>
            )}
            <div>
              <label className="block text-sm font-medium text-gray-700 mb-1">📧 Email *</label>
              <input type="email" value={form.email} onChange={e => setForm({ ...form, email: e.target.value })}
                className={`w-full border rounded-xl px-4 py-3 ${errors.email ? 'border-red-500' : 'border-gray-300'}`} placeholder="email@esempio.com" />
            </div>
            <div>
              <label className="block text-sm font-medium text-gray-700 mb-1">📱 WhatsApp *</label>
              <input type="tel" value={form.telefono} onChange={e => setForm({ ...form, telefono: e.target.value })}
                className={`w-full border rounded-xl px-4 py-3 ${errors.telefono ? 'border-red-500' : 'border-gray-300'}`} placeholder="+39 333 1234567" />
            </div>
            <div>
              <label className="block text-sm font-medium text-gray-700 mb-1">Instagram</label>
              <div className="relative">
                <span className="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">@</span>
                <input type="text" value={form.instagram.replace('@', '')} onChange={e => setForm({ ...form, instagram: e.target.value.replace('@', '') })}
                  className="w-full border border-gray-300 rounded-xl pl-8 pr-4 py-3" placeholder="username" />
              </div>
            </div>
            {tipoUtente === 'ballerino' && (
              <>
                <div className="border-t pt-4">
                  <p className="text-sm font-medium text-gray-700 mb-3">🏠 Dove parti di solito?</p>
                  <AddressInput value={addr} onChange={setAddr} errors={errors} />

                <div className={`p-4 rounded-xl space-y-3 ${errors.termini ? 'bg-red-50 border border-red-300' : 'bg-gray-50'}`}>
                  <label className="flex items-start gap-3 cursor-pointer">
                    <input type="checkbox" checked={accettaTermini} onChange={e => setAccettaTermini(e.target.checked)}
                      className="w-5 h-5 mt-0.5 rounded text-pink-500 border-gray-300" />
                    <span className="text-xs text-gray-600">
                      <strong>Accetto i termini di utilizzo *</strong><br/>
                      Mi impegno a comportarmi correttamente su questa piattaforma. In caso di comportamenti inappropriati, il mio account potrà essere sospeso o eliminato.
                    </span>
                  </label>
                  <label className="flex items-start gap-3 cursor-pointer">
                    <input type="checkbox" checked={accettaPromo} onChange={e => setAccettaPromo(e.target.checked)}
                      className="w-5 h-5 mt-0.5 rounded text-pink-500 border-gray-300" />
                    <span className="text-xs text-gray-600">
                      Accetto di ricevere promozioni e comunicazioni da Milano Latin Lovers
                    </span>
                  </label>
                </div>
              </>
            )}
            <div className="flex gap-3 pt-2">
              <button type="button" onClick={() => setStep(1)} className="flex-1 border border-gray-300 py-3 rounded-xl font-medium">Indietro</button>
              <button type="submit" className="flex-1 bg-gradient-to-r from-pink-500 to-purple-500 text-white py-3 rounded-xl font-semibold">Registrati</button>
            </div>
          </form>
        </div>
      );
    }

    // ==================== LOGIN ====================
    function LoginForm({ users, onLogin, onCancel, onRegister }) {

      const [error, setError] = useState('');
      const list = Object.values(users);

      const handleSubmit = e => {

    // ==================== NOTIFICATIONS MODAL ====================
    function NotificationsModal({ notifications, users, onClose, onUserClick, onMarkRead, onMarkAllRead }) {
      const formatTimeAgo = (date) => {
        const now = new Date();
        const d = new Date(date);
        const diff = Math.floor((now - d) / 1000);
        if (diff < 60) return 'ora';
        if (diff < 3600) return `${Math.floor(diff/60)}m`;
        if (diff < 86400) return `${Math.floor(diff/3600)}h`;
        return `${Math.floor(diff/86400)}g`;
      };

      return (
        <div className="fixed inset-0 bg-black/50 flex items-end justify-center z-50" onClick={onClose}>
          <div className="bg-white rounded-t-3xl w-full max-w-lg max-h-[80vh] overflow-hidden slide-up" onClick={e => e.stopPropagation()}>
            <div className="flex justify-between items-center p-4 border-b sticky top-0 bg-white">
              <h2 className="text-lg font-bold">🔔 Notifiche</h2>
              <div className="flex gap-2">
                {notifications.length > 0 && (
                  <button onClick={onMarkAllRead} className="text-pink-500 text-sm font-medium">Leggi tutte</button>
                )}
                <button onClick={onClose} className="text-gray-400"><Icons.X size={24} /></button>
              </div>
            </div>
            <div className="overflow-y-auto max-h-[70vh]">
              {notifications.length === 0 ? (
                <div className="p-8 text-center text-gray-400">
                  <Icons.Bell size={48} className="mx-auto mb-2 opacity-30" />
                  <p>Nessuna notifica</p>
                </div>
              ) : (
                <div>
                  {notifications.map(notif => {
                    const fromUser = users[notif.fromId];
                    if (!fromUser) return null;
                    return (
                      <div key={notif.id} onClick={() => { onMarkRead(notif.id); onUserClick(fromUser); }}
                        className={`flex items-center gap-3 p-4 border-b cursor-pointer hover:bg-gray-50 ${!notif.read ? 'bg-pink-50' : ''}`}>
                        <ProfileImage src={fromUser.profileImage} name={fromUser.nome} size={44} />
                        <div className="flex-1 min-w-0">
                          <p className="text-sm">
                            <span className="font-bold">{fromUser.nome}</span>
                            {notif.type === 'follow' && ' ha iniziato a seguirti'}
                            {notif.type === 'message' && ' ti ha inviato un messaggio'}
                            {notif.type === 'broadcast' && ' ha inviato un annuncio 📢'}
                            {notif.type === 'birthday' && ` compie gli anni oggi! 🎂`}
                          </p>
                          {notif.message && notif.type === 'birthday' && <p className="text-xs text-pink-500 mt-0.5">Fagli gli auguri!</p>}
                          <p className="text-xs text-gray-400">{formatTimeAgo(notif.date)}</p>
                        </div>

    // ==================== MESSAGES MODAL ====================
    function MessagesModal({ mode, conversations, activeChat, users, currentUser, getConversation, onClose, onSelectChat, onSend, onMarkRead }) {
      const [message, setMessage] = useState('');
      const messagesEndRef = useRef(null);
      const chatUser = mode !== 'list' && users[mode];
      const chatMessages = mode !== 'list' ? getConversation(mode) : [];

      useEffect(() => {
        if (mode !== 'list') {
          messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
          onMarkRead?.(mode);
        }
      }, [mode, chatMessages.length]);

      const formatTime = (date) => {
        const d = new Date(date);
        return d.toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
      };

      const formatDate = (date) => {
        const d = new Date(date);
        const today = new Date();
        if (d.toDateString() === today.toDateString()) return 'Oggi';
        const yesterday = new Date(today); yesterday.setDate(yesterday.getDate() - 1);
        if (d.toDateString() === yesterday.toDateString()) return 'Ieri';
        return d.toLocaleDateString('it-IT', { day: 'numeric', month: 'short' });
      };

      const handleSend = () => {
        if (!message.trim() || mode === 'list') return;
        onSend(mode, message);
        setMessage('');
      };

      // Lista conversazioni
      if (mode === 'list') {
        return (
          <div className="fixed inset-0 bg-black/50 flex items-end justify-center z-50" onClick={onClose}>
            <div className="bg-white rounded-t-3xl w-full max-w-lg max-h-[80vh] overflow-hidden slide-up" onClick={e => e.stopPropagation()}>
              <div className="flex justify-between items-center p-4 border-b sticky top-0 bg-white">
                <h2 className="text-lg font-bold">💬 Messaggi</h2>
                <button onClick={onClose} className="text-gray-400"><Icons.X size={24} /></button>
              </div>
              <div className="overflow-y-auto max-h-[70vh]">
                {conversations.length === 0 ? (
                  <div className="p-8 text-center text-gray-400">
                    <Icons.MessageCircle size={48} className="mx-auto mb-2 opacity-30" />
                    <p>Nessun messaggio</p>
                    <p className="text-xs mt-1">Inizia una conversazione dal profilo di un utente</p>
                  </div>
                ) : (
                  <div>
                    {conversations.map(conv => {
                      const user = users[conv.userId];
                      if (!user) return null;
                      return (
                        <div key={conv.userId} onClick={() => onSelectChat(conv.userId)}
                          className={`flex items-center gap-3 p-4 border-b cursor-pointer hover:bg-gray-50 ${conv.unread > 0 ? 'bg-purple-50' : ''}`}>
                          <ProfileImage src={user.profileImage} name={user.nome} size={50} />
                          <div className="flex-1 min-w-0">
                            <div className="flex justify-between items-center">
                              <p className="font-bold text-sm">{user.nome} {user.cognome}</p>
                              <p className="text-[10px] text-gray-400">{conv.lastMsg && formatDate(conv.lastMsg.date)}</p>
                            </div>
                            <p className={`text-xs truncate ${conv.unread > 0 ? 'font-semibold text-gray-800' : 'text-gray-500'}`}>
                              {conv.lastMsg?.fromId === currentUser.id && '✓ '}
                              {conv.lastMsg?.text || 'Nessun messaggio'}
                            </p>
                          </div>
                          {conv.unread > 0 && (
                            <span className="bg-purple-500 text-white text-xs w-5 h-5 rounded-full flex items-center justify-center font-bold">{conv.unread}</span>
                          )}
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            </div>
          </div>
        );
      }

      // Chat singola
      return (
        <div className="fixed inset-0 bg-black/50 flex items-end justify-center z-50" onClick={onClose}>
          <div className="bg-white rounded-t-3xl w-full max-w-lg h-[85vh] flex flex-col slide-up" onClick={e => e.stopPropagation()}>
            {/* Header chat */}
            <div className="flex items-center gap-3 p-4 border-b">
              <button onClick={() => onSelectChat('list')} className="text-gray-500 hover:text-gray-700">
                <Icons.ChevronLeft size={24} />
              </button>
              <ProfileImage src={chatUser?.profileImage} name={chatUser?.nome} size={40} />
              <div className="flex-1">
                <p className="font-bold">{chatUser?.nome} {chatUser?.cognome}</p>
                {chatUser?.instagram && <p className="text-xs text-gray-400">@{chatUser.instagram}</p>}
              </div>
              <button onClick={onClose} className="text-gray-400"><Icons.X size={24} /></button>
            </div>

            {/* Messaggi */}
            <div className="flex-1 overflow-y-auto p-4 space-y-3 bg-gray-50">
              {chatMessages.length === 0 ? (
                <div className="text-center text-gray-400 py-8">
                  <p className="text-sm">Inizia la conversazione!</p>
                </div>
              ) : (
                chatMessages.map((msg, i) => {
                  const isMine = msg.fromId === currentUser.id;
                  const showDate = i === 0 || formatDate(chatMessages[i-1].date) !== formatDate(msg.date);
                  return (
                    <div key={msg.id}>
                      {showDate && (
                        <div className="text-center my-2">
                          <span className="text-[10px] text-gray-400 bg-white px-2 py-1 rounded-full">{formatDate(msg.date)}</span>

                      <div className={`flex ${isMine ? 'justify-end' : 'justify-start'}`}>

                          <p className={`text-[10px] mt-1 ${isMine ? 'text-purple-200' : 'text-gray-400'}`}>{formatTime(msg.date)}</p>

      );
    }

    // ==================== EVENT DETAIL MODAL ====================
    function EventDetailModal({ evento, currentUser, myInterest, counts, onInterest, onClose }) {
      if (!evento) return null;
      const [showShareOptions, setShowShareOptions] = useState(false);
      const [shareStatus, setShareStatus] = useState('');

      // Converte base64 in Blob/File
      const base64ToFile = (base64, filename) => {
        const arr = base64.split(',');
        const mime = arr[0].match(/:(.*?);/)[1];
        const bstr = atob(arr[1]);
        let n = bstr.length;
        const u8arr = new Uint8Array(n);
        while (n--) u8arr[n] = bstr.charCodeAt(n);
        return new File([u8arr], filename, { type: mime });
      };

      const handleShare = async () => {
        if (!evento.image) {
          setShareStatus('Nessuna immagine da condividere');
          setTimeout(() => setShareStatus(''), 2000);
          return;
        }

        // Su mobile prova Web Share API con file
        if (navigator.share && navigator.canShare) {
          try {
            const file = base64ToFile(evento.image, `${evento.titolo.replace(/[^a-zA-Z0-9]/g, '_')}.jpg`);
            
            if (navigator.canShare({ files: [file] })) {
              await navigator.share({
                files: [file],
                title: evento.titolo,
                text: `🎉 ${evento.titolo}\n📍 ${evento.locale}\n📅 ${formatDate(evento.data)} • ${evento.orario}`
              });
              return;
            }
          } catch (err) {
            if (err.name !== 'AbortError') {
              setShowShareOptions(true);
            }
            return;
          }
        }
        
        // Fallback: mostra opzioni
        setShowShareOptions(true);
      };

      const handleDownloadImage = () => {
        if (!evento.image) return;
        const link = document.createElement('a');
        link.href = evento.image;
        link.download = `${evento.titolo.replace(/[^a-zA-Z0-9]/g, '_')}.jpg`;
        link.click();
        setShareStatus('✓ Immagine scaricata!');
        setTimeout(() => { setShareStatus(''); setShowShareOptions(false); }, 2000);
      };

      const handleCopyImage = async () => {
        if (!evento.image) return;
        try {
          const file = base64ToFile(evento.image, 'locandina.png');
          await navigator.clipboard.write([
            new ClipboardItem({ [file.type]: file })
          ]);
          setShareStatus('✓ Immagine copiata!');
          setTimeout(() => { setShareStatus(''); setShowShareOptions(false); }, 2000);
        } catch (err) {
          // Fallback: scarica
          handleDownloadImage();
        }
      };

      return (
        <div className="fixed inset-0 bg-black/90 flex items-center justify-center z-50 p-4" onClick={onClose}>
          <div className="w-full max-w-lg max-h-[90vh] overflow-y-auto flex flex-col" onClick={e => e.stopPropagation()}>
            {/* Header */}
            <div className="flex justify-between items-center mb-3">
              <div className="text-white flex-1 min-w-0">
                <h2 className="text-xl font-bold truncate">{evento.titolo}</h2>
                <p className="text-sm text-gray-300">{evento.locale}</p>
              </div>
              <div className="flex gap-2">
                {evento.image && (
                  <button onClick={handleShare} className="text-white bg-white/20 hover:bg-white/30 p-2.5 rounded-full transition" title="Condividi">
                    <Icons.Share size={22} />
                  </button>
                )}
                <button onClick={onClose} className="text-white/70 hover:text-white p-2">
                  <Icons.X size={28} />
                </button>
              </div>
            </div>

            {/* Status message */}
            {shareStatus && (
              <div className="bg-green-500 text-white text-center py-2 px-4 rounded-xl mb-3 text-sm font-medium">
                {shareStatus}
              </div>
            )}

            {/* Opzioni condivisione immagine */}
            {showShareOptions && (
              <div className="bg-white rounded-2xl p-4 mb-4 slide-up">
                <p className="text-center text-gray-800 font-semibold mb-3">📤 Condividi locandina</p>
                <p className="text-center text-gray-500 text-xs mb-4">Scarica o copia l'immagine per condividerla dove vuoi</p>
                <div className="flex justify-center gap-4">
                  <button onClick={handleDownloadImage} className="flex flex-col items-center gap-2 p-4 bg-pink-50 rounded-xl hover:bg-pink-100 transition flex-1">
                    <span className="text-3xl">📥</span>
                    <span className="text-xs font-medium text-pink-700">Scarica immagine</span>
                  </button>
                  <button onClick={handleCopyImage} className="flex flex-col items-center gap-2 p-4 bg-purple-50 rounded-xl hover:bg-purple-100 transition flex-1">
                    <span className="text-3xl">📋</span>
                    <span className="text-xs font-medium text-purple-700">Copia immagine</span>
                  </button>
                </div>
                <button onClick={() => setShowShareOptions(false)} className="w-full mt-3 text-gray-400 text-sm">Annulla</button>
              </div>
            )}

            {/* Immagine grande */}
            <div className="flex items-center justify-center overflow-hidden rounded-2xl bg-black mb-4">
              {evento.image ? (
                <img src={evento.image} alt={evento.titolo} className="max-w-full max-h-[50vh] object-contain" />
              ) : (
                <div className="w-full h-64 bg-gradient-to-br from-pink-500 to-purple-600 flex items-center justify-center rounded-2xl">
                  <Icons.Sparkles size={64} className="text-white/50" />

              )}
            </div>

            {/* Info evento */}
            <div className="bg-white/10 backdrop-blur rounded-xl p-4 mb-3">
              <div className="flex items-center gap-4 text-white">
                <div className="flex items-center gap-2">

              </div>
              {evento.mllPresente && (

                  <span>⭐</span>

                </div>

            {/* Descrizione / Copy */}
            {evento.descrizione && (
              <div className="bg-white/10 backdrop-blur rounded-xl p-4 mb-3">

            )}

            {/* Link esterno (biglietti, ecc) */}
            {evento.link && (
              <a href={evento.link} target="_blank" className="bg-gradient-to-r from-pink-500 to-purple-500 text-white rounded-xl p-3 mb-3 flex items-center justify-center gap-2 font-medium">
                <Icons.ExternalLink size={18} />
                Apri link evento
              </a>
            )}

            {/* Pulsanti interesse */}
            <div className="bg-white rounded-2xl p-4">
              <p className="text-center text-gray-600 text-sm mb-3">Ci vai a questa serata?</p>
              <div className="flex gap-3">
                <button 
                  onClick={() => onInterest(evento.id, 'yes')}
                  className={`flex-1 py-3 rounded-xl font-semibold flex flex-col items-center gap-1 transition ${myInterest === 'yes' ? 'bg-green-500 text-white scale-105' : 'bg-green-50 text-green-600 hover:bg-green-100'}`}
                >

                  <span className="text-xs">Ci penso</span>
                  {counts.maybe > 0 && <span className="text-[10px] opacity-70">{counts.maybe}</span>}

    // ==================== HOME TAB ====================

                <span className="text-base">🚗</span><span className="font-semibold text-sm">Offri passaggio</span>
              </button>
              <button onClick={onSearchClick} className="w-full bg-gradient-to-br from-purple-500 to-purple-600 text-white py-3 px-2 rounded-xl flex items-center justify-center gap-2 shadow-lg active:scale-95 transition h-12">
                <span className="text-base">🔍</span><span className="font-semibold text-sm">Cerca passaggio</span>

            {/* Colonna Destra - Gare */}
            <div className="space-y-2">
              <button onClick={onCercaFollower} className="w-full bg-gradient-to-br from-orange-400 to-red-500 text-white py-3 px-2 rounded-xl flex items-center justify-center gap-2 shadow-lg active:scale-95 transition h-12">
                <span className="text-base">💃</span><span className="font-semibold text-sm">Cerco Follower</span>

              <button onClick={onCercaLeader} className="w-full bg-gradient-to-br from-blue-500 to-indigo-600 text-white py-3 px-2 rounded-xl flex items-center justify-center gap-2 shadow-lg active:scale-95 transition h-12">

          {/* Prossimi Eventi - IN ALTO */}
          {eventi.length > 0 && (
            <div>

                <button onClick={onEventiClick} className="text-pink-500 text-sm font-medium">Calendario</button>
              </div>
              <div className="flex gap-3 overflow-x-auto no-scrollbar -mx-4 px-4 pb-2">
                {eventi.map(ev => {
                  const counts = getInterestCounts(ev.id);

                  return (
                    <div key={ev.id} className="flex-shrink-0 w-40 bg-white rounded-xl shadow-sm overflow-hidden border relative">
                      {/* Data in alto - grassetto */}
                      <div className="bg-gradient-to-r from-pink-500 to-purple-500 text-white text-center py-1.5 px-2">
                        <p className="text-[10px] font-bold tracking-wide">{formatDateWithDay(ev.data)}</p>
                      </div>
                      
                      {/* Contatori - cliccabili */}
                      <div className="absolute top-9 right-1 z-10 flex gap-0.5">
                        {counts.yes > 0 && (
                          <button onClick={(e) => { e.stopPropagation(); onShowParticipants(ev, 'yes'); }} className="bg-green-500 text-white text-[9px] font-bold px-1 py-0.5 rounded-full min-w-[16px] shadow-lg hover:scale-110 transition">
                            {counts.yes}

                        {counts.maybe > 0 && (
                          <button onClick={(e) => { e.stopPropagation(); onShowParticipants(ev, 'maybe'); }} className="bg-yellow-500 text-white text-[9px] font-bold px-1 py-0.5 rounded-full min-w-[16px] shadow-lg hover:scale-110 transition">
                            {counts.maybe}

                      {/* Immagine con altezza fissa */}
                      <div className="relative cursor-pointer h-48 bg-gray-100" onClick={() => onEventClick(ev)}>
                        {ev.image ? <img src={ev.image} alt="" className="w-full h-full object-cover" />
                          : <div className="w-full h-full bg-gradient-to-br from-pink-100 to-purple-100 flex items-center justify-center"><Icons.Sparkles size={32} className="text-pink-300" /></div>}
                        {ev.mllPresente && <span className="absolute top-2 left-2 text-yellow-400 text-lg drop-shadow-md">⭐</span>}
                        {/* Banner stack */}
                        <div className="absolute bottom-0 left-0 right-0">

                            <div className="text-white text-[8px] font-bold text-center py-0.5" style={{backgroundColor: '#ef4444'}}>

                          <div className="text-gray-800 text-[9px] font-bold text-center py-1 truncate px-1" style={{backgroundColor: '#c8ff00'}}>
                            {ev.locale}

                      {/* Pollici - solo 2 */}
                      <div className="p-2 flex justify-center gap-2">
                        <button 
                          onClick={(e) => { e.stopPropagation(); onInterest(ev.id, 'yes'); }}
                          className={`flex-1 py-2 rounded-lg transition active:scale-90 flex items-center justify-center gap-1 ${myInterest === 'yes' ? 'bg-green-500 text-white shadow-md' : 'bg-gray-100 hover:bg-green-100'}`}

                          <span className="text-sm">👍</span>
                          <span className="text-[10px]">Ci vado</span>
                        </button>
                        <button 
                          onClick={(e) => { e.stopPropagation(); onInterest(ev.id, 'maybe'); }}
                          className={`flex-1 py-2 rounded-lg transition active:scale-90 flex items-center justify-center gap-1 ${myInterest === 'maybe' ? 'bg-yellow-500 text-white shadow-md' : 'bg-gray-100 hover:bg-yellow-100'}`}

                          <span className="text-[10px]">In dubbio</span>

                      </div>
                    </div>

                })}

          )}

          {/* Annunci - IN BASSO */}
          <div className="bg-white rounded-xl shadow-sm p-4">
            <div className="flex justify-between items-center mb-3">
              <h3 className="text-sm font-bold text-gray-800">📢 Annunci</h3>
              {currentUser.isAdmin && (

                  <Icons.Plus size={12} /> Nuovo

            {/* Pulsante Broadcast per Admin */}
            {currentUser.isAdmin && (
              <div className="mb-3">

                        <Icons.Send size={14} /> Invia a {Object.keys(users).length - 1} utenti

            {banners.length === 0 ? (
              <p className="text-sm text-gray-400 text-center py-6">Nessun annuncio al momento</p>

                    {currentUser.isAdmin && (
                      <button onClick={() => onDeleteBanner(banner.id)} className="absolute top-2 right-2 bg-red-500 text-white p-1 rounded-full opacity-0 group-hover:opacity-100 transition">
                        <Icons.X size={14} />

                      <img src={banner.image} alt="" className="w-full h-32 object-cover rounded-lg mb-3" />

                      <a href={banner.link} target="_blank" className="text-sm text-pink-500 font-medium mt-2 inline-block hover:underline">Scopri di più →</a>

                ))}
