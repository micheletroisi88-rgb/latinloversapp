<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MLL Passaggi v2</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // SUPABASE CONFIG
    const SUPABASE_URL = 'https://pcbdehqhkgufdlbtgscf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBjYmRlaHFoa2d1ZmRsYnRnc2NmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg0MjczNDEsImV4cCI6MjA4NDAwMzM0MX0.3Mh6in0Z81QYzqUb3l9UZnXmlI3iV1QfhXIlOAmj2uM';
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ========== ICONS ==========
    const Icons = {
      Car: ({ size = 24 }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2" />
          <circle cx="7" cy="17" r="2" />
          <circle cx="17" cy="17" r="2" />
        </svg>
      ),
      Sparkles: ({ size = 24 }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3L12 3Z" />
        </svg>
      ),
      User: ({ size = 24 }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2" />
          <circle cx="12" cy="7" r="4" />
        </svg>
      ),
      LogOut: ({ size = 24 }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
          <polyline points="16 17 21 12 16 7" />
          <line x1="21" x2="9" y1="12" y2="12" />
        </svg>
      ),
    };

    // ========== PROFILE IMAGE ==========
    function ProfileImage({ src, name, size = 48 }) {
      return (
        <div style={{ width: size, height: size }}>
          {src ? (
            <img src={src} alt={name} className="w-full h-full rounded-full object-cover border-2 border-white shadow" />
          ) : (
            <div className="w-full h-full rounded-full bg-gradient-to-br from-pink-500 to-purple-500 flex items-center justify-center text-white font-bold shadow" style={{ fontSize: size * 0.4 }}>
              {name?.charAt(0)?.toUpperCase() || '?'}
            </div>
          )}
        </div>
      );
    }

    // ========== MAIN APP ==========
    function App() {
      const [loading, setLoading] = useState(true);
      const [session, setSession] = useState(null);
      const [profile, setProfile] = useState(null);
      const [activeTab, setActiveTab] = useState('home');
      const [toast, setToast] = useState(null);

      useEffect(() => {
        supabase.auth.getSession().then(({ data: { session } }) => {
          setSession(session);
          if (session) loadProfile(session.user.id);
          else setLoading(false);
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          setSession(session);
          if (session) loadProfile(session.user.id);
          else setProfile(null);
        });

        return () => subscription.unsubscribe();
      }, []);

      const loadProfile = async (userId) => {
        try {
          const { data, error } = await supabase
            .from('profiles')
            .select('*')
            .eq('id', userId)
            .single();

          if (error) throw error;
          setProfile(data);
        } catch (error) {
          console.error('Error:', error);
        } finally {
          setLoading(false);
        }
      };

      const showToast = (msg, type = 'success') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3000);
      };

      const handleLogout = async () => {
        await supabase.auth.signOut();
        setProfile(null);
      };

      if (loading) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-pink-500 to-purple-600 flex items-center justify-center">
            <div className="text-6xl animate-bounce">💗</div>
          </div>
        );
      }

      if (!session) {
        return <WelcomeScreen showToast={showToast} />;
      }

      if (!profile) {
        return <CompleteProfile session={session} onComplete={loadProfile} showToast={showToast} />;
      }

      return (
        <div className="min-h-screen bg-gray-50">
          <div className="bg-gradient-to-r from-pink-500 to-purple-600 text-white p-4 sticky top-0 z-40">
            <div className="flex items-center gap-3">
              <ProfileImage src={profile.profile_image} name={profile.nome} size={48} />
              <div className="flex-1">
                <h2 className="font-bold">{profile.nome} {profile.cognome}</h2>
                <p className="text-sm text-pink-100">💎 {profile.punti} punti</p>
              </div>
              <button onClick={handleLogout} className="p-2 hover:bg-white/20 rounded-lg">
                <Icons.LogOut size={20} />
              </button>
            </div>
          </div>

          <div className="p-4 pb-24">
            {activeTab === 'home' && <div className="text-center py-20"><h2 className="text-2xl font-bold text-gray-800">🎉 Benvenuto!</h2><p className="text-gray-500 mt-2">L'app è pronta per le nuove funzionalità</p></div>}
            {activeTab === 'profilo' && (
              <div>
                <div className="bg-white rounded-xl p-5 shadow-sm">
                  <div className="flex items-center gap-4">
                    <ProfileImage src={profile.profile_image} name={profile.nome} size={80} />
                    <div>
                      <h2 className="text-xl font-bold">{profile.nome} {profile.cognome}</h2>
                      <p className="text-gray-500">{profile.zona}</p>
                    </div>
                  </div>
                  <div className="grid grid-cols-3 gap-4 py-4 border-t mt-4">
                    <div className="text-center"><p className="text-2xl font-bold text-pink-500">{profile.punti}</p><p className="text-xs text-gray-500">Punti</p></div>
                    <div className="text-center"><p className="text-2xl font-bold">{profile.passaggi_offerti}</p><p className="text-xs text-gray-500">Offerti</p></div>
                    <div className="text-center"><p className="text-2xl font-bold">{profile.passaggi_ricevuti}</p><p className="text-xs text-gray-500">Ricevuti</p></div>
                  </div>
                </div>
              </div>
            )}
          </div>

          <div className="fixed bottom-0 left-0 right-0 bg-white border-t px-2 py-2 z-50">
            <div className="flex justify-around max-w-lg mx-auto">
              {[
                { id: 'home', icon: Icons.Sparkles, label: 'Home' },
                { id: 'profilo', icon: Icons.User, label: 'Profilo' },
              ].map(tab => (
                <button key={tab.id} onClick={() => setActiveTab(tab.id)}
                  className={`flex flex-col items-center py-1 px-3 rounded-xl transition ${activeTab === tab.id ? 'text-pink-500 bg-pink-50' : 'text-gray-400'}`}>
                  <tab.icon size={22} />
                  <span className="text-xs mt-1 font-medium">{tab.label}</span>
                </button>
              ))}
            </div>
          </div>

          {toast && (
            <div className={`fixed top-20 left-4 right-4 p-4 rounded-xl shadow-lg z-50 text-center font-medium ${toast.type === 'error' ? 'bg-red-500' : 'bg-green-500'} text-white`}>
              {toast.msg}
            </div>
          )}
        </div>
      );
    }

    // ========== WELCOME ==========
    function WelcomeScreen({ showToast }) {
      const [mode, setMode] = useState('login');
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [loading, setLoading] = useState(false);

      const handleAuth = async () => {
        setLoading(true);
        try {
          if (mode === 'signup') {
            const { error } = await supabase.auth.signUp({ email, password });
            if (error) throw error;
            showToast('Controlla la tua email!');
          } else {
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) throw error;
          }
        } catch (error) {
          showToast(error.message, 'error');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen bg-gradient-to-br from-pink-500 to-purple-600 p-4 flex items-center justify-center">
          <div className="max-w-md w-full">
            <div className="text-center mb-8">
              <div className="text-6xl mb-4">💗</div>
              <h1 className="text-3xl font-bold text-white mb-2">Milano Latin Lovers</h1>
              <p className="text-pink-100">Condividi passaggi</p>
            </div>

            <div className="bg-white rounded-3xl p-6 shadow-2xl">
              <h2 className="text-xl font-bold mb-4 text-center">{mode === 'signup' ? '🚀 Registrati' : '👤 Accedi'}</h2>
              
              <div className="space-y-4">
                <input type="email" value={email} onChange={e => setEmail(e.target.value)} className="w-full border border-gray-300 rounded-xl px-4 py-3" placeholder="Email" />
                <input type="password" value={password} onChange={e => setPassword(e.target.value)} className="w-full border border-gray-300 rounded-xl px-4 py-3" placeholder="Password" />
                <button onClick={handleAuth} disabled={loading} className="w-full bg-gradient-to-r from-pink-500 to-purple-500 text-white py-4 rounded-xl font-semibold disabled:opacity-50">
                  {loading ? 'Caricamento...' : mode === 'signup' ? 'Registrati' : 'Accedi'}
                </button>
              </div>

              <button onClick={() => setMode(mode === 'signup' ? 'login' : 'signup')} className="w-full mt-3 text-pink-500 text-sm">
                {mode === 'signup' ? 'Hai un account? Accedi' : 'Non hai un account? Registrati'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ========== COMPLETE PROFILE ==========
    function CompleteProfile({ session, onComplete, showToast }) {
      const [nome, setNome] = useState('');
      const [cognome, setCognome] = useState('');
      const [telefono, setTelefono] = useState('');
      const [zona, setZona] = useState('Centro');
      const [loading, setLoading] = useState(false);

      const handleSubmit = async () => {
        setLoading(true);
        try {
          const { error } = await supabase.from('profiles').insert([{
            id: session.user.id,
            email: session.user.email,
            nome,
            cognome,
            telefono,
            zona,
            tipo_utente: 'ballerino',
          }]);

          if (error) throw error;
          onComplete(session.user.id);
          showToast('Profilo completato! 🎉');
        } catch (error) {
          showToast(error.message, 'error');
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen bg-gradient-to-br from-pink-500 to-purple-600 p-4 flex items-center justify-center">
          <div className="bg-white rounded-3xl p-6 shadow-2xl max-w-md w-full">
            <h2 className="text-xl font-bold mb-4">✨ Completa profilo</h2>
            <div className="space-y-4">
              <input type="text" value={nome} onChange={e => setNome(e.target.value)} className="w-full border border-gray-300 rounded-xl px-4 py-3" placeholder="Nome" />
              <input type="text" value={cognome} onChange={e => setCognome(e.target.value)} className="w-full border border-gray-300 rounded-xl px-4 py-3" placeholder="Cognome" />
              <input type="tel" value={telefono} onChange={e => setTelefono(e.target.value)} className="w-full border border-gray-300 rounded-xl px-4 py-3" placeholder="Telefono" />
              <select value={zona} onChange={e => setZona(e.target.value)} className="w-full border border-gray-300 rounded-xl px-4 py-3">
                <option>Centro</option>
                <option>Navigli</option>
                <option>Isola</option>
                <option>Loreto</option>
              </select>
              <button onClick={handleSubmit} disabled={loading} className="w-full bg-gradient-to-r from-pink-500 to-purple-500 text-white py-4 rounded-xl font-semibold disabled:opacity-50">
                {loading ? 'Salvataggio...' : 'Inizia! 🚀'}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ========== RENDER ==========
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
