    // ==================== CREATE GARA MODAL ====================
    function CreateGaraModal({ tipo, eventi, currentUser, locali, onSubmit, onClose }) {
      // Filtra solo serate con gara
      const serateConGara = eventi.filter(ev => ev.serataConGara);
      const [mode, setMode] = useState(serateConGara.length > 0 ? 'evento' : 'manuale');
      const [form, setForm] = useState({
        cercaTipo: tipo, // 'leader' o 'follower'
        eventoId: '', eventoTitolo: '', locale: '', localeId: '', localeAltro: '',
        data: '', orario: '', livello: '', note: ''
      });

      const handleEventSelect = id => {
        const ev = serateConGara.find(e => e.id === id);
        if (ev) setForm({ ...form, eventoId: ev.id, eventoTitolo: ev.titolo, locale: ev.locale, data: ev.data, orario: ev.orario });
      };

      const handleSubmit = e => {
        e.preventDefault();
        const localeNome = form.localeId === 'altro' ? form.localeAltro : (form.locale || locali.find(l => l.id === form.localeId)?.nome);
        if (!localeNome || !form.data || !form.livello) return;
        onSubmit({ ...form, locale: localeNome });
      };

      return (
        <div className="fixed inset-0 bg-black/50 flex items-end justify-center z-50" onClick={onClose}>
          <div className="bg-white rounded-t-3xl w-full max-w-lg p-5 max-h-[90vh] overflow-y-auto slide-up" onClick={e => e.stopPropagation()}>
            <div className="flex justify-between items-center mb-4">
              <h2 className="text-xl font-bold">
                {tipo === 'follower' ? '💃 Cerco Follower' : '🕺 Cerco Leader'}
              </h2>
              <button onClick={onClose} className="text-gray-400 p-2"><Icons.X size={24} /></button>
            </div>

            {serateConGara.length > 0 ? (
              <div className="flex gap-2 mb-4 bg-gray-100 p-1 rounded-xl">
                <button type="button" onClick={() => setMode('evento')} className={`flex-1 py-2 rounded-lg text-sm font-medium ${mode === 'evento' ? 'bg-white text-pink-500 shadow' : 'text-gray-500'}`}>🏆 Serate con Gara</button>
                <button type="button" onClick={() => setMode('manuale')} className={`flex-1 py-2 rounded-lg text-sm font-medium ${mode === 'manuale' ? 'bg-white text-pink-500 shadow' : 'text-gray-500'}`}>✏️ Manuale</button>
              </div>
            ) : (
              <div className="bg-yellow-50 border border-yellow-200 rounded-xl p-3 mb-4 text-sm text-yellow-800">
                ⚠️ Non ci sono serate con gara in programma. Puoi inserire i dati manualmente.
              </div>
            )}

            <form onSubmit={handleSubmit} className="space-y-4">
              {mode === 'evento' && serateConGara.length > 0 ? (
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-2">Seleziona serata con gara</label>
                  <div className="max-h-28 overflow-y-auto rounded-lg border border-gray-200">
                    {serateConGara.map((ev, idx) => (
                      <button key={ev.id} type="button" onClick={() => handleEventSelect(ev.id)}
                        className={`w-full text-left px-2 py-1.5 transition border-b border-gray-100 last:border-b-0 ${form.eventoId === ev.id ? 'bg-orange-100 border-l-4 border-l-orange-500' : idx % 2 === 0 ? 'bg-red-50/50' : 'bg-white'}`}>
                        <div className="flex justify-between items-center">
                          <div className="flex items-center gap-1.5 flex-1 min-w-0">
                            <span className="text-[9px] font-bold px-1 py-0.5 rounded bg-red-500 text-white">🏆</span>
                            {ev.mllPresente && <span className="bg-blue-600 text-white text-[9px] font-bold px-1 py-0.5 rounded">MLL</span>}
                            <p className="font-medium text-gray-800 text-xs truncate">{ev.titolo} <span className="text-purple-600 font-normal">• {ev.locale}</span></p>
                          </div>
                          <p className="text-[10px] text-gray-500 ml-2 whitespace-nowrap">{formatDate(ev.data)} {ev.orario}</p>
                        </div>
                      </button>
                    ))}
                  </div>
                </div>
              ) : (
                <>
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">Locale *</label>
                    <select value={form.localeId} onChange={e => setForm({ ...form, localeId: e.target.value })} className="w-full border border-gray-300 rounded-xl px-4 py-3" required>
                      <option value="">Seleziona...</option>
                      {locali.map(l => <option key={l.id} value={l.id}>{l.nome}</option>)}
                      <option value="altro">Altro...</option>
                    </select>
                  </div>
                  {form.localeId === 'altro' && (
                    <input type="text" value={form.localeAltro} onChange={e => setForm({ ...form, localeAltro: e.target.value })}
                      className="w-full border border-gray-300 rounded-xl px-4 py-3" placeholder="Nome locale" required />
                  )}
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-1">Data *</label>
                      <input type="date" value={form.data} onChange={e => setForm({ ...form, data: e.target.value })}
                        className="w-full border border-gray-300 rounded-xl px-4 py-3" min={new Date().toISOString().split('T')[0]} required />
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-gray-700 mb-1">Orario</label>
                      <input type="time" value={form.orario} onChange={e => setForm({ ...form, orario: e.target.value })}
                        className="w-full border border-gray-300 rounded-xl px-4 py-3" />
                    </div>
                  </div>
                </>
              )}

              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">Livello gara *</label>
                <select value={form.livello} onChange={e => setForm({ ...form, livello: e.target.value })} className="w-full border border-gray-300 rounded-xl px-4 py-3" required>
                  <option value="">Seleziona livello...</option>
                  {LIVELLI_GARA.map(l => <option key={l} value={l}>{l}</option>)}
                </select>
              </div>

              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">Note</label>
                <textarea value={form.note} onChange={e => setForm({ ...form, note: e.target.value })}
                  className="w-full border border-gray-300 rounded-xl px-4 py-3" placeholder="Es: cerco qualcuno con cui allenarsi prima della gara" rows={2} />
              </div>

              <button type="submit" className={`w-full py-4 rounded-xl font-semibold shadow-lg text-white ${tipo === 'follower' ? 'bg-gradient-to-r from-orange-400 to-red-500' : 'bg-gradient-to-r from-blue-500 to-indigo-600'}`}>
                Pubblica Richiesta
              </button>
            </form>
          </div>
        </div>
      );
    }

    // ==================== CREATE EVENT MODAL ====================
    function CreateEventModal({ currentUser, locali, onSubmit, onClose, editEvent }) {
      const isEdit = !!editEvent;
      const getInitialForm = () => editEvent ? {
        titolo: editEvent.titolo || '',
        locale: editEvent.locale || '',
        localeAltro: '',
        descrizione: editEvent.descrizione || '',
        link: editEvent.link || '',
        data: editEvent.data || '',
        orario: editEvent.orario || '22:00',
        image: editEvent.image || '',
        mllPresente: editEvent.mllPresente || false,
        serataConGara: editEvent.serataConGara || false
      } : { 
        titolo: '', 
        locale: currentUser.tipoUtente === 'locale' ? currentUser.nome : '', 
        localeAltro: '', 
        descrizione: '', 
        link: '',
        data: '', 
        orario: '22:00', 
        image: '',
        mllPresente: false,
        serataConGara: false
      };
      
      const [form, setForm] = useState(getInitialForm());
      const imgRef = useRef();

      // Sincronizza form quando editEvent cambia
      useEffect(() => {
        setForm(getInitialForm());
      }, [editEvent?.id]);

      const handleImg = async e => { if (e.target.files[0]) setForm({ ...form, image: await compressImage(e.target.files[0], 800, 0.85) }); };

      const handleSubmit = e => {
        e.preventDefault();
        if (!form.titolo || !form.data) return;
        const localeNome = form.locale === 'altro' ? form.localeAltro : (currentUser.tipoUtente === 'locale' ? currentUser.nome : locali.find(l => l.id === form.locale)?.nome || form.locale);
        if (isEdit) {
          onSubmit({ ...editEvent, ...form, locale: localeNome });
        } else {
          onSubmit({ ...form, locale: localeNome });
        }
      };

      return (
        <div className="fixed inset-0 bg-black/50 flex items-end justify-center z-50" onClick={onClose}>
          <div className="bg-white rounded-t-3xl w-full max-w-lg p-5 max-h-[90vh] overflow-y-auto slide-up" onClick={e => e.stopPropagation()}>
            <div className="flex justify-between items-center mb-4">
              <h2 className="text-xl font-bold">{isEdit ? '✏️ Modifica Serata' : '✨ Nuova Serata'}</h2>
              <button onClick={onClose} className="text-gray-400 p-2"><Icons.X size={24} /></button>
            </div>
            <form onSubmit={handleSubmit} className="space-y-4">
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-2">📷 Locandina</label>
                {form.image ? (
                  <div className="relative">
                    <img src={form.image} alt="" className="w-full max-h-64 object-contain bg-gray-100 rounded-xl" />
                    <button type="button" onClick={() => setForm({ ...form, image: '' })} className="absolute top-2 right-2 bg-red-500 text-white rounded-full p-1"><Icons.X size={16} /></button>
                  </div>
                ) : (
                  <button type="button" onClick={() => imgRef.current?.click()} className="w-full h-32 border-2 border-dashed border-gray-300 rounded-xl flex flex-col items-center justify-center text-gray-400 hover:border-pink-400">
                    <Icons.Image size={32} /><span className="text-sm mt-2">Carica</span>
                  </button>
                )}
                <input ref={imgRef} type="file" accept="image/*" onChange={handleImg} className="hidden" />
              </div>
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">Titolo *</label>
                <input type="text" value={form.titolo} onChange={e => setForm({ ...form, titolo: e.target.value })} className="w-full border border-gray-300 rounded-xl px-4 py-3" placeholder="Es: Bachata Night" required />
              </div>
              {currentUser.tipoUtente !== 'locale' && !isEdit && (
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">Locale *</label>
                  <select value={form.locale} onChange={e => setForm({ ...form, locale: e.target.value })} className="w-full border border-gray-300 rounded-xl px-4 py-3" required>
                    <option value="">Seleziona...</option>
                    {locali.map(l => <option key={l.id} value={l.id}>{l.nome}</option>)}
                    <option value="altro">Altro...</option>
                  </select>
                </div>
              )}
              {isEdit && (
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-1">Locale</label>
                  <input type="text" value={form.locale} onChange={e => setForm({ ...form, locale: e.target.value })} className="w-full border border-gray-300 rounded-xl px-4 py-3" />
                </div>
              )}
              {form.locale === 'altro' && <input type="text" value={form.localeAltro} onChange={e => setForm({ ...form, localeAltro: e.target.value })} className="w-full border border-gray-300 rounded-xl px-4 py-3" placeholder="Nome locale" required />}
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">📝 Descrizione / Copy</label>
                <textarea value={form.descrizione} onChange={e => setForm({ ...form, descrizione: e.target.value })} className="w-full border border-gray-300 rounded-xl px-4 py-3" rows={4} placeholder="Scrivi una descrizione accattivante per l'evento..." />
              </div>
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">🔗 Link (biglietti, info, ecc.)</label>
                <input type="url" value={form.link} onChange={e => setForm({ ...form, link: e.target.value })} className="w-full border border-gray-300 rounded-xl px-4 py-3" placeholder="https://..." />
              </div>
              <div className="grid grid-cols-2 gap-4">
                <div><label className="block text-sm font-medium text-gray-700 mb-1">Data *</label><input type="date" value={form.data} onChange={e => setForm({ ...form, data: e.target.value })} className="w-full border border-gray-300 rounded-xl px-4 py-3" required /></div>
                <div><label className="block text-sm font-medium text-gray-700 mb-1">Orario *</label><input type="time" value={form.orario} onChange={e => setForm({ ...form, orario: e.target.value })} className="w-full border border-gray-300 rounded-xl px-4 py-3" required /></div>
              </div>
              {/* Toggle MLL Presente - Solo Admin */}
              {currentUser.isAdmin && (
                <div className="bg-blue-50 border border-blue-200 rounded-xl p-4">
                  <label className="flex items-center gap-3 cursor-pointer">
                    <input type="checkbox" checked={form.mllPresente} onChange={e => setForm({ ...form, mllPresente: e.target.checked })} 
                      className="w-5 h-5 rounded text-blue-600 border-gray-300 focus:ring-blue-500" />
                    <div className="flex-1">
                      <p className="font-semibold text-gray-800 flex items-center gap-2">⭐ Milano Latin Lovers presente</p>
                      <p className="text-xs text-gray-500">Mostra badge blu sulla locandina</p>
                    </div>
                  </label>
                  {form.mllPresente && (
                    <div className="mt-2 bg-blue-600 text-white text-xs font-bold text-center py-1 px-2 rounded">
                      MILANO LATIN LOVERS
                    </div>
                  )}
                </div>
              )}
              {/* Toggle Serata con Gara */}
              <div className="bg-yellow-50 border border-yellow-300 rounded-xl p-4">
                <label className="flex items-center gap-3 cursor-pointer">
                  <input type="checkbox" checked={form.serataConGara} onChange={e => setForm({ ...form, serataConGara: e.target.checked })} 
                    className="w-5 h-5 rounded text-yellow-600 border-gray-300 focus:ring-yellow-500" />
                  <div className="flex-1">
                    <p className="font-semibold text-gray-800 flex items-center gap-2">🏆 Serata con Gara</p>
                    <p className="text-xs text-gray-500">Mostra banner rosso e abilita ricerca partner</p>
                  </div>
                </label>
                {form.serataConGara && (
                  <div className="mt-2 text-white text-xs font-bold text-center py-1 px-2 rounded" style={{backgroundColor: '#ef4444'}}>
                    🏆 SERATA CON GARA
                  </div>
                )}
              </div>
              <button type="submit" className="w-full bg-gradient-to-r from-pink-500 to-purple-500 text-white py-4 rounded-xl font-semibold shadow-lg">{isEdit ? 'Salva Modifiche' : 'Pubblica'}</button>
            </form>
          </div>
        </div>
      );
    }

    // ==================== SEARCH TAB ====================
    function SearchTab({ passaggi, gare, eventi, currentUser, users, getUserRating, onBook, onRespondGara, onUserClick }) {
      const [filtroPassaggi, setFiltroPassaggi] = useState({ data: '' });
      const [filtroGare, setFiltroGare] = useState({ tipo: '', livello: '' });
      const [view, setView] = useState('split'); // 'split', 'passaggi', 'gare'
      
      const filteredPassaggi = passaggi.filter(p => !filtroPassaggi.data || p.data === filtroPassaggi.data);
      const gareDisponibili = gare.filter(g => g.stato === 'aperto' && g.creatorId !== currentUser?.id && !isScadutoDaOre(g.data, g.orario || '23:59', 6));
      const filteredGare = gareDisponibili.filter(g => (!filtroGare.tipo || g.cercaTipo === filtroGare.tipo) && (!filtroGare.livello || g.livello === filtroGare.livello));

      return (
        <div>
          <h2 className="text-lg font-bold text-gray-800 mb-3">🔍 Cerca</h2>
          
          {/* Toggle View */}
          <div className="flex gap-1 mb-4 bg-gray-100 p-1 rounded-xl">
            <button onClick={() => setView('split')} className={`flex-1 py-2 rounded-lg text-xs font-medium ${view === 'split' ? 'bg-white text-pink-500 shadow' : 'text-gray-500'}`}>Tutto</button>
            <button onClick={() => setView('passaggi')} className={`flex-1 py-2 rounded-lg text-xs font-medium ${view === 'passaggi' ? 'bg-white text-pink-500 shadow' : 'text-gray-500'}`}>🚗 Passaggi ({filteredPassaggi.length})</button>
            <button onClick={() => setView('gare')} className={`flex-1 py-2 rounded-lg text-xs font-medium ${view === 'gare' ? 'bg-white text-orange-500 shadow' : 'text-gray-500'}`}>🏆 Gare ({filteredGare.length})</button>
          </div>

          {view === 'split' ? (
            <div className="grid grid-cols-2 gap-3">
              {/* Colonna Passaggi */}
              <div className="bg-white rounded-xl shadow-sm p-3">
                <div className="flex justify-between items-center mb-2">
                  <h3 className="text-sm font-bold text-gray-800">🚗 Passaggi</h3>
                  {filteredPassaggi.length > 0 && <span className="bg-pink-100 text-pink-600 text-xs px-2 py-0.5 rounded-full">{filteredPassaggi.length}</span>}
                </div>
                <input type="date" value={filtroPassaggi.data} onChange={e => setFiltroPassaggi({ ...filtroPassaggi, data: e.target.value })} className="w-full border border-gray-200 rounded-lg px-2 py-1.5 text-xs mb-2 bg-gray-50" min={new Date().toISOString().split('T')[0]} />
                <div className="space-y-2 max-h-[55vh] overflow-y-auto no-scrollbar">
                  {filteredPassaggi.length === 0 ? (
                    <p className="text-xs text-gray-400 text-center py-4">Nessun passaggio</p>
                  ) : filteredPassaggi.slice(0, 10).map(p => (
                    <MiniRideCard key={p.id} p={p} currentUser={currentUser} users={users} getUserRating={getUserRating} onBook={onBook} onUserClick={onUserClick} />
                  ))}
                  {filteredPassaggi.length > 10 && <button onClick={() => setView('passaggi')} className="w-full text-pink-500 text-xs font-medium pt-1">+{filteredPassaggi.length - 10} altri →</button>}
                </div>
              </div>
              
              {/* Colonna Gare */}
              <div className="bg-white rounded-xl shadow-sm p-3">
                <div className="flex justify-between items-center mb-2">
                  <h3 className="text-sm font-bold text-gray-800">🏆 Gare</h3>
                  {filteredGare.length > 0 && <span className="bg-orange-100 text-orange-600 text-xs px-2 py-0.5 rounded-full">{filteredGare.length}</span>}
                </div>
                <select value={filtroGare.tipo} onChange={e => setFiltroGare({ ...filtroGare, tipo: e.target.value })} className="w-full border border-gray-200 rounded-lg px-2 py-1.5 text-xs mb-2 bg-gray-50">
                  <option value="">Tutti i ruoli</option>
                  <option value="follower">💃 Follower</option>
                  <option value="leader">🕺 Leader</option>
                </select>
                <div className="space-y-2 max-h-[55vh] overflow-y-auto no-scrollbar">
                  {filteredGare.length === 0 ? (
                    <p className="text-xs text-gray-400 text-center py-4">Nessuna richiesta</p>
                  ) : filteredGare.slice(0, 10).map(g => (
                    <MiniGaraCard key={g.id} g={g} currentUser={currentUser} users={users} getUserRating={getUserRating} onRespond={onRespondGara} onUserClick={onUserClick} />
                  ))}
                  {filteredGare.length > 10 && <button onClick={() => setView('gare')} className="w-full text-orange-500 text-xs font-medium pt-1">+{filteredGare.length - 10} altre →</button>}
                </div>
              </div>
            </div>
          ) : view === 'passaggi' ? (
            <div>
              <div className="mb-3">
                <input type="date" value={filtroPassaggi.data} onChange={e => setFiltroPassaggi({ ...filtroPassaggi, data: e.target.value })} className="w-full border border-gray-300 rounded-xl px-3 py-2 text-sm" min={new Date().toISOString().split('T')[0]} placeholder="Filtra per data" />
              </div>
              {filteredPassaggi.length === 0 ? (
                <div className="text-center py-10"><Icons.Car size={48} className="mx-auto text-gray-300 mb-4" /><p className="text-gray-500">Nessun passaggio</p></div>
              ) : (
                <div className="space-y-3">
                  {filteredPassaggi.map(p => <RideCard key={p.id} p={p} currentUser={currentUser} users={users} getUserRating={getUserRating} onBook={onBook} onUserClick={onUserClick} />)}
                </div>
              )}
            </div>
          ) : (
            <div>
              <div className="grid grid-cols-2 gap-2 mb-3">
                <select value={filtroGare.tipo} onChange={e => setFiltroGare({ ...filtroGare, tipo: e.target.value })} className="border border-gray-300 rounded-xl px-3 py-2 text-sm">
                  <option value="">Tutti i ruoli</option>
                  <option value="follower">💃 Follower</option>
                  <option value="leader">🕺 Leader</option>
                </select>
                <select value={filtroGare.livello} onChange={e => setFiltroGare({ ...filtroGare, livello: e.target.value })} className="border border-gray-300 rounded-xl px-3 py-2 text-sm">
                  <option value="">Tutti i livelli</option>
                  {LIVELLI_GARA.map(l => <option key={l} value={l}>{l}</option>)}
                </select>
              </div>
              {filteredGare.length === 0 ? (
                <div className="text-center py-10"><Icons.Trophy size={48} className="mx-auto text-gray-300 mb-4" /><p className="text-gray-500">Nessuna gara</p></div>
              ) : (
                <div className="space-y-3">
                  {filteredGare.map(g => <GaraCard key={g.id} g={g} currentUser={currentUser} users={users} getUserRating={getUserRating} onRespond={onRespondGara} onUserClick={onUserClick} />)}
                </div>
              )}
            </div>
          )}
        </div>
      );
    }

    // ==================== MINI RIDE CARD ====================
    function MiniRideCard({ p, currentUser, users, getUserRating, onBook, onUserClick }) {
      const posti = p.maxPasseggeri - p.passeggeri.length;
      const booked = p.passeggeri.some(x => x.userId === currentUser?.id);
      const scaduto = isPassaggioScaduto(p.data, p.orario);
      const driver = users?.[p.driverId];

      return (
        <div className={`bg-white rounded-xl p-3 shadow-sm border ${scaduto ? 'border-red-200 bg-red-50/30' : ''}`}>
          <div className="flex items-center gap-2 mb-2">
            <ProfileImage src={p.driverImage} name={p.driverName} size={32} onClick={() => driver && onUserClick?.(driver)} />
            <div className="flex-1 min-w-0">
              <p className="text-xs font-semibold truncate">{p.driverName}</p>
              <p className="text-[10px] text-purple-600 truncate">{p.locale}</p>
            </div>
            <span className={`text-[10px] px-1.5 py-0.5 rounded-full ${posti > 0 ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'}`}>{posti}p</span>
          </div>
          <div className="flex items-center justify-between text-[10px] text-gray-500 mb-2">
            <span>{formatDate(p.data)} • {p.orario}</span>
            {scaduto && <span className="bg-red-500 text-white px-1 rounded text-[8px]">SCADUTO</span>}
          </div>
          {!scaduto && (
            <div className="flex gap-1">
              <a href={`https://wa.me/${p.driverTelefono?.replace(/\D/g, '')}`} target="_blank" className="flex-1 border border-gray-200 py-1.5 rounded-lg text-[10px] text-center">💬</a>
              {!booked ? (
                <button onClick={() => posti > 0 && onBook(p.id, true)} disabled={posti === 0} className={`flex-1 py-1.5 rounded-lg text-[10px] ${posti > 0 ? 'bg-pink-500 text-white' : 'bg-gray-200 text-gray-400'}`}>
                  {posti > 0 ? 'Prenota' : 'Full'}
                </button>
              ) : (
                <span className="flex-1 py-1.5 rounded-lg bg-green-100 text-green-700 text-[10px] text-center">✓</span>
              )}
            </div>
          )}
        </div>
      );
    }

    // ==================== MINI GARA CARD ====================
    function MiniGaraCard({ g, currentUser, users, getUserRating, onRespond, onUserClick }) {
      const scaduto = isPassaggioScaduto(g.data, g.orario || '23:59');
      const haCandidato = g.risposte.some(r => r.userId === currentUser?.id);
      const creator = users?.[g.creatorId];

      return (
        <div className={`bg-white rounded-xl p-3 shadow-sm border ${scaduto ? 'border-red-200 bg-red-50/30' : ''}`}>
          <div className="flex items-center gap-2 mb-2">
            <ProfileImage src={g.creatorImage} name={g.creatorName} size={32} onClick={() => creator && onUserClick?.(creator)} />
            <div className="flex-1 min-w-0">
              <p className="text-xs font-semibold truncate">{g.creatorName}</p>
              <p className="text-[10px] text-purple-600 truncate">{g.locale}</p>
            </div>
            <span className={`text-[10px] px-1.5 py-0.5 rounded font-bold ${g.cercaTipo === 'follower' ? 'bg-red-100 text-red-600' : 'bg-blue-100 text-blue-600'}`}>
              {g.cercaTipo === 'follower' ? '💃' : '🕺'}
            </span>
          </div>
          <div className="flex items-center justify-between text-[10px] mb-2">
            <span className="text-gray-500">{formatDate(g.data)}</span>
            <span className="text-orange-500 font-medium truncate max-w-[60%]">{g.livello}</span>
          </div>
          {!scaduto && (
            <div className="flex gap-1">
              <a href={`https://wa.me/${g.creatorTelefono?.replace(/\D/g, '')}`} target="_blank" className="flex-1 border border-gray-200 py-1.5 rounded-lg text-[10px] text-center">💬</a>
              {!haCandidato ? (
                <button onClick={() => onRespond(g.id)} className="flex-1 py-1.5 rounded-lg text-[10px] bg-gradient-to-r from-orange-400 to-red-500 text-white">Candida</button>
              ) : (
                <span className="flex-1 py-1.5 rounded-lg bg-green-100 text-green-700 text-[10px] text-center">✓</span>
              )}
            </div>
          )}
        </div>
      );
    }

    // ==================== RIDE CARD ====================
    function RideCard({ p, currentUser, users, getUserRating, onBook, onUserClick }) {
      const posti = p.maxPasseggeri - p.passeggeri.length;
      const booked = p.passeggeri.some(x => x.userId === currentUser?.id);
      const scaduto = isPassaggioScaduto(p.data, p.orario);
      const driver = users?.[p.driverId];
      const rating = getUserRating?.(p.driverId);

      return (
        <div className={`bg-white rounded-2xl p-4 shadow-sm border ${scaduto ? 'border-red-200 bg-red-50/30' : ''}`}>
          <div className="flex items-start gap-3 mb-3">
            <ProfileImage src={p.driverImage} name={p.driverName} size={48} onClick={() => driver && onUserClick?.(driver)} />
            <div className="flex-1 min-w-0">
              <div className="flex items-center gap-2 flex-wrap">
                <p className="font-semibold text-gray-800 cursor-pointer hover:text-pink-500" onClick={() => driver && onUserClick?.(driver)}>{p.driverName}</p>
                <RatingBadge rating={rating} size="small" />
                {p.driverInstagram && <a href={`https://instagram.com/${p.driverInstagram}`} target="_blank" className="text-pink-500"><Icons.Instagram size={14} /></a>}
              </div>
              <p className="text-sm text-purple-600 font-medium">{p.locale}</p>
              {p.eventoTitolo && <p className="text-xs text-pink-500">📌 {p.eventoTitolo}</p>}
            </div>
            <div className="flex flex-col items-end gap-1">
              <span className={`text-xs px-2 py-1 rounded-full ${posti > 1 ? 'bg-green-100 text-green-700' : 'bg-orange-100 text-orange-700'}`}>{posti} posti</span>
              {scaduto && <span className="bg-red-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">SCADUTO</span>}
            </div>
          </div>
          <div className="space-y-1 mb-3 text-sm text-gray-600">
            <p className={`flex items-center gap-2 ${scaduto ? 'text-red-500' : ''}`}><Icons.Calendar size={14} className="text-gray-400" />{formatDate(p.data)} • {p.orario}</p>
            <p className="flex items-center gap-2"><Icons.MapPin size={14} className="text-gray-400" />Da: <strong>{p.zonaPartenza}</strong></p>
            {p.ritorno && <p className="text-green-600 flex items-center gap-1"><Icons.Check size={14} />Offre ritorno</p>}
          </div>
          {p.note && <p className="text-sm text-gray-500 bg-gray-50 p-2 rounded-lg mb-3">{p.note}</p>}
          {scaduto ? <div className="bg-red-100 text-red-600 py-2.5 rounded-xl text-center text-sm font-medium">Scaduto</div> : (
            <div className="flex gap-2">
              {p.accettaWhatsapp !== false && <a href={`https://wa.me/${p.driverTelefono.replace(/\D/g, '')}?text=Ciao! Passaggio per ${p.locale} il ${formatDate(p.data)}`} target="_blank" className="flex-1 border border-gray-300 py-2.5 rounded-xl font-medium flex items-center justify-center gap-2 hover:bg-gray-50"><Icons.MessageCircle size={18} /> WhatsApp</a>}
              {!booked ? (p.accettaPrenotazioni !== false ? <button onClick={() => posti > 0 && onBook(p.id, true)} disabled={posti === 0} className={`flex-1 py-2.5 rounded-xl font-medium ${posti > 0 ? 'bg-pink-500 text-white' : 'bg-gray-200 text-gray-400'}`}>{posti > 0 ? 'Prenota' : 'Completo'}</button> : null)
                : <span className="flex-1 py-2.5 rounded-xl bg-green-100 text-green-700 text-center flex items-center justify-center gap-2"><Icons.Check size={18} /> Prenotato</span>}
            </div>
          )}
        </div>
      );
    }

    // ==================== MY RIDES ====================
    function MyRidesTab({ mieiPassaggi, miePrenotazioni, mieGare, mieCandidature, currentUser, users, getUserRating, onConfirm, onCancel, onDeleteRide, onDeleteGara, onUserClick }) {
      const [passaggiTab, setPassaggiTab] = useState('offerti');
      const [gareTab, setGareTab] = useState('mie');
      const [view, setView] = useState('split'); // 'split', 'passaggi', 'gare'
      const [confirmDel, setConfirmDel] = useState(null);

      const totalPassaggi = mieiPassaggi.length + miePrenotazioni.length;
      const totalGare = (mieGare?.length || 0) + (mieCandidature?.length || 0);

      return (
        <div>
          <h2 className="text-lg font-bold text-gray-800 mb-3">📋 I Miei</h2>
          
          {/* Toggle View */}
          <div className="flex gap-1 mb-4 bg-gray-100 p-1 rounded-xl">
            <button onClick={() => setView('split')} className={`flex-1 py-2 rounded-lg text-xs font-medium ${view === 'split' ? 'bg-white text-pink-500 shadow' : 'text-gray-500'}`}>Tutto</button>
            <button onClick={() => setView('passaggi')} className={`flex-1 py-2 rounded-lg text-xs font-medium ${view === 'passaggi' ? 'bg-white text-pink-500 shadow' : 'text-gray-500'}`}>🚗 Passaggi ({totalPassaggi})</button>
            <button onClick={() => setView('gare')} className={`flex-1 py-2 rounded-lg text-xs font-medium ${view === 'gare' ? 'bg-white text-orange-500 shadow' : 'text-gray-500'}`}>🏆 Gare ({totalGare})</button>
          </div>

          {view === 'split' ? (
            <div className="grid grid-cols-2 gap-3">
              {/* Colonna Passaggi */}
              <div className="bg-white rounded-xl shadow-sm p-3">
                <div className="flex justify-between items-center mb-2">
                  <h3 className="text-sm font-bold text-gray-800">🚗 Passaggi</h3>
                  {totalPassaggi > 0 && <span className="bg-pink-100 text-pink-600 text-xs px-2 py-0.5 rounded-full">{totalPassaggi}</span>}
                </div>
                <div className="flex gap-1 mb-2 bg-gray-100 p-0.5 rounded-lg">
                  <button onClick={() => setPassaggiTab('offerti')} className={`flex-1 py-1.5 rounded text-[10px] font-medium ${passaggiTab === 'offerti' ? 'bg-white text-pink-500 shadow-sm' : 'text-gray-500'}`}>Offerti ({mieiPassaggi.length})</button>
                  <button onClick={() => setPassaggiTab('prenotati')} className={`flex-1 py-1.5 rounded text-[10px] font-medium ${passaggiTab === 'prenotati' ? 'bg-white text-pink-500 shadow-sm' : 'text-gray-500'}`}>Prenotati ({miePrenotazioni.length})</button>
                </div>
                <div className="space-y-2 max-h-[55vh] overflow-y-auto no-scrollbar">
                  {passaggiTab === 'offerti' ? (
                    mieiPassaggi.length === 0 ? <p className="text-xs text-gray-400 text-center py-4">Nessun passaggio</p> :
                    mieiPassaggi.slice(0, 5).map(p => <MiniMyRideCard key={p.id} p={p} type="offerto" users={users} onConfirm={onConfirm} onDelete={() => setConfirmDel(p.id)} onUserClick={onUserClick} confirmDel={confirmDel} setConfirmDel={setConfirmDel} onDeleteRide={onDeleteRide} />)
                  ) : (
                    miePrenotazioni.length === 0 ? <p className="text-xs text-gray-400 text-center py-4">Nessuna prenotazione</p> :
                    miePrenotazioni.slice(0, 5).map(p => <MiniMyRideCard key={p.id} p={p} type="prenotato" users={users} onCancel={onCancel} onUserClick={onUserClick} />)
                  )}
                  {passaggiTab === 'offerti' && mieiPassaggi.length > 5 && <button onClick={() => setView('passaggi')} className="w-full text-pink-500 text-xs font-medium pt-1">+{mieiPassaggi.length - 5} altri →</button>}
                  {passaggiTab === 'prenotati' && miePrenotazioni.length > 5 && <button onClick={() => setView('passaggi')} className="w-full text-pink-500 text-xs font-medium pt-1">+{miePrenotazioni.length - 5} altre →</button>}
                </div>
              </div>
              
              {/* Colonna Gare */}
              <div className="bg-white rounded-xl shadow-sm p-3">
                <div className="flex justify-between items-center mb-2">
                  <h3 className="text-sm font-bold text-gray-800">🏆 Gare</h3>
                  {totalGare > 0 && <span className="bg-orange-100 text-orange-600 text-xs px-2 py-0.5 rounded-full">{totalGare}</span>}
                </div>
                <div className="flex gap-1 mb-2 bg-gray-100 p-0.5 rounded-lg">
                  <button onClick={() => setGareTab('mie')} className={`flex-1 py-1.5 rounded text-[10px] font-medium ${gareTab === 'mie' ? 'bg-white text-orange-500 shadow-sm' : 'text-gray-500'}`}>Mie ({mieGare?.length || 0})</button>
                  <button onClick={() => setGareTab('candidature')} className={`flex-1 py-1.5 rounded text-[10px] font-medium ${gareTab === 'candidature' ? 'bg-white text-orange-500 shadow-sm' : 'text-gray-500'}`}>Cand. ({mieCandidature?.length || 0})</button>
                </div>
                <div className="space-y-2 max-h-[55vh] overflow-y-auto no-scrollbar">
                  {gareTab === 'mie' ? (
                    !mieGare || mieGare.length === 0 ? <p className="text-xs text-gray-400 text-center py-4">Nessuna richiesta</p> :
                    mieGare.slice(0, 5).map(g => <MiniMyGaraCard key={g.id} g={g} type="mia" users={users} getUserRating={getUserRating} onDelete={() => setConfirmDel(`gara_${g.id}`)} onUserClick={onUserClick} confirmDel={confirmDel} setConfirmDel={setConfirmDel} onDeleteGara={onDeleteGara} />)
                  ) : (
                    !mieCandidature || mieCandidature.length === 0 ? <p className="text-xs text-gray-400 text-center py-4">Nessuna candidatura</p> :
                    mieCandidature.slice(0, 5).map(g => <MiniMyGaraCard key={g.id} g={g} type="candidatura" users={users} onUserClick={onUserClick} />)
                  )}
                  {gareTab === 'mie' && mieGare?.length > 5 && <button onClick={() => setView('gare')} className="w-full text-orange-500 text-xs font-medium pt-1">+{mieGare.length - 5} altre →</button>}
                  {gareTab === 'candidature' && mieCandidature?.length > 5 && <button onClick={() => setView('gare')} className="w-full text-orange-500 text-xs font-medium pt-1">+{mieCandidature.length - 5} altre →</button>}
                </div>
              </div>
            </div>
          ) : view === 'passaggi' ? (
            <div>
              <div className="flex gap-1 mb-3 bg-gray-100 p-1 rounded-xl">
                <button onClick={() => setPassaggiTab('offerti')} className={`flex-1 py-2 rounded-lg text-xs font-medium ${passaggiTab === 'offerti' ? 'bg-white text-pink-500 shadow' : 'text-gray-500'}`}>🚗 Offerti ({mieiPassaggi.length})</button>
                <button onClick={() => setPassaggiTab('prenotati')} className={`flex-1 py-2 rounded-lg text-xs font-medium ${passaggiTab === 'prenotati' ? 'bg-white text-pink-500 shadow' : 'text-gray-500'}`}>📅 Prenotati ({miePrenotazioni.length})</button>
              </div>
              {passaggiTab === 'offerti' ? (
                mieiPassaggi.length === 0 ? <div className="text-center py-10"><Icons.Car size={48} className="mx-auto text-gray-300 mb-4" /><p className="text-gray-500">Nessun passaggio</p></div> :
                <div className="space-y-3">{mieiPassaggi.map(p => <FullMyRideCard key={p.id} p={p} type="offerto" users={users} getUserRating={getUserRating} onConfirm={onConfirm} onDeleteRide={onDeleteRide} onUserClick={onUserClick} confirmDel={confirmDel} setConfirmDel={setConfirmDel} />)}</div>
              ) : (
                miePrenotazioni.length === 0 ? <div className="text-center py-10"><Icons.Calendar size={48} className="mx-auto text-gray-300 mb-4" /><p className="text-gray-500">Nessuna prenotazione</p></div> :
                <div className="space-y-3">{miePrenotazioni.map(p => <FullMyRideCard key={p.id} p={p} type="prenotato" users={users} getUserRating={getUserRating} onCancel={onCancel} onUserClick={onUserClick} />)}</div>
              )}
            </div>
          ) : (
            <div>
              <div className="flex gap-1 mb-3 bg-gray-100 p-1 rounded-xl">
                <button onClick={() => setGareTab('mie')} className={`flex-1 py-2 rounded-lg text-xs font-medium ${gareTab === 'mie' ? 'bg-white text-orange-500 shadow' : 'text-gray-500'}`}>🏆 Mie Richieste ({mieGare?.length || 0})</button>
                <button onClick={() => setGareTab('candidature')} className={`flex-1 py-2 rounded-lg text-xs font-medium ${gareTab === 'candidature' ? 'bg-white text-orange-500 shadow' : 'text-gray-500'}`}>✋ Candidature ({mieCandidature?.length || 0})</button>
              </div>
              {gareTab === 'mie' ? (
                !mieGare || mieGare.length === 0 ? <div className="text-center py-10"><Icons.Trophy size={48} className="mx-auto text-gray-300 mb-4" /><p className="text-gray-500">Nessuna richiesta</p></div> :
                <div className="space-y-3">{mieGare.map(g => <FullMyGaraCard key={g.id} g={g} type="mia" users={users} getUserRating={getUserRating} onDeleteGara={onDeleteGara} onUserClick={onUserClick} confirmDel={confirmDel} setConfirmDel={setConfirmDel} />)}</div>
              ) : (
                !mieCandidature || mieCandidature.length === 0 ? <div className="text-center py-10"><Icons.User size={48} className="mx-auto text-gray-300 mb-4" /><p className="text-gray-500">Nessuna candidatura</p></div> :
                <div className="space-y-3">{mieCandidature.map(g => <FullMyGaraCard key={g.id} g={g} type="candidatura" users={users} onUserClick={onUserClick} />)}</div>
              )}
            </div>
          )}
        </div>
      );
    }

    // ==================== PASSAGGI TAB (UNIFICATO) ====================
    function PassaggiTab({ passaggiDisponibili, mieiPassaggi, miePrenotazioni, richiesteDisponibili, mieRichieste, gareDisponibili, mieGare, mieCandidature, eventi, currentUser, users, getUserRating, onBook, onRespondGara, onConfirm, onCancel, onDeleteRide, onDeleteGara, onDeleteRichiesta, onUserClick, onMessage }) {
      const [mainTab, setMainTab] = useState('disponibili'); // 'disponibili' | 'miei'
      const [filtroData, setFiltroData] = useState('');
      const [passaggiSubTab, setPassaggiSubTab] = useState('passaggi'); // 'passaggi' | 'richieste' | 'gare'
      const [mieiSubTab, setMieiSubTab] = useState('offerti'); // 'offerti' | 'prenotati' | 'richieste' | 'mieGare'
      const [confirmDel, setConfirmDel] = useState(null);

      const filteredDisponibili = passaggiDisponibili.filter(p => !filtroData || p.data === filtroData);
      const filteredMiei = mieiPassaggi.filter(p => !filtroData || p.data === filtroData);
      const filteredPrenotazioni = miePrenotazioni.filter(p => !filtroData || p.data === filtroData);
      const filteredRichieste = (richiesteDisponibili || []).filter(r => !filtroData || r.data === filtroData);
      const filteredMieRichieste = (mieRichieste || []).filter(r => !filtroData || r.data === filtroData);

      return (
        <div>
          {/* Main Toggle */}
          <div className="flex gap-1 mb-3 bg-gray-100 p-1 rounded-xl">
            <button onClick={() => setMainTab('disponibili')} className={`flex-1 py-2.5 rounded-lg text-sm font-medium transition ${mainTab === 'disponibili' ? 'bg-white text-pink-500 shadow' : 'text-gray-500'}`}>
              🔍 Disponibili
            </button>
            <button onClick={() => setMainTab('miei')} className={`flex-1 py-2.5 rounded-lg text-sm font-medium transition ${mainTab === 'miei' ? 'bg-white text-pink-500 shadow' : 'text-gray-500'}`}>
              🚗 I Miei
            </button>
          </div>

          {/* Filtro Data */}
          <div className="mb-3">
            <input type="date" value={filtroData} onChange={e => setFiltroData(e.target.value)} 
              className="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm bg-white" 
              min={new Date().toISOString().split('T')[0]} placeholder="Filtra per data" />
          </div>

          {mainTab === 'disponibili' ? (
            <>
              {/* Sub-tabs Disponibili */}
              <div className="flex gap-1 mb-3 bg-gray-50 p-1 rounded-lg">
                <button onClick={() => setPassaggiSubTab('passaggi')} className={`flex-1 py-2 rounded-lg text-xs font-medium ${passaggiSubTab === 'passaggi' ? 'bg-white text-pink-500 shadow-sm' : 'text-gray-500'}`}>
                  🚗 Offerte ({filteredDisponibili.length})
                </button>
                <button onClick={() => setPassaggiSubTab('richieste')} className={`flex-1 py-2 rounded-lg text-xs font-medium ${passaggiSubTab === 'richieste' ? 'bg-white text-purple-500 shadow-sm' : 'text-gray-500'}`}>
                  🔍 Richieste ({filteredRichieste.length})
                </button>
                <button onClick={() => setPassaggiSubTab('gare')} className={`flex-1 py-2 rounded-lg text-xs font-medium ${passaggiSubTab === 'gare' ? 'bg-white text-orange-500 shadow-sm' : 'text-gray-500'}`}>
                  🏆 Gare ({gareDisponibili.length})
                </button>
              </div>

              {passaggiSubTab === 'passaggi' ? (
                filteredDisponibili.length === 0 ? (
                  <div className="text-center py-10"><Icons.Car size={48} className="mx-auto text-gray-300 mb-4" /><p className="text-gray-500">Nessun passaggio disponibile</p></div>
                ) : (
                  <div className="space-y-3">
                    {filteredDisponibili.map(p => <RideCard key={p.id} p={p} currentUser={currentUser} users={users} getUserRating={getUserRating} onBook={onBook} onUserClick={onUserClick} />)}
                  </div>
                )
              ) : passaggiSubTab === 'richieste' ? (
                filteredRichieste.length === 0 ? (
                  <div className="text-center py-10"><Icons.Search size={48} className="mx-auto text-gray-300 mb-4" /><p className="text-gray-500">Nessuna richiesta di passaggio</p></div>
                ) : (
                  <div className="space-y-3">
                    {filteredRichieste.map(r => <RichiestaCard key={r.id} r={r} users={users} onUserClick={onUserClick} onMessage={onMessage} />)}
                  </div>
                )
              ) : (
                gareDisponibili.length === 0 ? (
                  <div className="text-center py-10"><Icons.Trophy size={48} className="mx-auto text-gray-300 mb-4" /><p className="text-gray-500">Nessuna gara disponibile</p></div>
                ) : (
                  <div className="space-y-3">
                    {gareDisponibili.map(g => <GaraCard key={g.id} g={g} currentUser={currentUser} users={users} getUserRating={getUserRating} onRespond={onRespondGara} onUserClick={onUserClick} />)}
                  </div>
                )
              )}
            </>
          ) : (
            <>
              {/* Sub-tabs I Miei */}
              <div className="flex gap-1 mb-3 bg-gray-50 p-1 rounded-lg overflow-x-auto">
                <button onClick={() => setMieiSubTab('offerti')} className={`flex-1 py-2 rounded-lg text-xs font-medium whitespace-nowrap ${mieiSubTab === 'offerti' ? 'bg-white text-pink-500 shadow-sm' : 'text-gray-500'}`}>
                  Offerti ({filteredMiei.length})
                </button>
                <button onClick={() => setMieiSubTab('prenotati')} className={`flex-1 py-2 rounded-lg text-xs font-medium whitespace-nowrap ${mieiSubTab === 'prenotati' ? 'bg-white text-pink-500 shadow-sm' : 'text-gray-500'}`}>
                  Prenotati ({filteredPrenotazioni.length})
                </button>
                <button onClick={() => setMieiSubTab('richieste')} className={`flex-1 py-2 rounded-lg text-xs font-medium whitespace-nowrap ${mieiSubTab === 'richieste' ? 'bg-white text-purple-500 shadow-sm' : 'text-gray-500'}`}>
                  Richieste ({filteredMieRichieste.length})
                </button>
                <button onClick={() => setMieiSubTab('mieGare')} className={`flex-1 py-2 rounded-lg text-xs font-medium whitespace-nowrap ${mieiSubTab === 'mieGare' ? 'bg-white text-orange-500 shadow-sm' : 'text-gray-500'}`}>
                  Gare ({mieGare?.length || 0})
                </button>
              </div>

              {mieiSubTab === 'offerti' ? (
                filteredMiei.length === 0 ? (
                  <div className="text-center py-10"><Icons.Car size={48} className="mx-auto text-gray-300 mb-4" /><p className="text-gray-500">Nessun passaggio offerto</p></div>
                ) : (
                  <div className="space-y-3">
                    {filteredMiei.map(p => <FullMyRideCard key={p.id} p={p} type="offerto" users={users} getUserRating={getUserRating} onConfirm={onConfirm} onDeleteRide={onDeleteRide} onUserClick={onUserClick} confirmDel={confirmDel} setConfirmDel={setConfirmDel} />)}
                  </div>
                )
              ) : mieiSubTab === 'prenotati' ? (
                filteredPrenotazioni.length === 0 ? (
                  <div className="text-center py-10"><Icons.Calendar size={48} className="mx-auto text-gray-300 mb-4" /><p className="text-gray-500">Nessuna prenotazione</p></div>
                ) : (
                  <div className="space-y-3">
                    {filteredPrenotazioni.map(p => <FullMyRideCard key={p.id} p={p} type="prenotato" users={users} getUserRating={getUserRating} onCancel={onCancel} onUserClick={onUserClick} />)}
                  </div>
                )
              ) : mieiSubTab === 'richieste' ? (
                filteredMieRichieste.length === 0 ? (
                  <div className="text-center py-10"><Icons.Search size={48} className="mx-auto text-gray-300 mb-4" /><p className="text-gray-500">Nessuna richiesta pubblicata</p></div>
                ) : (
                  <div className="space-y-3">
                    {filteredMieRichieste.map(r => <MiaRichiestaCard key={r.id} r={r} onDelete={onDeleteRichiesta} />)}
                  </div>
                )
              ) : (
                (!mieGare || mieGare.length === 0) ? (
                  <div className="text-center py-10"><Icons.Trophy size={48} className="mx-auto text-gray-300 mb-4" /><p className="text-gray-500">Nessuna gara creata</p></div>
                ) : (
                  <div className="space-y-3">
                    {mieGare.map(g => <FullMyGaraCard key={g.id} g={g} type="mia" users={users} getUserRating={getUserRating} onDeleteGara={onDeleteGara} onUserClick={onUserClick} confirmDel={confirmDel} setConfirmDel={setConfirmDel} />)}
                  </div>
                )
              )}
            </>
          )}
        </div>
      );
    }

    // ==================== RICHIESTA CARD ====================
    function RichiestaCard({ r, users, onUserClick, onMessage }) {
      const user = users[r.userId];
      const tipoLabel = r.tipoPassaggio === 'solo-andata' ? '➡️ Solo Andata' : r.tipoPassaggio === 'solo-ritorno' ? '⬅️ Solo Ritorno' : '🔄 Andata e Ritorno';
      
      return (
        <div className="bg-white rounded-xl p-4 shadow-sm border border-purple-100">
          <div className="flex items-start gap-3">
            <div onClick={() => onUserClick?.(user)} className="cursor-pointer">
              <ProfileImage src={r.userImage} name={r.userName} size={48} />
            </div>
            <div className="flex-1 min-w-0">
              <div className="flex items-center gap-2 mb-1">
                <span className="font-bold text-gray-800">{r.userName}</span>
                {user?.preferenzaBallo && (
                  <span className={`text-[9px] px-1.5 py-0.5 rounded font-bold ${
                    user.preferenzaBallo === 'bachata' ? 'bg-orange-500 text-white' :
                    user.preferenzaBallo === 'salsa' ? 'bg-red-500 text-white' :
                    'bg-purple-500 text-white'
                  }`}>
                    {user.preferenzaBallo === 'bachata' ? 'B' : user.preferenzaBallo === 'salsa' ? 'S' : '50'}
                  </span>
                )}
              </div>
              <p className="text-purple-600 font-semibold text-sm">{r.locale}</p>
              <p className="text-xs text-gray-500">{formatDate(r.data)} • {r.orario}</p>
              <div className="flex items-center gap-2 mt-2">
                <span className="bg-purple-100 text-purple-700 text-xs px-2 py-1 rounded-full font-medium">{tipoLabel}</span>
                {r.userZona && <span className="text-xs text-gray-500">📍 {r.userZona}</span>}
              </div>
              {r.note && <p className="text-sm text-gray-600 mt-2 bg-gray-50 p-2 rounded-lg">💬 {r.note}</p>}
            </div>
          </div>
          <div className="flex gap-2 mt-3 pt-3 border-t">
            <button onClick={() => onMessage?.(r.userId)} className="flex-1 bg-blue-500 text-white py-2 rounded-xl text-sm font-medium flex items-center justify-center gap-1">
              <Icons.MessageCircle size={16} /> Contatta
            </button>
            {r.userInstagram && (
              <a href={`https://instagram.com/${r.userInstagram}`} target="_blank" className="bg-gradient-to-br from-purple-500 to-pink-500 text-white px-4 py-2 rounded-xl flex items-center gap-1">
                <Icons.Instagram size={16} />
              </a>
            )}
          </div>
        </div>
      );
    }

    // ==================== MIA RICHIESTA CARD ====================
    function MiaRichiestaCard({ r, onDelete }) {
      const tipoLabel = r.tipoPassaggio === 'solo-andata' ? '➡️ Solo Andata' : r.tipoPassaggio === 'solo-ritorno' ? '⬅️ Solo Ritorno' : '🔄 A/R';
      const scaduta = isPassaggioScaduto(r.data, r.orario);
      
      return (
        <div className={`bg-white rounded-xl p-4 shadow-sm border ${scaduta ? 'border-red-200 bg-red-50/30' : 'border-purple-100'}`}>
          <div className="flex justify-between items-start">
            <div>
              <p className="font-bold text-purple-600">{r.locale}</p>
              <p className="text-sm text-gray-500">{formatDate(r.data)} • {r.orario}</p>
              <span className="inline-block bg-purple-100 text-purple-700 text-xs px-2 py-1 rounded-full font-medium mt-2">{tipoLabel}</span>
              {r.note && <p className="text-sm text-gray-600 mt-2">💬 {r.note}</p>}
            </div>
            <button onClick={() => onDelete(r.id)} className="text-red-400 p-2 hover:bg-red-50 rounded-lg">
              <Icons.Trash size={18} />
            </button>
          </div>
          {scaduta && <p className="text-xs text-red-500 mt-2 font-medium">⚠️ Richiesta scaduta</p>}
        </div>
      );
    }

    // ==================== AMICI TAB ====================
    function AmiciTab({ currentUser, users, followers, onFollow, onUnfollow, onUserClick, onMessage }) {
      const [searchQuery, setSearchQuery] = useState('');
      
      // Ottieni lista amici che seguo
      const following = Object.entries(followers)
        .filter(([userId, followerList]) => followerList.includes(currentUser.id))
        .map(([userId]) => users[userId])
        .filter(Boolean);
      
      // Filtra amici per ricerca
      const filteredFollowing = following.filter(u => 
        !searchQuery || 
        u.nome?.toLowerCase().includes(searchQuery.toLowerCase()) ||
        u.cognome?.toLowerCase().includes(searchQuery.toLowerCase()) ||
        u.instagram?.toLowerCase().includes(searchQuery.toLowerCase())
      );

      // Calcola amici in comune per ogni utente
      const getAmiciInComune = (userId) => {
        const userFollowers = followers[userId] || [];
        const myFollowing = Object.entries(followers)
          .filter(([uid, fList]) => fList.includes(currentUser.id))
          .map(([uid]) => uid);
        return userFollowers.filter(f => myFollowing.includes(f)).length;
      };

      // Suggeriti: utenti che non seguo, ordinati per amici in comune
      const suggeriti = Object.values(users)
        .filter(u => 
          u && 
          u.id !== currentUser.id && 
          u.tipoUtente !== 'locale' &&
          !u.sospeso &&
          !following.some(f => f.id === u.id)
        )
        .map(u => ({ ...u, amiciInComune: getAmiciInComune(u.id) }))
        .sort((a, b) => b.amiciInComune - a.amiciInComune)
        .slice(0, 30);

      return (
        <div>
          <h2 className="text-lg font-bold text-gray-800 mb-3">👥 Amici</h2>
          
          <div className="grid grid-cols-2 gap-3">
            {/* Colonna Sinistra - I Tuoi Amici */}
            <div className="bg-white rounded-xl shadow-sm overflow-hidden">
              <div className="p-3 border-b bg-gradient-to-r from-pink-50 to-purple-50">
                <div className="flex justify-between items-center mb-2">
                  <h3 className="text-sm font-bold text-gray-800">💕 Seguiti</h3>
                  <span className="bg-pink-100 text-pink-600 text-xs px-2 py-0.5 rounded-full">{following.length}</span>
                </div>
                <div className="relative">
                  <Icons.Search size={14} className="absolute left-2 top-1/2 -translate-y-1/2 text-gray-400" />
                  <input 
                    type="text" 
                    value={searchQuery} 
                    onChange={e => setSearchQuery(e.target.value)}
                    className="w-full border border-gray-200 rounded-lg pl-7 pr-3 py-1.5 text-xs bg-white" 
                    placeholder="Cerca..." 
                  />
                </div>
              </div>
              <div className="max-h-[60vh] overflow-y-auto no-scrollbar">
                {filteredFollowing.length === 0 ? (
                  <div className="p-4 text-center text-gray-400">
                    <Icons.Users size={24} className="mx-auto mb-2 opacity-50" />
                    <p className="text-xs">{searchQuery ? 'Nessun risultato' : 'Non segui nessuno'}</p>
                  </div>
                ) : (
                  filteredFollowing.map(u => (
                    <div key={u.id} className="flex items-center gap-2 p-2.5 border-b border-gray-50 hover:bg-gray-50">
                      <div onClick={() => onUserClick(u)} className="cursor-pointer relative">
                        <ProfileImage src={u.profileImage} name={u.nome} size={36} />
                        {u.preferenzaBallo && (
                          <span className={`absolute -bottom-1 -right-1 text-[8px] w-4 h-4 rounded-full flex items-center justify-center font-bold ${
                            u.preferenzaBallo === 'bachata' ? 'bg-orange-500 text-white' :
                            u.preferenzaBallo === 'salsa' ? 'bg-red-500 text-white' :
                            'bg-purple-500 text-white'
                          }`}>
                            {u.preferenzaBallo === 'bachata' ? 'B' : u.preferenzaBallo === 'salsa' ? 'S' : '½'}
                          </span>
                        )}
                      </div>
                      <div className="flex-1 min-w-0" onClick={() => onUserClick(u)}>
                        <p className="text-sm font-medium truncate">{u.nome} {u.cognome}</p>
                        {u.instagram && <p className="text-[10px] text-pink-500">@{u.instagram}</p>}
                      </div>
                      <div className="flex gap-1">
                        <button onClick={() => onMessage(u.id)} className="p-1.5 bg-blue-50 text-blue-500 rounded-lg">
                          <Icons.MessageCircle size={14} />
                        </button>
                        <button onClick={() => onUnfollow(u.id)} className="p-1.5 bg-gray-100 text-gray-500 rounded-lg">
                          <Icons.UserMinus size={14} />
                        </button>
                      </div>
                    </div>
                  ))
                )}
              </div>
            </div>

            {/* Colonna Destra - Suggeriti */}
            <div className="bg-white rounded-xl shadow-sm overflow-hidden">
              <div className="p-3 border-b bg-gradient-to-r from-yellow-50 to-orange-50">
                <div className="flex justify-between items-center">
                  <h3 className="text-sm font-bold text-gray-800">✨ Suggeriti</h3>
                  <span className="bg-yellow-100 text-yellow-700 text-xs px-2 py-0.5 rounded-full">{suggeriti.length}</span>
                </div>
                <p className="text-[10px] text-gray-500 mt-1">Persone che potresti conoscere</p>
              </div>
              <div className="max-h-[60vh] overflow-y-auto no-scrollbar">
                {suggeriti.length === 0 ? (
                  <div className="p-4 text-center text-gray-400">
                    <Icons.Sparkles size={24} className="mx-auto mb-2 opacity-50" />
                    <p className="text-xs">Nessun suggerimento</p>
                  </div>
                ) : (
                  suggeriti.map(u => (
                    <div key={u.id} className="flex items-center gap-2 p-2.5 border-b border-gray-50 hover:bg-gray-50">
                      <div onClick={() => onUserClick(u)} className="cursor-pointer relative">
                        <ProfileImage src={u.profileImage} name={u.nome} size={36} />
                        {u.preferenzaBallo && (
                          <span className={`absolute -bottom-1 -right-1 text-[8px] w-4 h-4 rounded-full flex items-center justify-center font-bold ${
                            u.preferenzaBallo === 'bachata' ? 'bg-orange-500 text-white' :
                            u.preferenzaBallo === 'salsa' ? 'bg-red-500 text-white' :
                            'bg-purple-500 text-white'
                          }`}>
                            {u.preferenzaBallo === 'bachata' ? 'B' : u.preferenzaBallo === 'salsa' ? 'S' : '½'}
                          </span>
                        )}
                      </div>
                      <div className="flex-1 min-w-0" onClick={() => onUserClick(u)}>
                        <p className="text-sm font-medium truncate">{u.nome} {u.cognome}</p>
                        {u.amiciInComune > 0 ? (
                          <p className="text-[10px] text-orange-500">{u.amiciInComune} amici in comune</p>
                        ) : u.instagram ? (
                          <p className="text-[10px] text-pink-500">@{u.instagram}</p>
                        ) : (
                          <p className="text-[10px] text-gray-400">{u.zona || 'Milano'}</p>
                        )}
                      </div>
                      <button onClick={() => onFollow(u.id)} className="px-2.5 py-1.5 bg-pink-500 text-white rounded-lg text-xs font-medium">
                        Segui
                      </button>
                    </div>
                  ))
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // Mini cards for split view
    function MiniMyRideCard({ p, type, users, onConfirm, onCancel, onDelete, onUserClick, confirmDel, setConfirmDel, onDeleteRide }) {
      const scaduto = isPassaggioScaduto(p.data, p.orario);
      const driver = type === 'prenotato' ? users?.[p.driverId] : null;
      
      return (
        <div className={`bg-white rounded-xl p-2.5 shadow-sm border ${scaduto ? 'border-red-200 bg-red-50/30' : ''}`}>
          {type === 'offerto' ? (
            <>
              <div className="flex justify-between items-start mb-1">
                <div className="flex-1 min-w-0">
                  <p className="text-xs font-semibold text-purple-600 truncate">{p.locale}</p>
                  <p className="text-[10px] text-gray-500">{formatDate(p.data)} • {p.orario}</p>
                </div>
                <div className="flex items-center gap-1">
                  <span className="bg-blue-100 text-blue-700 text-[10px] px-1.5 py-0.5 rounded-full">{p.passeggeri.length}/{p.maxPasseggeri}</span>
                  <button onClick={onDelete} className="text-red-400 p-0.5"><Icons.Trash size={14} /></button>
                </div>
              </div>
              {confirmDel === p.id && (
                <div className="bg-red-50 border border-red-200 rounded p-2 mb-1">
                  <div className="flex gap-1">
                    <button onClick={() => setConfirmDel(null)} className="flex-1 border border-gray-300 py-1 rounded text-[10px]">No</button>
                    <button onClick={() => { onDeleteRide(p.id); setConfirmDel(null); }} className="flex-1 bg-red-500 text-white py-1 rounded text-[10px]">Sì</button>
                  </div>
                </div>
              )}
              {p.passeggeri.length > 0 && (
                <div className="border-t pt-1.5 mt-1.5 space-y-1">
                  {p.passeggeri.slice(0, 2).map((pass, i) => (
                    <div key={i} className="flex items-center justify-between">
                      <div className="flex items-center gap-1">
                        <ProfileImage src={pass.profileImage} name={pass.nome} size={20} onClick={() => users[pass.userId] && onUserClick(users[pass.userId])} />
                        <p className="text-[10px] truncate max-w-[60px]">{pass.nome.split(' ')[0]}</p>
                      </div>
                      {pass.stato === 'prenotato' ? <button onClick={() => onConfirm(p.id, pass.userId)} className="bg-green-500 text-white text-[8px] px-1.5 py-0.5 rounded-full">✓</button> : <span className="text-green-500 text-[10px]">✓</span>}
                    </div>
                  ))}
                  {p.passeggeri.length > 2 && <p className="text-[10px] text-gray-400">+{p.passeggeri.length - 2} altri</p>}
                </div>
              )}
            </>
          ) : (
            <>
              <div className="flex items-center gap-2 mb-1">

    // ==================== OFFER RIDE MODAL ====================
