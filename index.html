<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#ec4899">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>MLL Passaggi - Supabase Full</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overscroll-behavior: none; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .slide-up { animation: slideUp 0.3s ease-out; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // ==================== SUPABASE CONFIG ====================
    const SUPABASE_URL = "https://vpspsgyspxqswkclntuj.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZwc3BzZ3lzcHhxc3drY2xudHVqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzcyNzgzNTQsImV4cCI6MjA1Mjg1NDM1NH0.P0mO79mKz-5vF-K6xQ0yO575y6_Q7F9_w9Z_v1_v1";
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ==================== ICONS (Originali) ====================
    const Icons = {
      Car: ({size=24,className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>,
      Search: ({size=24,className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>,
      Trophy: ({size=24,className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6M18 9h1.5a2.5 2.5 0 0 0 0-5H18M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22M18 2H6v7a6 6 0 0 0 12 0V2Z"/></svg>,
      Gift: ({size=24,className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7M7.5 8a2.5 2.5 0 0 1 0-5A4.8 8 0 0 1 12 8a4.8 8 0 0 1 4.5-5 2.5 2.5 0 0 1 0 5"/></svg>,
      User: ({size=24,className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
      Users: ({size=24,className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
      MapPin: ({size=24,className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>,
      Home: ({size=24,className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
      Bell: ({size=24,className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>,
      MessageCircle: ({size=24,className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m3 21 1.9-5.7a8.5 8.5 0 1 1 3.8 3.8z"/></svg>,
      Plus: ({size=24,className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M12 5v14M5 12h14"/></svg>,
      X: ({size=24,className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 6 6 18M6 6l12 12"/></svg>,
      Star: ({size=24,className="",fill=false}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill={fill?"currentColor":"none"} stroke="currentColor" strokeWidth="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>,
      Trash: ({size=18,className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>,
      LogOut: ({size=24,className=""}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>,
    };

    // ==================== HELPERS ====================
    const formatDate = (d) => {
      const date = new Date(d);
      return isNaN(date.getTime()) ? d : date.toLocaleDateString('it-IT', { day: 'numeric', month: 'short' });
    };

    // ==================== APP COMPONENT ====================
    function App() {
      // States
      const [currentUser, setCurrentUser] = useState(null);
      const [loading, setLoading] = useState(true);
      const [activeTab, setActiveTab] = useState('home');
      const [toast, setToast] = useState(null);

      // Data States
      const [eventi, setEventi] = useState([]);
      const [passaggi, setPassaggi] = useState([]);
      const [gare, setGare] = useState([]);
      const [notifiche, setNotifiche] = useState([]);
      const [messaggi, setMessaggi] = useState([]);
      const [users, setUsers] = useState({});

      // Modals
      const [showOfferForm, setShowOfferForm] = useState(false);
      const [showLogin, setShowLogin] = useState(false);
      const [showRegistration, setShowRegistration] = useState(false);

      useEffect(() => {
        checkUser();
        const { data: authListener } = supabase.auth.onAuthStateChange((event, session) => {
          if (session?.user) fetchProfile(session.user.id);
          else setCurrentUser(null);
        });
        return () => authListener.subscription.unsubscribe();
      }, []);

      useEffect(() => {
        if (currentUser) {
          refreshAllData();
        }
      }, [currentUser]);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      const checkUser = async () => {
        const { data: { session } } = await supabase.auth.getSession();
        if (session?.user) await fetchProfile(session.user.id);
        setLoading(false);
      };

      const fetchProfile = async (id) => {
        const { data } = await supabase.from('profiles').select('*').eq('id', id).single();
        if (data) setCurrentUser(data);
      };

      const refreshAllData = async () => {
        const [evs, pas, grs, not, msg, usr] = await Promise.all([
          supabase.from('eventi').select('*').order('data', { ascending: true }),
          supabase.from('passaggi').select('*, profiles(nome, profile_image), prenotazioni(*)'),
          supabase.from('gare_ballo').select('*, candidature_gara(*)'),
          supabase.from('notifiche').select('*').eq('to_user_id', currentUser?.id).order('created_at', { ascending: false }),
          supabase.from('messaggi').select('*').or(`from_id.eq.${currentUser?.id},to_id.eq.${currentUser?.id}`),
          supabase.from('profiles').select('*')
        ]);

        if (evs.data) setEventi(evs.data);
        if (pas.data) setPassaggi(pas.data);
        if (grs.data) setGare(grs.data);
        if (not.data) setNotifiche(not.data);
        if (msg.data) setMessaggi(msg.data);
        if (usr.data) {
          const userMap = {};
          usr.data.forEach(u => userMap[u.id] = u);
          setUsers(userMap);
        }
      };

      // ============= ACTIONS =============
      const handleLogin = async (e) => {
        e.preventDefault();
        const { email, password } = e.target.elements;
        const { error } = await supabase.auth.signInWithPassword({ email: email.value, password: password.value });
        if (error) alert(error.message);
        else setShowLogin(false);
      };

      const handleRegister = async (formData) => {
        const { data: authData, error: authError } = await supabase.auth.signUp({
          email: formData.email,
          password: formData.password,
        });

        if (authError) return alert(authError.message);

        const { error: profError } = await supabase.from('profiles').insert([{
          id: authData.user.id,
          nome: formData.nome,
          cognome: formData.cognome,
          punti: 20, // Bonus registrazione
          tipo_utente: 'ballerino',
          zona: formData.zona
        }]);

        if (profError) alert(profError.message);
        else setShowRegistration(false);
      };

      const handleOfferRide = async (rideData) => {
        const { error } = await supabase.from('passaggi').insert([{
          driver_id: currentUser.id,
          evento_id: rideData.eventoId,
          zona_partenza: rideData.zonaPartenza,
          orario: rideData.orario,
          max_passeggeri: parseInt(rideData.posti),
          ritorno: rideData.ritorno,
          note: rideData.note
        }]);

        if (error) alert(error.message);
        else {
          showToast("Passaggio pubblicato! 🚗");
          setShowOfferForm(false);
          refreshAllData();
          // Bonus punti
          await supabase.rpc('increment_points', { user_id: currentUser.id, amount: 10 });
        }
      };

      const handleBookRide = async (rideId) => {
        const { error } = await supabase.from('prenotazioni').insert([{
          passaggio_id: rideId,
          user_id: currentUser.id,
          stato: 'prenotato'
        }]);

        if (error) alert(error.message);
        else {
          showToast("Richiesta inviata! 📩");
          refreshAllData();
        }
      };

      // ============= UI COMPONENTS (Dall'originale) =============
      if (loading) return <div className="min-h-screen flex items-center justify-center bg-pink-500 text-white text-6xl">🩷</div>;

      if (!currentUser) return (
        <div className="min-h-screen bg-gradient-to-br from-pink-500 to-purple-600 p-4 flex flex-col items-center pt-20">
          <div className="text-6xl mb-4">🩷</div>
          <h1 className="text-3xl font-bold text-white mb-8 text-center">Milano Latin Lovers</h1>
          
          {!showRegistration && !showLogin ? (
            <div className="bg-white rounded-3xl p-8 w-full max-w-md shadow-2xl">
              <h2 className="text-2xl font-bold text-center mb-6">Benvenuto!</h2>
              <button onClick={() => setShowRegistration(true)} className="w-full bg-pink-500 text-white py-4 rounded-xl font-bold mb-4 shadow-lg">🚀 Registrati</button>
              <button onClick={() => setShowLogin(true)} className="w-full border-2 border-pink-500 text-pink-500 py-4 rounded-xl font-bold">👤 Accedi</button>
              <p className="text-center text-gray-400 mt-6 text-sm">+20 punti bonus registrazione!</p>
            </div>
          ) : showLogin ? (
            <div className="bg-white rounded-3xl p-8 w-full max-w-md slide-up">
              <h2 className="text-xl font-bold mb-4">Accedi</h2>
              <form onSubmit={handleLogin} className="space-y-4">
                <input name="email" type="email" placeholder="Email" className="w-full p-4 border rounded-xl" required />
                <input name="password" type="password" placeholder="Password" className="w-full p-4 border rounded-xl" required />
                <button type="submit" className="w-full bg-pink-500 text-white py-4 rounded-xl font-bold">Entra</button>
                <button type="button" onClick={() => setShowLogin(false)} className="w-full text-gray-500">Annulla</button>
              </form>
            </div>
          ) : (
             <div className="bg-white rounded-3xl p-8 w-full max-w-md slide-up">
              <h2 className="text-xl font-bold mb-4">Nuovo Account</h2>
              <form onSubmit={(e) => {
                e.preventDefault();
                handleRegister(Object.fromEntries(new FormData(e.target)));
              }} className="space-y-4">
                <input name="nome" placeholder="Nome" className="w-full p-4 border rounded-xl" required />
                <input name="cognome" placeholder="Cognome" className="w-full p-4 border rounded-xl" required />
                <input name="email" type="email" placeholder="Email" className="w-full p-4 border rounded-xl" required />
                <input name="password" type="password" placeholder="Password (min 6 car.)" className="w-full p-4 border rounded-xl" required />
                <button type="submit" className="w-full bg-pink-500 text-white py-4 rounded-xl font-bold">Crea Account</button>
                <button type="button" onClick={() => setShowRegistration(false)} className="w-full text-gray-500">Annulla</button>
              </form>
            </div>
          )}
        </div>
      );

      return (
        <div className="min-h-screen bg-gray-50 pb-24">
          {/* Header Stile Instagram */}
          <div className="bg-gradient-to-r from-pink-500 to-purple-600 text-white p-6 sticky top-0 z-40 shadow-lg">
            <div className="flex justify-between items-center mb-4">
              <h1 className="text-xl font-bold">MLL Passaggi</h1>
              <div className="flex gap-4">
                <button className="relative"><Icons.Bell size={24} />{notifiche.filter(n=>!n.read).length > 0 && <span className="absolute -top-1 -right-1 bg-yellow-400 w-4 h-4 rounded-full text-[10px] flex items-center justify-center text-black font-bold">!</span>}</button>
                <button><Icons.MessageCircle size={24} /></button>
              </div>
            </div>
            
            <div className="flex items-center gap-4">
              <div className="w-16 h-16 rounded-full border-2 border-white overflow-hidden bg-white/20 flex items-center justify-center text-2xl font-bold shadow-inner">
                {currentUser.profile_image ? <img src={currentUser.profile_image} className="w-full h-full object-cover" /> : currentUser.nome[0]}
              </div>
              <div>
                <h2 className="text-lg font-bold">{currentUser.nome} {currentUser.cognome}</h2>
                <div className="flex gap-4 text-sm opacity-90">
                  <div className="text-center"><p className="font-bold">{currentUser.punti}</p><p className="text-[10px]">Punti</p></div>
                  <div className="text-center"><p className="font-bold">0</p><p className="text-[10px]">Seguiti</p></div>
                </div>
              </div>
            </div>
          </div>

          {/* Main Content */}
          <main className="p-4">
            {activeTab === 'home' && (
              <div className="space-y-6">
                <div className="grid grid-cols-2 gap-4">
                  <button onClick={() => setShowOfferForm(true)} className="bg-white p-6 rounded-3xl shadow-sm border border-pink-100 flex flex-col items-center text-pink-500 font-bold">
                    <Icons.Car size={32} className="mb-2" /> Offri Passaggio
                  </button>
                  <button onClick={() => setActiveTab('passaggi')} className="bg-white p-6 rounded-3xl shadow-sm border border-purple-100 flex flex-col items-center text-purple-500 font-bold">
                    <Icons.Search size={32} className="mb-2" /> Cerca
                  </button>
                </div>

                <section>
                  <h3 className="font-bold mb-4 flex items-center gap-2 text-gray-700"><Icons.Trophy size={18} /> Prossime Serate</h3>
                  <div className="space-y-3">
                    {eventi.map(ev => (
                      <div key={ev.id} className="bg-white p-4 rounded-2xl shadow-sm border flex justify-between items-center">
                        <div>
                          <p className="font-bold">{ev.titolo}</p>
                          <p className="text-xs text-gray-500">{ev.locale} • {formatDate(ev.data)}</p>
                        </div>
                        <button className="bg-pink-50 text-pink-500 px-4 py-2 rounded-xl text-sm font-bold">Vedi</button>
                      </div>
                    ))}
                  </div>
                </section>
              </div>
            )}

            {activeTab === 'passaggi' && (
              <div className="space-y-4">
                <h3 className="font-bold text-xl">Passaggi Disponibili</h3>
                {passaggi.length === 0 ? <p className="text-center py-10 text-gray-400">Nessun passaggio trovato</p> : 
                  passaggi.map(p => (
                    <div key={p.id} className="bg-white p-4 rounded-3xl shadow-md border border-gray-100">
                      <div className="flex items-center gap-3 mb-3">
                        <div className="w-10 h-10 bg-pink-100 rounded-full flex items-center justify-center font-bold text-pink-500">{p.profiles?.nome[0]}</div>
                        <div>
                          <p className="font-bold text-sm">{p.profiles?.nome}</p>
                          <p className="text-[10px] text-gray-400">Partenza da: {p.zona_partenza}</p>
                        </div>
                        <div className="ml-auto text-right">
                          <p className="text-xs font-bold text-pink-500">{p.orario}</p>
                          <p className="text-[10px] text-gray-400">{p.max_passeggeri - (p.prenotazioni?.length || 0)} posti liberi</p>
                        </div>
                      </div>
                      <button 
                        onClick={() => handleBookRide(p.id)}
                        disabled={p.driver_id === currentUser.id || (p.max_passeggeri - (p.prenotazioni?.length || 0) <= 0)}
                        className="w-full bg-pink-500 text-white py-2 rounded-xl text-sm font-bold disabled:bg-gray-200"
                      >
                        {p.driver_id === currentUser.id ? "Il tuo passaggio" : "Prenota"}
                      </button>
                    </div>
                  ))
                }
              </div>
            )}

            {/* Aggiungi qui gli altri tab (Gare, Amici, etc.) mappando i dati Supabase */}
          </main>

          {/* Bottom Nav (Originale) */}
          <nav className="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around p-3 safe-bottom z-50">
            {[
              { id: 'home', icon: Icons.Home, label: 'Home' },
              { id: 'passaggi', icon: Icons.Car, label: 'Passaggi' },
              { id: 'amici', icon: Icons.Users, label: 'Amici' },
              { id: 'profilo', icon: Icons.User, label: 'Profilo' }
            ].map(t => (
              <button key={t.id} onClick={() => setActiveTab(t.id)} className={`flex flex-col items-center ${activeTab === t.id ? 'text-pink-500' : 'text-gray-400'}`}>
                <t.icon size={20} />
                <span className="text-[10px] mt-1 font-bold">{t.label}</span>
              </button>
            ))}
          </nav>

          {/* Toast Notification */}
          {toast && (
            <div className="fixed top-24 left-1/2 -translate-x-1/2 bg-gray-900 text-white px-6 py-3 rounded-full shadow-2xl z-50 animate-bounce">
              {toast}
            </div>
          )}

          {/* Offer Modal (Semplificato per brevità, ma con logica completa) */}
          {showOfferForm && (
            <div className="fixed inset-0 bg-black/60 flex items-end z-50 p-4" onClick={() => setShowOfferForm(false)}>
              <div className="bg-white w-full rounded-t-3xl p-6 slide-up" onClick={e => e.stopPropagation()}>
                <h2 className="text-xl font-bold mb-4">Offri un passaggio</h2>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  handleOfferRide(Object.fromEntries(new FormData(e.target)));
                }} className="space-y-4">
                  <select name="eventoId" className="w-full p-4 border rounded-xl" required>
                    <option value="">Seleziona Serata...</option>
                    {eventi.map(ev => <option key={ev.id} value={ev.id}>{ev.titolo} ({ev.locale})</option>)}
                  </select>
                  <input name="zonaPartenza" placeholder="Zona di partenza (es. Lambrate)" className="w-full p-4 border rounded-xl" required />
                  <div className="grid grid-cols-2 gap-4">
                    <input name="orario" type="time" className="p-4 border rounded-xl" required />
                    <input name="posti" type="number" placeholder="Posti" className="p-4 border rounded-xl" defaultValue="3" required />
                  </div>
                  <button type="submit" className="w-full bg-pink-500 text-white py-4 rounded-xl font-bold shadow-lg">Pubblica (+10 pt)</button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
