    // ==================== HELPERS ====================
    const formatDate = (dateStr) => {
      const date = new Date(dateStr);
      const oggi = new Date();
      const domani = new Date(oggi);
      domani.setDate(domani.getDate() + 1);
      
      if (date.toDateString() === oggi.toDateString()) return "Oggi";
      if (date.toDateString() === domani.toDateString()) return "Domani";
      
      const giorni = ["Dom", "Lun", "Mar", "Mer", "Gio", "Ven", "Sab"];
      const mesi = ["gen", "feb", "mar", "apr", "mag", "giu", "lug", "ago", "set", "ott", "nov", "dic"];
      return `${giorni[date.getDay()]} ${date.getDate()} ${mesi[date.getMonth()]}`;
    };

    const compressImage = async (file, maxSize = 800, quality = 0.8) => {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > maxSize) {
                height *= maxSize / width;
                width = maxSize;
              }
            } else {
              if (height > maxSize) {
                width *= maxSize / height;
                height = maxSize;
              }
            }

            canvas.width = width;
            canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            
            canvas.toBlob((blob) => {
              resolve(new File([blob], file.name, { type: 'image/jpeg' }));
            }, 'image/jpeg', quality);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    };

    const uploadImage = async (file, bucket = 'profile-images') => {
      try {
        const compressed = await compressImage(file);
        const fileExt = compressed.name.split('.').pop();
        const fileName = `${Math.random().toString(36).substring(2)}_${Date.now()}.${fileExt}`;

        const { data, error } = await supabase.storage
          .from(bucket)
          .upload(fileName, compressed);

        if (error) throw error;

        const { data: { publicUrl } } = supabase.storage
          .from(bucket)
          .getPublicUrl(fileName);

        return publicUrl;
      } catch (error) {
        console.error('Upload error:', error);
        return null;
      }
    };

    // ==================== PROFILE IMAGE ====================
    function ProfileImage({ src, name, size = 48, editable, onChange }) {
      const fileRef = useRef();

      const handleFileChange = async (e) => {
        if (e.target.files[0] && onChange) {
          const url = await uploadImage(e.target.files[0]);
          if (url) onChange(url);
        }
      };

      return (
        <div className="relative" style={{ width: size, height: size }}>
          {src ? (
            <img src={src} alt={name} className="w-full h-full rounded-full object-cover border-2 border-white shadow" />
          ) : (
            <div className="w-full h-full rounded-full bg-gradient-to-br from-pink-500 to-purple-500 flex items-center justify-center text-white font-bold shadow" 
                 style={{ fontSize: size * 0.4 }}>
              {name?.charAt(0)?.toUpperCase() || '?'}
            </div>
          )}
          {editable && (
            <>
              <button 
                type="button"
                onClick={() => fileRef.current?.click()} 
                className="absolute bottom-0 right-0 bg-pink-500 text-white rounded-full p-1 shadow"
              >
                <Icons.Plus size={size * 0.25} />
              </button>
              <input 
                ref={fileRef}
                type="file" 
                accept="image/*" 
                onChange={handleFileChange} 
                className="hidden" 
              />
            </>
          )}
        </div>
      );
    }

    // ==================== MAIN APP ====================
    function App() {
      const [loading, setLoading] = useState(true);
      const [currentUser, setCurrentUser] = useState(null);
      const [activeTab, setActiveTab] = useState('home');
      const [passaggi, setPassaggi] = useState([]);
      const [eventi, setEventi] = useState([]);
      const [users, setUsers] = useState({});
      const [showOfferForm, setShowOfferForm] = useState(false);
      const [toast, setToast] = useState(null);

      useEffect(() => {
        loadInitialData();
      }, []);

      const loadInitialData = async () => {
        try {
          // Carica utente dalla sessione locale
          const savedUser = localStorage.getItem('mll-current-user');
          if (savedUser) {
            const user = JSON.parse(savedUser);
            setCurrentUser(user);
            
            // Ricarica dati utente dal DB
            const { data } = await supabase
              .from('users')
              .select('*')
              .eq('id', user.id)
              .single();
            
            if (data) {
              setCurrentUser(data);
              localStorage.setItem('mll-current-user', JSON.stringify(data));
            }
          }

          // Carica passaggi
          const { data: passaggiData } = await supabase
            .from('passaggi')
            .select('*')
            .eq('stato', 'aperto')
            .gte('data', new Date().toISOString().split('T')[0])
            .order('data', { ascending: true });

          setPassaggi(passaggiData || []);

          // Carica eventi
          const { data: eventiData } = await supabase
            .from('eventi')
            .select('*')
            .gte('data', new Date().toISOString().split('T')[0])
            .order('data', { ascending: true })
            .limit(10);

          setEventi(eventiData || []);

          // Carica tutti gli utenti (per profili)
          const { data: usersData } = await supabase
            .from('users')
            .select('*');

          const usersMap = {};
          (usersData || []).forEach(u => {
            usersMap[u.id] = u;
          });
          setUsers(usersMap);

        } catch (error) {
          console.error('Errore caricamento:', error);
        } finally {
          setLoading(false);
        }
      };

      const showToast = (msg, type = 'success') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3000);
      };

      const handleLogin = (user) => {
        setCurrentUser(user);
        localStorage.setItem('mll-current-user', JSON.stringify(user));
        showToast(`Bentornato ${user.nome}! 🎉`);
      };

      const handleLogout = () => {
        setCurrentUser(null);
        localStorage.removeItem('mll-current-user');
        setActiveTab('home');
      };

      const handleOfferRide = async (data) => {
        try {
          const { data: newPassaggio, error } = await supabase
            .from('passaggi')
            .insert([{
              driver_id: currentUser.id,
              locale: data.locale,
              data: data.data,
              orario: data.orario,
              zona_partenza: data.zonaPartenza || currentUser.zona,
              posti_totali: parseInt(data.posti),
              ritorno: data.ritorno,
              note: data.note,
              accetta_prenotazioni: data.accettaPrenotazioni,
              accetta_whatsapp: data.accettaWhatsapp,
              passeggeri: [],
              stato: 'aperto'
            }])
            .select()
            .single();

          if (error) throw error;

          setPassaggi([...passaggi, newPassaggio]);
          setShowOfferForm(false);
          showToast('Passaggio pubblicato! 🚗');
          loadInitialData(); // Ricarica dati
        } catch (error) {
          console.error('Errore:', error);
          showToast('Errore pubblicazione', 'error');
        }
      };

      const handleBookRide = async (passaggioId) => {
        try {
          const passaggio = passaggi.find(p => p.id === passaggioId);
          if (!passaggio) return;

          const passeggeri = passaggio.passeggeri || [];
          
          // Verifica se già prenotato
          if (passeggeri.some(p => p.userId === currentUser.id)) {
            showToast('Già prenotato!', 'error');
            return;
          }

          // Verifica posti disponibili
          if (passeggeri.length >= passaggio.posti_totali) {
            showToast('Nessun posto disponibile', 'error');
            return;
          }

          const newPasseggeri = [...passeggeri, {
            userId: currentUser.id,
            nome: `${currentUser.nome} ${currentUser.cognome || ''}`.trim(),
            telefono: currentUser.telefono,
            stato: 'prenotato',
            data: new Date().toISOString()
          }];

          const { error } = await supabase
            .from('passaggi')
            .update({ passeggeri: newPasseggeri })
            .eq('id', passaggioId);

          if (error) throw error;

          showToast('Prenotazione inviata! ✅');
          loadInitialData();
        } catch (error) {
          console.error('Errore:', error);
          showToast('Errore prenotazione', 'error');
        }
      };

      if (loading) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-pink-500 to-purple-600 flex items-center justify-center">
            <div className="text-6xl animate-bounce">🩷</div>
          </div>
        );
      }

      if (!currentUser) {
        return <WelcomeScreen onLogin={handleLogin} />;
      }

      return (
        <div className="min-h-screen bg-gray-50">
          {/* Header */}
          <div className="bg-gradient-to-r from-pink-500 to-purple-600 text-white p-4 sticky top-0 z-40">
            <div className="flex items-center gap-3">
              <ProfileImage src={currentUser.profile_image} name={currentUser.nome} size={48} />
              <div className="flex-1">
                <h2 className="font-bold">{currentUser.nome} {currentUser.cognome}</h2>
                <p className="text-sm text-pink-100">💎 {currentUser.punti} punti</p>
              </div>
              <button onClick={handleLogout} className="p-2 hover:bg-white/20 rounded-lg">
                <Icons.LogOut size={20} />
              </button>
            </div>
          </div>

          {/* Content */}
          <div className="p-4 pb-24">
            {activeTab === 'home' && (
              <HomeTab 
                passaggi={passaggi} 
                eventi={eventi}
                currentUser={currentUser}
                users={users}
                onOfferClick={() => setShowOfferForm(true)}
                onBook={handleBookRide}
              />
            )}
            {activeTab === 'passaggi' && (
              <PassaggiTab 
                passaggi={passaggi}
                currentUser={currentUser}
                users={users}
                onBook={handleBookRide}
              />
            )}
            {activeTab === 'profilo' && (
              <ProfiloTab 
                currentUser={currentUser}
                onLogout={handleLogout}
              />
            )}
          </div>

          {/* Bottom Nav */}
          <div className="fixed bottom-0 left-0 right-0 bg-white border-t px-2 py-2 safe-bottom z-50">
            <div className="flex justify-around max-w-lg mx-auto">
              {[
                { id: 'home', icon: Icons.Sparkles, label: 'Home' },
                { id: 'passaggi', icon: Icons.Car, label: 'Passaggi' },
                { id: 'profilo', icon: Icons.User, label: 'Profilo' },
              ].map(tab => (
                <button 
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`flex flex-col items-center py-1 px-3 rounded-xl transition ${
                    activeTab === tab.id ? 'text-pink-500 bg-pink-50' : 'text-gray-400'
                  }`}
                >
                  <tab.icon size={22} />
                  <span className="text-xs mt-1 font-medium">{tab.label}</span>
                </button>
              ))}
            </div>
          </div>

          {showOfferForm && (
            <OfferRideModal 
              eventi={eventi}
              currentUser={currentUser}
              onSubmit={handleOfferRide}
              onClose={() => setShowOfferForm(false)}
            />
          )}

          {toast && (
            <div className={`fixed top-20 left-4 right-4 p-4 rounded-xl shadow-lg z-50 text-center font-medium ${
              toast.type === 'error' ? 'bg-red-500' : 'bg-green-500'
            } text-white slide-up`}>
              {toast.msg}
            </div>
          )}
        </div>
      );
    }

    // ==================== HOME TAB ====================
    function HomeTab({ passaggi, eventi, currentUser, users, onOfferClick, onBook }) {
      return (
        <div className="space-y-5">
          {/* Quick Actions */}
          <div className="grid grid-cols-2 gap-3">
            <button 
              onClick={onOfferClick}
              className="bg-gradient-to-br from-pink-500 to-pink-600 text-white p-4 rounded-xl shadow-lg flex items-center justify-center gap-2"
            >
              <Icons.Car size={20} />
              <span className="font-semibold">Offri Passaggio</span>
            </button>
            <button className="bg-gradient-to-br from-purple-500 to-purple-600 text-white p-4 rounded-xl shadow-lg flex items-center justify-center gap-2">
              <Icons.Calendar size={20} />
              <span className="font-semibold">Eventi</span>
            </button>
          </div>

          {/* Prossimi Passaggi */}
          <div>
            <h2 className="text-lg font-bold mb-3">🚗 Passaggi Disponibili</h2>
            {passaggi.length === 0 ? (
              <div className="bg-white rounded-xl p-8 text-center">
                <Icons.Car size={48} className="mx-auto text-gray-300 mb-2" />
                <p className="text-gray-400">Nessun passaggio disponibile</p>
              </div>
            ) : (
              <div className="space-y-3">
                {passaggi.slice(0, 5).map(p => (
                  <PassaggioCard 
                    key={p.id} 
                    passaggio={p} 
                    currentUser={currentUser}
                    driver={users[p.driver_id]}
                    onBook={onBook}
                  />
                ))}
              </div>
            )}
          </div>

          {/* Prossimi Eventi */}
          {eventi.length > 0 && (
            <div>
              <h2 className="text-lg font-bold mb-3">✨ Prossimi Eventi</h2>
              <div className="flex gap-3 overflow-x-auto no-scrollbar -mx-4 px-4">
                {eventi.slice(0, 5).map(ev => (
                  <div key={ev.id} className="flex-shrink-0 w-48 bg-white rounded-xl overflow-hidden shadow-sm">
                    {ev.image ? (
                      <img src={ev.image} alt={ev.titolo} className="w-full h-32 object-cover" />
                    ) : (
                      <div className="w-full h-32 bg-gradient-to-br from-pink-100 to-purple-100 flex items-center justify-center">
                        <Icons.Sparkles size={32} className="text-pink-300" />
                      </div>
                    )}
                    <div className="p-3">
                      <p className="font-bold text-sm truncate">{ev.titolo}</p>
                      <p className="text-xs text-purple-600">{ev.locale}</p>
                      <p className="text-xs text-gray-500 mt-1">{formatDate(ev.data)}</p>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==================== PASSAGGI TAB ====================
    function PassaggiTab({ passaggi, currentUser, users, onBook }) {
      return (
        <div>

// ==================== PASSAGGIO CARD ====================
function PassaggioCard({ passaggio, currentUser, driver, onBook, detailed = false }) {
  const postiDisponibili = passaggio.posti_totali - (passaggio.passeggeri?.length || 0);
  const isBooked = passaggio.passeggeri?.some(p => p.userId === currentUser.id);
  const isScaduto = isPassaggioScaduto(passaggio.data, passaggio.orario);
  const isDriver = passaggio.driver_id === currentUser.id;

  return (
    <div className={`bg-white rounded-xl p-4 shadow-sm ${isScaduto ? 'opacity-60' : ''}`}>
      {/* Driver Info */}
      {driver && (
        <div className="flex items-center gap-3 mb-3">
          <ProfileImage src={driver.profile_image} name={driver.nome} size={40} />
          <div className="flex-1">
            <p className="font-semibold">{driver.nome} {driver.cognome}</p>
            {driver.zona && <p className="text-xs text-gray-400">📍 {driver.zona}</p>}
          </div>
        </div>
      )}

      {/* Passaggio Info */}
      <div className="mb-3">
        <p className="font-bold text-purple-600 text-lg">{passaggio.locale}</p>
        <div className="flex items-center gap-3 text-sm text-gray-500 mt-1">
          <span className="flex items-center gap-1">
            <Icons.Calendar size={14} />
            {formatDate(passaggio.data)}
          </span>
          <span className="flex items-center gap-1">
            <Icons.Clock size={14} />
            {passaggio.orario}
          </span>
        </div>
        {passaggio.zona_partenza && (
          <p className="text-sm text-gray-500 mt-1 flex items-center gap-1">
            <Icons.MapPin size={14} />
            Partenza: {passaggio.zona_partenza}
          </p>
        )}
      </div>

      {/* Posti */}
      <div className="flex items-center justify-between mb-3">
        <span className={`text-sm px-3 py-1 rounded-full font-medium ${
          postiDisponibili > 0 ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'
        }`}>
          🚗 {postiDisponibili} {postiDisponibili === 1 ? 'posto' : 'posti'}
        </span>
        {passaggio.ritorno && (
          <span className="text-sm text-green-600 font-medium">🔄 Ritorno incluso</span>
        )}
      </div>

      {/* Note */}
      {detailed && passaggio.note && (
        <p className="text-sm text-gray-600 bg-gray-50 p-2 rounded-lg mb-3">
          💬 {passaggio.note}
        </p>
      )}

      {/* Actions */}
      {!isDriver && !isScaduto && (
        <div className="flex gap-2">
          {passaggio.accetta_whatsapp && driver?.telefono && (
            <a 
              href={`https://wa.me/${driver.telefono.replace(/\D/g, '')}?text=Ciao! Vorrei un passaggio per ${passaggio.locale}`}
              target="_blank"
              className="flex-1 border border-green-500 text-green-600 py-2 rounded-lg text-center text-sm font-medium flex items-center justify-center gap-1"
            >
              <Icons.MessageCircle size={16} />
              WhatsApp
            </a>
          )}
          {passaggio.accetta_prenotazioni && !isBooked && postiDisponibili > 0 && (
            <button 
              onClick={() => onBook(passaggio.id)}
              className="flex-1 bg-pink-500 text-white py-2 rounded-lg text-sm font-medium"
            >
              Prenota
            </button>
          )}
          {isBooked && (
            <div className="flex-1 bg-green-100 text-green-700 py-2 rounded-lg text-center text-sm font-medium flex items-center justify-center gap-1">
              <Icons.Check size={16} />
              Prenotato
            </div>
          )}
        </div>
      )}

      {isDriver && (
        <div className="bg-blue-50 p-3 rounded-lg">
          <p className="text-sm text-blue-700 font-medium">
            📋 Il tuo passaggio • {passaggio.passeggeri?.length || 0} prenotazioni
          </p>
        </div>
      )}

      {isScaduto && (
        <div className="bg-red-50 text-red-600 py-2 rounded-lg text-center text-sm font-medium">
          ⏰ Scaduto
        </div>
      )}
    </div>
  );
}

// ==================== LOGIN FORM ====================
function LoginForm({ onLogin, onBack }) {
  const [email, setEmail] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  const handleSubmit = async (e) => {
    e.preventDefault();
    setLoading(true);
    setError('');

    try {
      const { data, error: dbError } = await supabase
        .from('users')
        .select('*')
        .eq('email', email.toLowerCase().trim())
        .single();

      if (dbError || !data) {
        setError('Utente non trovato');
        return;
      }

      if (data.sospeso) {
        setError('Account sospeso. Contatta l\'amministratore.');
        return;
      }

      onLogin(data);
    } catch (err) {
      setError('Errore di connessione');
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="bg-white rounded-3xl p-6 shadow-2xl">
      <h2 className="text-xl font-bold mb-4 text-center">👤 Accedi</h2>
      <form onSubmit={handleSubmit} className="space-y-4">
        <div>
          <label className="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input 
            type="email"
            value={email}
            onChange={e => setEmail(e.target.value)}
            className={`w-full border rounded-xl px-4 py-3 ${error ? 'border-red-500' : 'border-gray-300'}`}
            placeholder="tua@email.com"
            required
          />
          {error && <p className="text-red-500 text-xs mt-1">{error}</p>}
        </div>
        <button 
          type="submit"
          disabled={loading}
          className="w-full bg-gradient-to-r from-pink-500 to-purple-500 text-white py-4 rounded-xl font-semibold disabled:opacity-50"
        >
          {loading ? 'Caricamento...' : 'Accedi'}
        </button>
      </form>
      <button 
        onClick={onBack}
        className="w-full mt-3 text-gray-500 text-sm"
      >
        ← Indietro
      </button>
    </div>
  );
}

// ==================== REGISTER FORM ====================
function RegisterForm({ onRegister, onBack }) {
  const [form, setForm] = useState({
    nome: '',
    cognome: '',
    email: '',
    telefono: '',
    instagram: '',
    zona: 'Centro'
  });
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');

  const handleSubmit = async (e) => {
    e.preventDefault();
    setLoading(true);
    setError('');

    try {
      // Verifica email duplicata
      const { data: existing } = await supabase
        .from('users')
        .select('id')
        .eq('email', form.email.toLowerCase().trim())
        .single();

      if (existing) {
        setError('Email già registrata');
        setLoading(false);
        return;
      }

      // Crea utente
      const { data, error: dbError } = await supabase
        .from('users')
        .insert([{
          nome: form.nome.trim(),
          cognome: form.cognome.trim(),
          email: form.email.toLowerCase().trim(),
          telefono: form.telefono.trim(),
          instagram: form.instagram.replace('@', '').trim(),
          zona: form.zona,
          tipo_utente: 'ballerino',
          punti: 20,
          passaggi_offerti: 0,
          passaggi_ricevuti: 0
        }])
        .select()
        .single();

      if (dbError) {
  console.error('Errore DB:', dbError);
  setError(`Errore: ${dbError.message}`);
  setLoading(false);
  return;
}

      onRegister(data);
    } catch (err) {
      console.error('Errore:', err);
      setError('Errore durante la registrazione');
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="bg-white rounded-3xl p-6 shadow-2xl max-h-[85vh] overflow-y-auto">
      <h2 className="text-xl font-bold mb-4 text-center">🚀 Registrati</h2>
      <form onSubmit={handleSubmit} className="space-y-4">
        <div className="grid grid-cols-2 gap-3">
          <div>
            <label className="block text-sm font-medium text-gray-700 mb-1">Nome *</label>
            <input 
              type="text"
              value={form.nome}
              onChange={e => setForm({...form, nome: e.target.value})}
              className="w-full border border-gray-300 rounded-xl px-4 py-3"
              required
            />
          </div>
          <div>
            <label className="block text-sm font-medium text-gray-700 mb-1">Cognome</label>
            <input 
              type="text"
              value={form.cognome}
              onChange={e => setForm({...form, cognome: e.target.value})}
              className="w-full border border-gray-300 rounded-xl px-4 py-3"
            />
          </div>
        </div>

        <div>
          <label className="block text-sm font-medium text-gray-700 mb-1">Email *</label>
          <input 
            type="email"
            value={form.email}
            onChange={e => setForm({...form, email: e.target.value})}
            className={`w-full border rounded-xl px-4 py-3 ${error ? 'border-red-500' : 'border-gray-300'}`}
            placeholder="tua@email.com"
            required
          />
          {error && <p className="text-red-500 text-xs mt-1">{error}</p>}
        </div>

        <div>
          <label className="block text-sm font-medium text-gray-700 mb-1">Telefono WhatsApp *</label>
          <input

            onChange={e => setForm({...form, telefono: e.target.value})}

          />

        <div>
          <label className="block text-sm font-medium text-gray-700 mb-1">Instagram</label>
