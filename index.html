<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ==================== CONFIG ====================
    const ADMIN_CODE = 'MLL2025ADMIN';

    // ==================== STORAGE ====================
    const Storage = {
      get: (key) => { try { return JSON.parse(localStorage.getItem(key)); } catch { return null; } },
      set: (key, value) => { try { localStorage.setItem(key, JSON.stringify(value)); } catch {} },
      remove: (key) => { try { localStorage.removeItem(key); } catch {} }
    };

    // ==================== LOCALI ====================
    const DEFAULT_LOCALI = [
      { id: "zoo", nome: "Zoo Club" }, 
      { id: "unamas", nome: "Unamas" },
      { id: "ahynama", nome: "Ahynama" }, 
      { id: "terrazza13", nome: "Terrazza 13" },
      { id: "camana", nome: "Camana" }, 
      { id: "encanto", nome: "Encanto" },
      { id: "etoile", nome: "Etoile" }, 
      { id: "sueno", nome: "Sueno" },
      { id: "spark", nome: "Spark Dance" }, 
      { id: "studio17", nome: "Studio 17" },
      { id: "bahia", nome: "Le Le Bahia" }, 
      { id: "clandestino", nome: "Clandestino" },
      { id: "impero", nome: "Impero" }, 
      { id: "polaris", nome: "Polaris" },
    ];

    // ==================== DATE HELPERS ====================
    const formatDate = (dateStr) => {
      const date = new Date(dateStr);
      const oggi = new Date();
      const domani = new Date(oggi); 
      domani.setDate(domani.getDate() + 1);
      
      if (date.toDateString() === oggi.toDateString()) return "Oggi";
      if (date.toDateString() === domani.toDateString()) return "Domani";
      
      const giorni = ["Dom", "Lun", "Mar", "Mer", "Gio", "Ven", "Sab"];
      const mesi = ["gen", "feb", "mar", "apr", "mag", "giu", "lug", "ago", "set", "ott", "nov", "dic"];
      return `${giorni[date.getDay()]} ${date.getDate()} ${mesi[date.getMonth()]}`;
    };

    const isPassaggioScaduto = (data, orario) => {
      return new Date() > new Date(`${data}T${orario}`);
    };

    // ==================== ICONS ====================
    const Icons = {
      Car: ({size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/></svg>,
      Calendar: ({size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect width="18" height="18" x="3" y="4" rx="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>,
      Clock: ({size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
      MapPin: ({size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>,
      User: ({size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
      Plus: ({size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M5 12h14M12 5v14"/></svg>,
      X: ({size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 6 6 18M6 6l12 12"/></svg>,
      LogOut: ({size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>,
      MessageCircle: ({size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m3 21 1.9-5.7a8.5 8.5 0 1 1 3.8 3.8z"/></svg>,
      Check: ({size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><polyline points="20 6 9 17 4 12"/></svg>,
      Sparkles: ({size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3L12 3Z"/></svg>,
      Home: ({size=24}) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
    };

    // ==================== PROFILE IMAGE ====================
    function ProfileImage({ src, name, size = 48 }) {
      return (
        <div className="relative" style={{ width: size, height: size }}>
          {src ? (
            <img src={src} alt={name} className="w-full h-full rounded-full object-cover border-2 border-white shadow" />
          ) : (
            <div className="w-full h-full rounded-full bg-gradient-to-br from-pink-500 to-purple-500 flex items-center justify-center text-white font-bold shadow" 
                 style={{ fontSize: size * 0.4 }}>
              {name?.charAt(0)?.toUpperCase() || '?'}
            </div>
          )}
        </div>
      );
    }

    // ==================== MAIN APP ====================
    function App() {
      const [loading, setLoading] = useState(true);
      const [currentUser, setCurrentUser] = useState(null);
      const [users, setUsers] = useState({});
      const [passaggi, setPassaggi] = useState([]);
      const [activeTab, setActiveTab] = useState('home');
      const [showOfferForm, setShowOfferForm] = useState(false);
      const [showLogin, setShowLogin] = useState(false);
      const [showRegistration, setShowRegistration] = useState(false);
      const [toast, setToast] = useState(null);

      useEffect(() => {
        setCurrentUser(Storage.get('mll-current-user'));
        setUsers(Storage.get('mll-users') || {});
        setPassaggi(Storage.get('mll-passaggi') || []);
        setLoading(false);
      }, []);

      const showToast = (msg, type = 'success') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3000);
      };

      const handleRegister = (data) => {
        const id = `user_${Date.now()}`;
        const user = { 
          id, 
          ...data, 
          punti: 20, 
          passaggiOfferti: 0, 
          passaggiRicevuti: 0,
          isAdmin: false 
        };
        const newUsers = { ...users, [id]: user };
        Storage.set('mll-users', newUsers);
        Storage.set('mll-current-user', user);
        setUsers(newUsers);
        setCurrentUser(user);
        setShowRegistration(false);
        showToast('Benvenuto! +20 punti 🎉');
      };

      const handleLogin = (user) => {
        Storage.set('mll-current-user', user);
        setCurrentUser(user);
        setShowLogin(false);
        showToast(`Bentornato ${user.nome}! 🎉`);
      };

      const handleLogout = () => {
        Storage.remove('mll-current-user');
        setCurrentUser(null);
        setActiveTab('home');
      };

      const handleOfferRide = (data) => {
        const passaggio = {
          id: `ride_${Date.now()}`,
          driverId: currentUser.id,
          driverName: `${currentUser.nome} ${currentUser.cognome || ''}`.trim(),
          driverTelefono: currentUser.telefono,
          driverZona: currentUser.zona,
          ...data,
          passeggeri: [],
          maxPasseggeri: parseInt(data.posti),
          stato: 'aperto'
        };
        const newPassaggi = [...passaggi, passaggio];
        Storage.set('mll-passaggi', newPassaggi);
        setPassaggi(newPassaggi);
        setShowOfferForm(false);
        showToast('Passaggio pubblicato! 🚗');
      };

      const handleBookRide = (passaggioId) => {
        const passaggio = passaggi.find(p => p.id === passaggioId);
        if (!passaggio) return;

        if (passaggio.passeggeri.some(p => p.userId === currentUser.id)) {
          showToast('Già prenotato!', 'error');
          return;
        }

        if (passaggio.passeggeri.length >= passaggio.maxPasseggeri) {
          showToast('Nessun posto disponibile', 'error');
          return;
        }

        const newPasseggeri = [...passaggio.passeggeri, {
          userId: currentUser.id,
          nome: `${currentUser.nome} ${currentUser.cognome || ''}`.trim(),
          telefono: currentUser.telefono,
          stato: 'prenotato'
        }];

        const newPassaggi = passaggi.map(p => 
          p.id === passaggioId ? { ...p, passeggeri: newPasseggeri } : p
        );

        Storage.set('mll-passaggi', newPassaggi);
        setPassaggi(newPassaggi);
        showToast('Prenotazione inviata! ✅');
      };

      const getPassaggiDisponibili = () => {
        return passaggi.filter(p => 
          p.stato === 'aperto' && 
          p.passeggeri.length < p.maxPasseggeri && 
          p.driverId !== currentUser?.id &&
          !isPassaggioScaduto(p.data, p.orario)
        );
      };

      if (loading) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-pink-500 to-purple-600 flex items-center justify-center">
            <div className="text-6xl animate-bounce">💗</div>
          </div>
        );
      }

      if (!currentUser) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-pink-500 to-purple-600 p-4">
            <div className="max-w-md mx-auto pt-8">
              <div className="text-center mb-6">
                <div className="text-6xl mb-3">💗</div>
                <h1 className="text-3xl font-bold text-white">Milano Latin Lovers</h1>
                <p className="text-pink-100">Programma Passaggi</p>
              </div>
              {!showRegistration && !showLogin ? (
                <div className="bg-white rounded-3xl p-6 shadow-2xl">
                  <h2 className="text-xl font-bold text-gray-800 mb-3 text-center">Benvenuto!</h2>
                  <p className="text-gray-600 mb-5 text-center text-sm">Offri o cerca passaggi per le serate</p>
                  <button 
                    onClick={() => setShowRegistration(true)} 
                    className="w-full bg-gradient-to-r from-pink-500 to-purple-500 text-white py-4 rounded-xl font-semibold shadow-lg mb-3"
                  >
                    🚀 Registrati
                  </button>
                  <button 
                    onClick={() => setShowLogin(true)} 
                    className="w-full border-2 border-pink-500 text-pink-500 py-4 rounded-xl font-semibold"
                  >
                    👤 Accedi
                  </button>
                  <p className="text-center text-gray-400 text-xs mt-4">+20 punti bonus!</p>
                </div>
              ) : showRegistration ? (
                <RegistrationForm onSubmit={handleRegister} onCancel={() => setShowRegistration(false)} />
              ) : (
                <LoginForm users={users} onLogin={handleLogin} onCancel={() => setShowLogin(false)} />
              )}
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-gray-50">
          {/* Header */}
          <div className="bg-gradient-to-r from-pink-500 to-purple-600 text-white p-4 sticky top-0 z-40">
            <div className="flex items-center gap-3">
              <ProfileImage src={currentUser.profileImage} name={currentUser.nome} size={48} />
              <div className="flex-1">
                <h2 className="font-bold">{currentUser.nome} {currentUser.cognome}</h2>
                <p className="text-sm text-pink-100">💎 {currentUser.punti} punti</p>
              </div>
              <button onClick={handleLogout} className="p-2 hover:bg-white/20 rounded-lg">
                <Icons.LogOut size={20} />
              </button>
            </div>
          </div>

          {/* Content */}
          <div className="p-4 pb-24">
            {activeTab === 'home' && (
              <HomeTab 
                passaggi={getPassaggiDisponibili()} 
                currentUser={currentUser}
                users={users}
                onOfferClick={() => setShowOfferForm(true)}
                onBook={handleBookRide}
              />
            )}
            {activeTab === 'passaggi' && (
              <PassaggiTab 
                passaggi={getPassaggiDisponibili()}
                currentUser={currentUser}
                users={users}
                onBook={handleBookRide}
              />
            )}
            {activeTab === 'profilo' && (
              <ProfiloTab 
                currentUser={currentUser}
                onLogout={handleLogout}
              />
            )}
          </div>

          {/* Bottom Nav */}
          <div className="fixed bottom-0 left-0 right-0 bg-white border-t px-2 py-2 safe-bottom z-50">
            <div className="flex justify-around max-w-lg mx-auto">
              {[
                { id: 'home', icon: Icons.Home, label: 'Home' },
                { id: 'passaggi', icon: Icons.Car, label: 'Passaggi' },
                { id: 'profilo', icon: Icons.User, label: 'Profilo' },
              ].map(tab => (
                <button 
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`flex flex-col items-center py-1 px-3 rounded-xl transition ${
                    activeTab === tab.id ? 'text-pink-500 bg-pink-50' : 'text-gray-400'
                  }`}
                >
                  <tab.icon size={22} />
                  <span className="text-xs mt-1 font-medium">{tab.label}</span>
                </button>
              ))}
            </div>
          </div>

          {showOfferForm && (
            <OfferRideModal 
              currentUser={currentUser}
              locali={DEFAULT_LOCALI}
              onSubmit={handleOfferRide}
              onClose={() => setShowOfferForm(false)}
            />
          )}

          {toast && (
            <div className={`fixed top-20 left-4 right-4 p-4 rounded-xl shadow-lg z-50 text-center font-medium ${
              toast.type === 'error' ? 'bg-red-500' : 'bg-green-500'
            } text-white slide-up`}>
              {toast.msg}
            </div>
          )}
        </div>
      );
    }

    // ==================== HOME TAB ====================
    function HomeTab({ passaggi, currentUser, users, onOfferClick, onBook }) {
      return (
        <div className="space-y-5">
          {/* Quick Actions */}
          <div className="grid grid-cols-2 gap-3">
            <button 
              onClick={onOfferClick}
              className="bg-gradient-to-br from-pink-500 to-pink-600 text-white p-4 rounded-xl shadow-lg flex items-center justify-center gap-2"
            >
              <Icons.Car size={20} />
              <span className="font-semibold text-sm">Offri Passaggio</span>
            </button>
            <button className="bg-gradient-to-br from-purple-500 to-purple-600 text-white p-4 rounded-xl shadow-lg flex items-center justify-center gap-2">
              <Icons.Calendar size={20} />
              <span className="font-semibold text-sm">Eventi</span>
            </button>
          </div>

          {/* Passaggi Disponibili */}
          <div>
            <h2 className="text-lg font-bold mb-3">🚗 Passaggi Disponibili</h2>
            {passaggi.length === 0 ? (
              <div className="bg-white rounded-xl p-8 text-center">
                <Icons.Car size={48} className="mx-auto text-gray-300 mb-2" />
                <p className="text-gray-400">Nessun passaggio disponibile</p>
              </div>
            ) : (
              <div className="space-y-3">
                {passaggi.slice(0, 5).map(p => (
                  <PassaggioCard 
                    key={p.id} 
                    passaggio={p} 
                    currentUser={currentUser}
                    driver={users[p.driverId]}
                    onBook={onBook}
                  />
                ))}
              </div>
            )}
          </div>
        </div>
      );
    }

    // ==================== PASSAGGI TAB ====================
    function PassaggiTab({ passaggi, currentUser, users, onBook }) {
      return (
        <div>
          <h2 className="text-lg font-bold mb-4">🚗 Tutti i Passaggi</h2>
          {passaggi.length === 0 ? (
            <div className="bg-white rounded-xl p-12 text-center">
              <Icons.Car size={64} className="mx-auto text-gray-300 mb-4" />
              <p className="text-gray-500 text-lg font-medium">Nessun passaggio</p>
              <p className="text-gray-400 text-sm mt-2">Sii il primo a offrirne uno!</p>
            </div>
          ) : (
            <div className="space-y-3">
              {passaggi.map(p => (
                <PassaggioCard 
                  key={p.id} 
                  passaggio={p} 
                  currentUser={currentUser}
                  driver={users[p.driverId]}
                  onBook={onBook}
                  detailed
                />
              ))}
            </div>
          )}
        </div>
      );
    }

    // ==================== PROFILO TAB ====================
    function ProfiloTab({ currentUser, onLogout }) {
      return (
        <div>
          <div className="bg-white rounded-xl p-5 shadow-sm mb-5">
            <div className="flex items-center gap-4 mb-4">
              <ProfileImage src={currentUser.profileImage} name={currentUser.nome} size={80} />
              <div className="flex-1">
                <h2 className="text-xl font-bold">{currentUser.nome} {currentUser.cognome}</h2>
                {currentUser.instagram && (
                  <p className="text-pink-500 text-sm">@{currentUser.instagram}</p>
                )}
                {currentUser.zona && (
                  <p className="text-gray-500 text-sm">📍 {currentUser.zona}</p>
                )}
              </div>
            </div>

            <div className="grid grid-cols-3 gap-4 py-4 border-t">
              <div className="text-center">
                <p className="text-2xl font-bold text-pink-500">{currentUser.punti}</p>
                <p className="text-xs text-gray-500">Punti</p>
              </div>
              <div className="text-center">
                <p className="text-2xl font-bold">{currentUser.passaggiOfferti || 0}</p>
                <p className="text-xs text-gray-500">Offerti</p>
              </div>
              <div className="text-center">
                <p className="text-2xl font-bold">{currentUser.passaggiRicevuti || 0}</p>
                <p className="text-xs text-gray-500">Ricevuti</p>
              </div>
            </div>
          </div>

          <div className="space-y-3">
            <button 
              onClick={onLogout}
              className="w-full bg-white text-red-500 p-4 rounded-xl flex items-center gap-3 shadow-sm border border-red-100"
            >
              <Icons.LogOut size={20} />
              <span className="font-medium">Esci</span>
            </button>
          </div>
        </div>
      );
    }

    // ==================== PASSAGGIO CARD ====================
    function PassaggioCard({ passaggio, currentUser, driver, onBook, detailed = false }) {
      const postiDisponibili = passaggio.maxPasseggeri - passaggio.passeggeri.length;
      const isBooked = passaggio.passeggeri.some(p => p.userId === currentUser.id);
      const isDriver = passaggio.driverId === currentUser.id;

      return (
        <div className="bg-white rounded-xl p-4 shadow-sm">
          {/* Driver Info */}
          {driver && (
            <div className="flex items-center gap-3 mb-3">
              <ProfileImage src={driver.profileImage} name={driver.nome} size={40} />
              <div className="flex-1">
                <p className="font-semibold">{driver.nome} {driver.cognome}</p>
                {driver.zona && <p className="text-xs text-gray-400">📍 {driver.zona}</p>}
              </div>
            </div>
          )}

          {/* Passaggio Info */}
          <div className="mb-3">
            <p className="font-bold text-purple-600 text-lg">{passaggio.locale}</p>
            <div className="flex items-center gap-3 text-sm text-gray-500 mt-1">
              <span className="flex items-center gap-1">
                <Icons.Calendar size={14} />
                {formatDate(passaggio.data)}
              </span>
              <span className="flex items-center gap-1">
                <Icons.Clock size={14} />
                {passaggio.orario}
              </span>
            </div>
            {passaggio.zonaPartenza && (
              <p className="text-sm text-gray-500 mt-1 flex items-center gap-1">
                <Icons.MapPin size={14} />
                Partenza: {passaggio.zonaPartenza}
              </p>
            )}
          </div>

          {/* Posti */}
          <div className="flex items-center justify-between mb-3">
            <span className={`text-sm px-3 py-1 rounded-full font-medium ${
              postiDisponibili > 0 ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'
            }`}>
              🚗 {postiDisponibili} {postiDisponibili === 1 ? 'posto' : 'posti'}
            </span>
            {passaggio.ritorno && (
              <span className="text-sm text-green-600 font-medium">🔄 Ritorno incluso</span>
)}
</div>{/* Note */}
      {detailed && passaggio.note && (
        <p className="text-sm text-gray-600 bg-gray-50 p-2 rounded-lg mb-3">
          💬 {passaggio.note}
        </p>
      )}

      {/* Actions */}
      {!isDriver && (
        <div className="flex gap-2">
          {passaggio.accettaWhatsapp && driver?.telefono && (
            <a 
              href={`https://wa.me/${driver.telefono.replace(/\D/g, '')}?text=Ciao! Vorrei un passaggio per ${passaggio.locale}`}
              target="_blank"
              rel="noopener noreferrer"
              className="flex-1 border border-green-500 text-green-600 py-2 rounded-lg text-center text-sm font-medium flex items-center justify-center gap-1"
            >
              <Icons.MessageCircle size={16} />
              WhatsApp
            </a>
          )}
          {passaggio.accettaPrenotazioni && !isBooked && postiDisponibili > 0 && (
            <button 
              onClick={() => onBook(passaggio.id)}
              className="flex-1 bg-pink-500 text-white py-2 rounded-lg text-sm font-medium"
            >
              Prenota
            </button>
          )}
          {isBooked && (
            <div className="flex-1 bg-green-100 text-green-700 py-2 rounded-lg text-center text-sm font-medium flex items-center justify-center gap-1">
              <Icons.Check size={16} />
              Prenotato
            </div>
          )}
        </div>
      )}

      {isDriver && (
        <div className="bg-blue-50 p-3 rounded-lg">
          <p className="text-sm text-blue-700 font-medium">
            📋 Il tuo passaggio • {passaggio.passeggeri.length} prenotazioni
          </p>
        </div>
      )}
    </div>
  );
}

// ==================== OFFER RIDE MODAL ====================
function OfferRideModal({ currentUser, locali, onSubmit, onClose }) {
  const [form, setForm] = useState({
    locale: '',
    data: '',
    orario: '21:30',
    posti: '2',
    ritorno: false,
    note: '',
    zonaPartenza: currentUser.zona || '',
    accettaPrenotazioni: true,
    accettaWhatsapp: true
  });

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!form.locale || !form.data) {
      alert('Compila i campi obbligatori');
      return;
    }
    if (!form.accettaPrenotazioni && !form.accettaWhatsapp) {
      alert('Seleziona almeno un metodo di contatto');
      return;
    }
    onSubmit(form);
  };

  return (
    <div className="fixed inset-0 bg-black/50 flex items-end justify-center z-50" onClick={onClose}>
      <div className="bg-white rounded-t-3xl w-full max-w-lg p-5 max-h-[90vh] overflow-y-auto slide-up" onClick={e => e.stopPropagation()}>
        <div className="flex justify-between items-center mb-4">
          <h2 className="text-xl font-bold">🚗 Offri Passaggio</h2>
          <button onClick={onClose} className="text-gray-400 p-2">
            <Icons.X size={24} />
          </button>
        </div>

        <form onSubmit={handleSubmit} className="space-y-4">
          <div>
            <label className="block text-sm font-medium text-gray-700 mb-1">Locale *</label>
            <select 
              value={form.locale}
              onChange={e => setForm({...form, locale: e.target.value})}
              className="w-full border border-gray-300 rounded-xl px-4 py-3"
              required
            >
              <option value="">Seleziona...</option>
              {locali.map(locale => (
                <option key={locale.id} value={locale.nome}>{locale.nome}</option>
              ))}
            </select>
          </div>

          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="block text-sm font-medium text-gray-700 mb-1">Data *</label>
              <input 
                type="date"
                value={form.data}
                onChange={e => setForm({...form, data: e.target.value})}
                className="w-full border border-gray-300 rounded-xl px-4 py-3"
                min={new Date().toISOString().split('T')[0]}
                required
              />
            </div>
            <div>
              <label className="block text-sm font-medium text-gray-700 mb-1">Orario *</label>
              <input 
                type="time"
                value={form.orario}
                onChange={e => setForm({...form, orario: e.target.value})}
                className="w-full border border-gray-300 rounded-xl px-4 py-3"
                required
              />
            </div>
          </div>

          <div>
            <label className="block text-sm font-medium text-gray-700 mb-1">Posti disponibili</label>
            <select 
              value={form.posti}
              onChange={e => setForm({...form, posti: e.target.value})}
              className="w-full border border-gray-300 rounded-xl px-4 py-3"
            >
              {[1, 2, 3, 4].map(n => (
                <option key={n} value={n}>{n}</option>
              ))}
            </select>
          </div>

          <div>
            <label className="block text-sm font-medium text-gray-700 mb-1">Zona Partenza</label>
            <input 
              type="text"
              value={form.zonaPartenza}
              onChange={e => setForm({...form, zonaPartenza: e.target.value})}
              className="w-full border border-gray-300 rounded-xl px-4 py-3"
              placeholder="Es: Centro, Navigli..."
            />
          </div>

          <div className="bg-blue-50 rounded-xl p-4">
            <p className="text-sm font-medium text-gray-700 mb-3">Come preferisci essere contattato?</p>
            <label className="flex items-center gap-3 mb-2">
              <input 
                type="checkbox"
                checked={form.accettaPrenotazioni}
                onChange={e => setForm({...form, accettaPrenotazioni: e.target.checked})}
                className="w-5 h-5 rounded text-pink-500"
              />
              <span className="text-sm">📱 Accetta prenotazioni in-app</span>
            </label>
            <label className="flex items-center gap-3">
              <input 
                type="checkbox"
                checked={form.accettaWhatsapp}
                onChange={e => setForm({...form, accettaWhatsapp: e.target.checked})}
                className="w-5 h-5 rounded text-green-500"
              />
              <span className="text-sm">💬 Contattami su WhatsApp</span>
            </label>
          </div>

          <label className="flex items-center gap-3 p-3 bg-gray-50 rounded-xl">
            <input 
              type="checkbox"
              checked={form.ritorno}
              onChange={e => setForm({...form, ritorno: e.target.checked})}
              className="w-5 h-5 rounded text-pink-500"
            />
            <span className="text-sm">🔄 Offro anche il ritorno (+5 punti)</span>
          </label>

          <div>
            <label className="block text-sm font-medium text-gray-700 mb-1">Note (opzionale)</label>
            <textarea 
              value={form.note}
              onChange={e => setForm({...form, note: e.target.value})}
              className="w-full border border-gray-300 rounded-xl px-4 py-3"
              rows={2}
              placeholder="Es: contributo benzina 5€, fermata metro..."
            />
          </div>

          <button 
            type="submit"
            className="w-full bg-gradient-to-r from-pink-500 to-purple-500 text-white py-4 rounded-xl font-semibold shadow-lg"
          >
            Pubblica Passaggio
          </button>
        </form>
      </div>
    </div>
  );
}

// ==================== REGISTRATION FORM ====================
function RegistrationForm({ onSubmit, onCancel }) {
  const [form, setForm] = useState({
    nome: '',
    cognome: '',
    email: '',
    telefono: '',
    instagram: '',
    zona: 'Centro'
  });
  const [error, setError] = useState('');

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!form.nome || !form.email || !form.telefono) {
      setError('Compila tutti i campi obbligatori');
      return;
    }
    onSubmit(form);
  };

  return (
    <div className="bg-white rounded-3xl p-6 shadow-2xl max-h-[85vh] overflow-y-auto">
      <h2 className="text-xl font-bold mb-4 text-center">🚀 Registrati</h2>
      <form onSubmit={handleSubmit} className="space-y-4">
        <div className="grid grid-cols-2 gap-3">
          <div>
            <label className="block text-sm font-medium text-gray-700 mb-1">Nome *</label>
            <input 
              type="text"
              value={form.nome}
              onChange={e => setForm({...form, nome: e.target.value})}
              className="w-full border border-gray-300 rounded-xl px-4 py-3"
              required
            />
          </div>
          <div>
            <label className="block text-sm font-medium text-gray-700 mb-1">Cognome</label>
            <input 
              type="text"
              value={form.cognome}
              onChange={e => setForm({...form, cognome: e.target.value})}
              className="w-full border border-gray-300 rounded-xl px-4 py-3"
            />
          </div>
        </div>

        <div>
          <label className="block text-sm font-medium text-gray-700 mb-1">Email *</label>
          <input 
            type="email"
            value={form.email}
            onChange={e => setForm({...form, email: e.target.value})}
            className="w-full border border-gray-300 rounded-xl px-4 py-3"
            placeholder="tua@email.com"
            required
          />
        </div>

        <div>
          <label className="block text-sm font-medium text-gray-700 mb-1">Telefono WhatsApp *</label>
          <input 
            type="tel"
            value={form.telefono}
            onChange={e => setForm({...form, telefono: e.target.value})}
            className="w-full border border-gray-300 rounded-xl px-4 py-3"
            placeholder="+39 333 1234567"
            required
          />
        </div>

        <div>
          <label className="block text-sm font-medium text-gray-700 mb-1">Instagram</label>
          <div className="relative">
            <span className="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">@</span>
            <input 
              type="text"
              value={form.instagram}
              onChange={e => setForm({...form, instagram: e.target.value.replace('@', '')})}
              className="w-full border border-gray-300 rounded-xl pl-8 pr-4 py-3"
              placeholder="username"
            />
          </div>
        </div>

        <div>
          <label className="block text-sm font-medium text-gray-700 mb-1">Zona di Milano</label>
          <select 
            value={form.zona}
            onChange={e => setForm({...form, zona: e.target.value})}
            className="w-full border border-gray-300 rounded-xl px-4 py-3"
          >
            <option value="Centro">Centro</option>
            <option value="Navigli">Navigli</option>
            <option value="Isola">Isola</option>
            <option value="Porta Romana">Porta Romana</option>
            <option value="Loreto">Loreto</option>
            <option value="Città Studi">Città Studi</option>
            <option value="Bicocca">Bicocca</option>
            <option value="San Siro">San Siro</option>
            <option value="Altro">Altro</option>
          </select>
        </div>

        {error && <p className="text-red-500 text-sm">{error}</p>}

        <button 
          type="submit"
          className="w-full bg-gradient-to-r from-pink-500 to-purple-500 text-white py-4 rounded-xl font-semibold shadow-lg"
        >
          Registrati
        </button>
      </form>
      <button 
        onClick={onCancel}
        className="w-full mt-3 text-gray-500 text-sm"
      >
        ← Indietro
      </button>
    </div>
  );
}

// ==================== LOGIN FORM ====================
function LoginForm({ users, onLogin, onCancel }) {
  const [email, setEmail] = useState('');
  const [error, setError] = useState('');

  const handleSubmit = (e) => {
    e.preventDefault();
    const usersList = Object.values(users);
    const user = usersList.find(u => u.email?.toLowerCase() === email.toLowerCase().trim());
    
    if (user) {
      onLogin(user);
    } else {
      setError('Utente non trovato');
    }
  };

  return (
    <div className="bg-white rounded-3xl p-6 shadow-2xl">
      <h2 className="text-xl font-bold mb-4 text-center">👤 Accedi</h2>
      <form onSubmit={handleSubmit} className="space-y-4">
        <div>
          <label className="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input 
            type="email"
            value={email}
            onChange={e => setEmail(e.target.value)}
            className={`w-full border rounded-xl px-4 py-3 ${error ? 'border-red-500' : 'border-gray-300'}`}
            placeholder="tua@email.com"
            required
          />
          {error && <p className="text-red-500 text-xs mt-1">{error}</p>}
        </div>
        <button 
          type="submit"
          className="w-full bg-gradient-to-r from-pink-500 to-purple-500 text-white py-4 rounded-xl font-semibold"
        >
          Accedi
        </button>
      </form>
      <button 
        onClick={onCancel}
        className="w-full mt-3 text-gray-500 text-sm"
      >
        ← Indietro
      </button>
    </div>
  );
}
