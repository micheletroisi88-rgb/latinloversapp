    // ==================== SERATE TAB ====================
    function SerateTab({ eventi, allEventi, currentUser, onCreateEvent, onDeleteEvent, onEditEvent, passaggi, onEventClick, onInterest, getInterestCounts, getMyInterest, onShowParticipants }) {
      const oggi = new Date();
      oggi.setHours(0, 0, 0, 0);
      const [currentDate, setCurrentDate] = useState(new Date());
      const [selectedDayEvents, setSelectedDayEvents] = useState(null);

      // Filtra solo eventi futuri
      const eventiFuturi = (allEventi || eventi).filter(ev => {
        const evDate = new Date(ev.data);
        evDate.setHours(0, 0, 0, 0);
        return evDate >= oggi;
      }).sort((a, b) => new Date(a.data) - new Date(b.data));

      // TOP 10 per voti
      const getTop10 = () => {
        return eventiFuturi
          .map(ev => {
            const counts = getInterestCounts ? getInterestCounts(ev.id) : { yes: 0, maybe: 0 };
            return { ...ev, yesVotes: counts.yes, totalVotes: counts.yes + counts.maybe };
          })
          .filter(ev => ev.totalVotes > 0)
          .sort((a, b) => b.yesVotes - a.yesVotes || b.totalVotes - a.totalVotes)
          .slice(0, 10);
      };

      // Helper per ottenere giorni del mese
      const getDaysInMonth = (date) => {
        const year = date.getFullYear();
        const month = date.getMonth();
        const firstDay = new Date(year, month, 1);
        const lastDay = new Date(year, month + 1, 0);
        const days = [];
        const startPadding = (firstDay.getDay() + 6) % 7;
        for (let i = startPadding - 1; i >= 0; i--) {
          days.push({ date: new Date(year, month, -i), isCurrentMonth: false });
        }
        for (let i = 1; i <= lastDay.getDate(); i++) {
          days.push({ date: new Date(year, month, i), isCurrentMonth: true });
        }
        const endPadding = (7 - (days.length % 7)) % 7;
        for (let i = 1; i <= endPadding; i++) {
          days.push({ date: new Date(year, month + 1, i), isCurrentMonth: false });
        }
        return days;
      };

      const getEventsForDay = (date) => {
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        const dateStr = `${year}-${month}-${day}`;
        return eventiFuturi.filter(ev => ev.data === dateStr);
      };

      const monthNames = ['Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno', 'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'];
      const dayNames = ['L', 'M', 'M', 'G', 'V', 'S', 'D'];

      const isToday = (date) => date.toDateString() === new Date().toDateString();

      const handleDayClick = (day) => {
        if (!day.isCurrentMonth || day.date < oggi) return;
        const evs = getEventsForDay(day.date);
        if (evs.length === 1) {
          onEventClick && onEventClick(evs[0]);
        } else if (evs.length > 1) {
          setSelectedDayEvents(evs);
        }
      };

      const top10 = getTop10();

      return (
        <div className="space-y-3">
          {/* Header */}
          <div className="flex justify-between items-center">
            <h2 className="text-lg font-bold text-gray-800">✨ Serate</h2>
            {currentUser.isAdmin && <button onClick={onCreateEvent} className="bg-pink-500 text-white px-3 py-1.5 rounded-lg text-sm font-medium flex items-center gap-1"><Icons.Plus size={16} /> Nuova</button>}
          </div>

          {/* Grid: Calendario + TOP 10 */}
          <div className="grid grid-cols-2 gap-2">
            {/* Calendario */}
            <div className="bg-white rounded-xl shadow-sm p-2">
              <div className="flex items-center justify-between mb-2">
                <button onClick={() => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() - 1))} className="p-1 hover:bg-gray-100 rounded"><Icons.ChevronLeft size={14} /></button>
                <span className="text-xs font-bold text-gray-700">{monthNames[currentDate.getMonth()].slice(0,3)} {currentDate.getFullYear()}</span>
                <button onClick={() => setCurrentDate(new Date(currentDate.getFullYear(), currentDate.getMonth() + 1))} className="p-1 hover:bg-gray-100 rounded"><Icons.ChevronRight size={14} /></button>
              </div>
              <div className="grid grid-cols-7 gap-0.5 mb-1">
                {dayNames.map(d => <div key={d} className="text-center text-[8px] font-medium text-gray-400">{d}</div>)}
              </div>
              <div className="grid grid-cols-7 gap-0.5">
                {getDaysInMonth(currentDate).map((day, i) => {
                  const dayEvents = getEventsForDay(day.date);
                  const isPast = day.date < oggi;
                  const hasEvents = dayEvents.length > 0;
                  return (
                    <div key={i} onClick={() => handleDayClick(day)} 
                      className={`h-6 flex items-center justify-center rounded text-[9px] cursor-pointer transition 
                        ${!day.isCurrentMonth ? 'text-gray-300' : isPast ? 'text-gray-400' : ''} 
                        ${isToday(day.date) ? 'bg-pink-500 text-white font-bold' : hasEvents && day.isCurrentMonth ? 'font-bold text-gray-800' : 'hover:bg-gray-100'}`}
                      style={hasEvents && !isToday(day.date) && day.isCurrentMonth ? {backgroundColor: '#c8ff00'} : {}}>
                      {day.date.getDate()}
                    </div>
                  );
                })}
              </div>
              <div className="flex gap-2 mt-2 text-[8px] text-gray-500">
                <span className="flex items-center gap-1"><span className="w-2 h-2 rounded" style={{backgroundColor: '#c8ff00'}}></span> Eventi</span>
                <span className="flex items-center gap-1"><span className="w-2 h-2 rounded bg-pink-500"></span> Oggi</span>
              </div>
            </div>

            {/* TOP 10 */}
            <div className="bg-white rounded-xl shadow-sm p-2">
              <h3 className="text-xs font-bold text-gray-800 mb-2">🏆 TOP 10 Eventi</h3>
              {top10.length === 0 ? (
                <p className="text-[10px] text-gray-400 text-center py-4">Nessun voto ancora</p>
              ) : (
                <div className="space-y-1.5 max-h-[200px] overflow-y-auto">
                  {top10.map((ev, i) => {
                    const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i+1}`;
                    return (
                      <div key={ev.id} onClick={() => onEventClick && onEventClick(ev)} className="flex items-center gap-1.5 p-1 bg-gray-50 rounded cursor-pointer hover:bg-gray-100">
                        <span className={`text-xs font-bold w-5 text-center ${i < 3 ? '' : 'text-gray-400'}`}>{medal}</span>
                        {ev.image ? <img src={ev.image} className="w-8 h-8 object-cover rounded" /> : <div className="w-8 h-8 bg-pink-100 rounded flex items-center justify-center"><Icons.Sparkles size={12} className="text-pink-300" /></div>}
                        <div className="flex-1 min-w-0">
                          <p className="text-[10px] font-bold text-gray-800 truncate">{ev.locale}</p>
                          <p className="text-[9px] text-gray-400">{formatDate(ev.data)}</p>
                        </div>
                        <div className="flex gap-0.5">
                          <span className="bg-green-500 text-white text-[8px] px-1 rounded">{ev.yesVotes}</span>
                          {ev.totalVotes - ev.yesVotes > 0 && <span className="bg-yellow-500 text-white text-[8px] px-1 rounded">{ev.totalVotes - ev.yesVotes}</span>}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </div>

          {/* Tutte le Serate - Scroll orizzontale */}
          <div className="bg-white rounded-xl shadow-sm p-3">
            <div className="flex justify-between items-center mb-2">
              <h3 className="text-sm font-bold text-gray-800">📅 Tutte le Serate</h3>
              <span className="bg-pink-100 text-pink-600 text-xs px-2 py-0.5 rounded-full">{eventiFuturi.length}</span>
            </div>
            
            {eventiFuturi.length === 0 ? (
              <p className="text-center text-gray-400 py-4 text-xs">Nessuna serata in programma</p>
            ) : (
              <div className="flex gap-2 overflow-x-auto no-scrollbar -mx-1 px-1 pb-1">
                {eventiFuturi.map(ev => {
                  const counts = getInterestCounts ? getInterestCounts(ev.id) : { yes: 0, maybe: 0 };
                  const myInterest = getMyInterest ? getMyInterest(ev.id) : null;
                  return (
                    <div key={ev.id} className="flex-shrink-0 w-36 bg-gray-50 rounded-lg overflow-hidden border relative group">
                      {/* Admin buttons */}
                      {currentUser.isAdmin && (
                        <div className="absolute top-1 left-1 z-20 flex gap-1 opacity-0 group-hover:opacity-100 transition">
                          <button onClick={() => onEditEvent(ev)} className="bg-white/90 text-blue-500 p-1 rounded-full shadow-sm"><Icons.Edit size={10} /></button>
                          <button onClick={() => onDeleteEvent(ev.id)} className="bg-white/90 text-red-500 p-1 rounded-full shadow-sm"><Icons.Trash size={10} /></button>
                        </div>
                      )}
                      {/* Vote counters */}
                      <div className="absolute top-1 right-1 z-10 flex gap-0.5">
                        {counts.yes > 0 && <button onClick={(e) => { e.stopPropagation(); onShowParticipants && onShowParticipants(ev, 'yes'); }} className="bg-green-500 text-white text-[8px] font-bold px-1 py-0.5 rounded-full min-w-[14px]">{counts.yes}</button>}
                        {counts.maybe > 0 && <button onClick={(e) => { e.stopPropagation(); onShowParticipants && onShowParticipants(ev, 'maybe'); }} className="bg-yellow-500 text-white text-[8px] font-bold px-1 py-0.5 rounded-full min-w-[14px]">{counts.maybe}</button>}
                      </div>
                      {/* Date banner */}
                      <div className="absolute top-0 left-0 right-0 bg-gradient-to-r from-pink-500 to-purple-500 text-white text-[9px] font-bold text-center py-0.5 z-10">
                        {formatDate(ev.data)}
                      </div>
                      {/* Image */}
                      <div className="relative h-36 bg-gray-100 pt-5 cursor-pointer" onClick={() => onEventClick && onEventClick(ev)}>
                        {ev.image ? <img src={ev.image} alt="" className="w-full h-full object-cover" /> : <div className="w-full h-full bg-gradient-to-br from-pink-100 to-purple-100 flex items-center justify-center"><Icons.Sparkles size={20} className="text-pink-300" /></div>}
                        {ev.mllPresente && <span className="absolute top-6 left-1 text-yellow-400 text-sm">⭐</span>}
                        {/* Banner stack */}
                        <div className="absolute bottom-0 left-0 right-0">
                          {ev.serataConGara && <div className="text-[7px] font-bold text-center py-0.5" style={{backgroundColor: '#ef4444', color: 'white'}}>🏆 GARA</div>}
                          {ev.mllPresente && <div className="bg-blue-600 text-white text-[7px] font-bold text-center py-0.5">MLL</div>}
                          <div className="text-gray-800 text-[8px] font-bold text-center py-0.5 truncate px-1" style={{backgroundColor: '#c8ff00'}}>{ev.locale}</div>
                        </div>
                      </div>
                      {/* Vote buttons */}
                      <div className="p-1 flex gap-1">
                        <button onClick={() => onInterest && onInterest(ev.id, 'yes')} className={`flex-1 py-1 rounded text-[9px] font-medium flex items-center justify-center gap-0.5 ${myInterest === 'yes' ? 'bg-green-500 text-white' : 'bg-gray-100 hover:bg-green-100'}`}>👍</button>
                        <button onClick={() => onInterest && onInterest(ev.id, 'maybe')} className={`flex-1 py-1 rounded text-[9px] font-medium flex items-center justify-center gap-0.5 ${myInterest === 'maybe' ? 'bg-yellow-500 text-white' : 'bg-gray-100 hover:bg-yellow-100'}`}>🤔</button>
                      </div>
                    </div>
                  );
                })}

    // ==================== GARE TAB ====================
    const LIVELLI_GARA = [
      'Bachata Base', 'Bachata Intermedio', 'Bachata Avanzato',
      'Salsa Base', 'Salsa Intermedio', 'Salsa Avanzato'
    ];

    function GareTab({ gare, eventi, currentUser, users, getUserRating, onRespond, onDelete, onUserClick, onCercaLeader, onCercaFollower }) {
      const [filtro, setFiltro] = useState({ tipo: '', livello: '' });
      const gareDisponibili = gare.filter(g => g.stato === 'aperto' && g.creatorId !== currentUser?.id && !isScadutoDaOre(g.data, g.orario || '23:59', 6));
      const filtered = gareDisponibili.filter(g => (!filtro.tipo || g.cercaTipo === filtro.tipo) && (!filtro.livello || g.livello === filtro.livello));
      const grouped = filtered.reduce((acc, g) => { (acc[g.data] = acc[g.data] || []).push(g); return acc; }, {});

      return (
        <div>
          <div className="flex justify-between items-center mb-4">
            <h2 className="text-lg font-bold text-gray-800">🏆 Cerca Partner Gara</h2>
          </div>
          
          {/* Pulsanti */}
          <div className="grid grid-cols-2 gap-3 mb-4">
            <button onClick={onCercaFollower} className="bg-gradient-to-br from-orange-400 to-red-500 text-white p-3 rounded-xl flex items-center justify-center gap-2 shadow-lg active:scale-95 transition">
              <span className="text-xl">💃</span><span className="font-semibold">Cerco Follower</span>
            </button>
            <button onClick={onCercaLeader} className="bg-gradient-to-br from-blue-500 to-indigo-600 text-white p-3 rounded-xl flex items-center justify-center gap-2 shadow-lg active:scale-95 transition">
              <span className="text-xl">🕺</span><span className="font-semibold">Cerco Leader</span>
            </button>
          </div>

          {/* Filtri */}
          <div className="grid grid-cols-2 gap-3 mb-4">
            <select value={filtro.tipo} onChange={e => setFiltro({ ...filtro, tipo: e.target.value })} className="border border-gray-300 rounded-xl px-3 py-2.5 text-sm">
              <option value="">Tutti i ruoli</option>
              <option value="follower">💃 Cerca Follower</option>
              <option value="leader">🕺 Cerca Leader</option>
            </select>
            <select value={filtro.livello} onChange={e => setFiltro({ ...filtro, livello: e.target.value })} className="border border-gray-300 rounded-xl px-3 py-2.5 text-sm">
              <option value="">Tutti i livelli</option>
              {LIVELLI_GARA.map(l => <option key={l} value={l}>{l}</option>)}

          {Object.keys(grouped).length === 0 ? (
            <div className="text-center py-10">
              <Icons.Trophy size={48} className="mx-auto text-gray-300 mb-4" />
              <p className="text-gray-500">Nessuna richiesta attiva</p>
              <p className="text-gray-400 text-sm mt-1">Crea la prima!</p>

            <div className="space-y-6">
              {Object.entries(grouped).sort(([a], [b]) => a.localeCompare(b)).map(([data, richieste]) => (
                <div key={data}>
                  <h3 className="text-sm font-bold text-gray-600 mb-2 flex items-center gap-2">
                    <Icons.Calendar size={14} /> {formatDate(data)}
                  </h3>
                  <div className="space-y-3">
                    {richieste.map(g => <GaraCard key={g.id} g={g} currentUser={currentUser} users={users} getUserRating={getUserRating} onRespond={onRespond} onUserClick={onUserClick} />)}
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    // ==================== GARA CARD ====================
    function GaraCard({ g, currentUser, users, getUserRating, onRespond, onUserClick }) {
      const scaduto = isPassaggioScaduto(g.data, g.orario || '23:59');
      const haCandidato = g.risposte.some(r => r.userId === currentUser?.id);
      const creator = users?.[g.creatorId];
      const rating = getUserRating?.(g.creatorId);

      return (
        <div className={`bg-white rounded-2xl p-4 shadow-sm border ${scaduto ? 'border-red-200 bg-red-50/30' : ''}`}>
          <div className="flex items-start gap-3 mb-3">
            <ProfileImage src={g.creatorImage} name={g.creatorName} size={48} onClick={() => creator && onUserClick?.(creator)} />
            <div className="flex-1 min-w-0">
              <div className="flex items-center gap-2 flex-wrap">
                <p className="font-semibold text-gray-800 cursor-pointer hover:text-pink-500" onClick={() => creator && onUserClick?.(creator)}>{g.creatorName}</p>
                <RatingBadge rating={rating} size="small" />
              </div>
              <p className="text-sm text-purple-600 font-medium">{g.locale}</p>
              {g.eventoTitolo && <p className="text-xs text-pink-500">📌 {g.eventoTitolo}</p>}
            </div>
            <div className="flex flex-col items-end gap-1">
              <span className={`text-sm px-2 py-1 rounded-lg font-bold ${g.cercaTipo === 'follower' ? 'bg-red-100 text-red-600' : 'bg-blue-100 text-blue-600'}`}>
                {g.cercaTipo === 'follower' ? '💃 Follower' : '🕺 Leader'}
              </span>
              {scaduto && <span className="bg-red-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">SCADUTO</span>}
            </div>
          </div>
          
          <div className="space-y-1 mb-3 text-sm text-gray-600">
            <p className={`flex items-center gap-2 ${scaduto ? 'text-red-500' : ''}`}>
              <Icons.Calendar size={14} className="text-gray-400" />{formatDate(g.data)} {g.orario && `• ${g.orario}`}
            </p>
            <p className="flex items-center gap-2">
              <Icons.Star size={14} className="text-orange-400" fill />
              <span className="font-medium text-orange-600">{g.livello}</span>
            </p>
          </div>
          
          {g.note && <p className="text-sm text-gray-500 bg-gray-50 p-2 rounded-lg mb-3">{g.note}</p>}
          
          {g.risposte.length > 0 && (

              ✓ {g.risposte.length} candidatura/e ricevuta/e

          {scaduto ? (
            <div className="bg-red-100 text-red-600 py-2.5 rounded-xl text-center text-sm font-medium">Scaduto</div>
          ) : (
            <div className="flex gap-2">
              <a href={`https://wa.me/${g.creatorTelefono.replace(/\D/g, '')}?text=Ciao! Sono interessato/a alla gara di ${g.livello} presso ${g.locale} il ${formatDate(g.data)}`}
                target="_blank" className="flex-1 border border-gray-300 py-2.5 rounded-xl font-medium flex items-center justify-center gap-2 hover:bg-gray-50">
                <Icons.MessageCircle size={18} /> WhatsApp
              </a>
              {!haCandidato ? (
                <button onClick={() => onRespond(g.id)} className="flex-1 bg-gradient-to-r from-orange-400 to-red-500 text-white py-2.5 rounded-xl font-medium">
                  Mi candido!
                </button>
              ) : (
                <span className="flex-1 py-2.5 rounded-xl bg-green-100 text-green-700 text-center flex items-center justify-center gap-2">
                  <Icons.Check size={18} /> Candidato
                </span>

            </div>
