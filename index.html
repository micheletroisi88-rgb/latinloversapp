    function SearchRideModal({ eventi, locali, currentUser, onSubmit, onClose }) {
      const [mode, setMode] = useState(eventi.length > 0 ? 'evento' : 'manuale');
      const [form, setForm] = useState({ 
        eventoId: '', eventoTitolo: '', locale: '', localeId: '', localeAltro: '', 
        data: '', orario: '21:30', tipoPassaggio: 'andata-ritorno', note: '', 
        zonaArrivo: currentUser.zona 
      });
      const [useDiffZona, setUseDiffZona] = useState(false);
      const [addr, setAddr] = useState({});

      const handleEventSelect = id => { 
        const ev = eventi.find(e => e.id === id); 
        if (ev) setForm({ ...form, eventoId: ev.id, eventoTitolo: ev.titolo, locale: ev.locale, data: ev.data, orario: ev.orario }); 
      };

      const handleSubmit = e => {
        e.preventDefault();
        const localeNome = form.localeId === 'altro' ? form.localeAltro : (form.locale || locali.find(l => l.id === form.localeId)?.nome);
        const zonaArrivo = useDiffZona ? addr.zona : currentUser.zona;
        if (!localeNome || !form.data || !form.tipoPassaggio) return;
        onSubmit({ ...form, locale: localeNome, zonaArrivo });
      };

      return (
        <div className="fixed inset-0 bg-black/50 flex items-end justify-center z-50" onClick={onClose}>
          <div className="bg-white rounded-t-3xl w-full max-w-lg p-5 max-h-[90vh] overflow-y-auto slide-up" onClick={e => e.stopPropagation()}>
            <div className="flex justify-between items-center mb-4">
              <h2 className="text-xl font-bold">🔍 Cerco Passaggio</h2>
              <button onClick={onClose} className="text-gray-400 p-2"><Icons.X size={24} /></button>
            </div>
            {eventi.length > 0 && (
              <div className="flex gap-2 mb-4 bg-gray-100 p-1 rounded-xl">
                <button type="button" onClick={() => setMode('evento')} className={`flex-1 py-2 rounded-lg text-sm font-medium ${mode === 'evento' ? 'bg-white text-purple-500 shadow' : 'text-gray-500'}`}>📌 Per serata</button>
                <button type="button" onClick={() => setMode('manuale')} className={`flex-1 py-2 rounded-lg text-sm font-medium ${mode === 'manuale' ? 'bg-white text-purple-500 shadow' : 'text-gray-500'}`}>✏️ Manuale</button>
              </div>
            )}
            <form onSubmit={handleSubmit} className="space-y-4">
              {mode === 'evento' ? (
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-2">Seleziona serata</label>
                  <div className="max-h-28 overflow-y-auto rounded-lg border border-gray-200">
                    {eventi.map((ev, idx) => (
                      <button key={ev.id} type="button" onClick={() => handleEventSelect(ev.id)} className={`w-full text-left px-2 py-1.5 transition border-b border-gray-100 last:border-b-0 ${form.eventoId === ev.id ? 'bg-purple-100 border-l-4 border-l-purple-500' : idx % 2 === 0 ? 'bg-red-50/50' : 'bg-white'}`}>
                        <div className="flex justify-between items-center">
                          <p className="font-medium text-gray-800 text-xs truncate flex-1">{ev.titolo} <span className="text-purple-600 font-normal">• {ev.locale}</span></p>
                          <p className="text-[10px] text-gray-500 ml-2 whitespace-nowrap">{formatDate(ev.data)} {ev.orario}</p>
                        </div>
                      </button>
                    ))}
                  </div>
                </div>
              ) : (
                <>
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">Locale *</label>
                    <select value={form.localeId} onChange={e => setForm({ ...form, localeId: e.target.value })} className="w-full border border-gray-300 rounded-xl px-4 py-3" required>
                      <option value="">Seleziona...</option>
                      {locali.map(l => <option key={l.id} value={l.id}>{l.nome}</option>)}
                      <option value="altro">Altro...</option>
                    </select>
                  </div>
                  {form.localeId === 'altro' && <input type="text" value={form.localeAltro} onChange={e => setForm({ ...form, localeAltro: e.target.value })} className="w-full border border-gray-300 rounded-xl px-4 py-3" placeholder="Nome locale" required />}
                  <div className="grid grid-cols-2 gap-3">
                    <div><label className="block text-sm font-medium text-gray-700 mb-1">Data *</label><input type="date" value={form.data} onChange={e => setForm({ ...form, data: e.target.value })} className="w-full border border-gray-300 rounded-xl px-4 py-3" min={new Date().toISOString().split('T')[0]} required /></div>
                    <div><label className="block text-sm font-medium text-gray-700 mb-1">Orario *</label><input type="time" value={form.orario} onChange={e => setForm({ ...form, orario: e.target.value })} className="w-full border border-gray-300 rounded-xl px-4 py-3" required /></div>
                  </div>
                </>
              )}
              
              {/* Tipo di passaggio */}
              <div className="bg-purple-50 rounded-xl p-4">
                <p className="text-sm font-bold text-gray-700 mb-3">🚗 Di cosa ho bisogno?</p>
                <div className="grid grid-cols-3 gap-2">
                  <button type="button" onClick={() => setForm({ ...form, tipoPassaggio: 'solo-andata' })}
                    className={`py-3 rounded-xl text-xs font-bold transition ${form.tipoPassaggio === 'solo-andata' ? 'bg-purple-500 text-white' : 'bg-white border-2 border-gray-200 text-gray-700'}`}>
                    ➡️ Solo Andata
                  </button>
                  <button type="button" onClick={() => setForm({ ...form, tipoPassaggio: 'solo-ritorno' })}
                    className={`py-3 rounded-xl text-xs font-bold transition ${form.tipoPassaggio === 'solo-ritorno' ? 'bg-purple-500 text-white' : 'bg-white border-2 border-gray-200 text-gray-700'}`}>
                    ⬅️ Solo Ritorno
                  </button>
                  <button type="button" onClick={() => setForm({ ...form, tipoPassaggio: 'andata-ritorno' })}
                    className={`py-3 rounded-xl text-xs font-bold transition ${form.tipoPassaggio === 'andata-ritorno' ? 'bg-purple-500 text-white' : 'bg-white border-2 border-gray-200 text-gray-700'}`}>
                    🔄 A/R
                  </button>
                </div>
              </div>

              <div className="bg-gray-50 rounded-xl p-3">
                <div className="flex justify-between items-center"><span className="text-sm text-gray-700">📍 La mia zona:</span><span className="font-semibold text-purple-500">{currentUser.zona || 'Non impostata'}</span></div>
                <label className="flex items-center gap-2 mt-2 text-sm text-gray-600"><input type="checkbox" checked={useDiffZona} onChange={e => setUseDiffZona(e.target.checked)} className="rounded text-purple-500" />Parto da altra zona</label>
              </div>
              {useDiffZona && <AddressInput value={addr} onChange={setAddr} />}
              
              <div>
                <label className="block text-sm font-medium text-gray-700 mb-1">📝 Note</label>
                <textarea value={form.note} onChange={e => setForm({ ...form, note: e.target.value })} className="w-full border border-gray-300 rounded-xl px-4 py-3" placeholder="Es: Offro 5€ per il passaggio, parto da zona X..." rows={3} />
              </div>
              <button type="submit" className="w-full bg-gradient-to-r from-purple-500 to-pink-500 text-white py-4 rounded-xl font-semibold shadow-lg">Pubblica Richiesta</button>
            </form>
          </div>
        </div>
      );
    }

    function OfferRideModal({ eventi, locali, currentUser, onSubmit, onClose }) {
      const [mode, setMode] = useState(eventi.length > 0 ? 'evento' : 'manuale');
      const [form, setForm] = useState({ eventoId: '', eventoTitolo: '', locale: '', localeId: '', localeAltro: '', data: '', orario: '21:30', posti: '2', ritorno: false, note: '', zonaPartenza: currentUser.zona, accettaPrenotazioni: true, accettaWhatsapp: true });
      const [useDiffZona, setUseDiffZona] = useState(false);
      const [addr, setAddr] = useState({});

      const handleEventSelect = id => { const ev = eventi.find(e => e.id === id); if (ev) setForm({ ...form, eventoId: ev.id, eventoTitolo: ev.titolo, locale: ev.locale, data: ev.data, orario: ev.orario }); };

      const handleSubmit = e => {
        e.preventDefault();
        const localeNome = form.localeId === 'altro' ? form.localeAltro : (form.locale || locali.find(l => l.id === form.localeId)?.nome);
        const zonaPartenza = useDiffZona ? addr.zona : currentUser.zona;
        if (!localeNome || !form.data || (!form.accettaPrenotazioni && !form.accettaWhatsapp)) return;
        onSubmit({ ...form, locale: localeNome, zonaPartenza });
      };

      return (
        <div className="fixed inset-0 bg-black/50 flex items-end justify-center z-50" onClick={onClose}>
          <div className="bg-white rounded-t-3xl w-full max-w-lg p-5 max-h-[90vh] overflow-y-auto slide-up" onClick={e => e.stopPropagation()}>
            <div className="flex justify-between items-center mb-4">
              <h2 className="text-xl font-bold">🚗 Offri Passaggio</h2>
              <button onClick={onClose} className="text-gray-400 p-2"><Icons.X size={24} /></button>
            </div>
            {eventi.length > 0 && (
              <div className="flex gap-2 mb-4 bg-gray-100 p-1 rounded-xl">
                <button type="button" onClick={() => setMode('evento')} className={`flex-1 py-2 rounded-lg text-sm font-medium ${mode === 'evento' ? 'bg-white text-pink-500 shadow' : 'text-gray-500'}`}>📌 Per serata</button>
                <button type="button" onClick={() => setMode('manuale')} className={`flex-1 py-2 rounded-lg text-sm font-medium ${mode === 'manuale' ? 'bg-white text-pink-500 shadow' : 'text-gray-500'}`}>✏️ Manuale</button>
              </div>
            )}
            <form onSubmit={handleSubmit} className="space-y-4">
              {mode === 'evento' ? (
                <div>
                  <label className="block text-sm font-medium text-gray-700 mb-2">Seleziona serata</label>
                  <div className="max-h-28 overflow-y-auto rounded-lg border border-gray-200">
                    {eventi.map((ev, idx) => (
                      <button key={ev.id} type="button" onClick={() => handleEventSelect(ev.id)} className={`w-full text-left px-2 py-1.5 transition border-b border-gray-100 last:border-b-0 ${form.eventoId === ev.id ? 'bg-pink-100 border-l-4 border-l-pink-500' : idx % 2 === 0 ? 'bg-red-50/50' : 'bg-white'}`}>
                        <div className="flex justify-between items-center">
                          <p className="font-medium text-gray-800 text-xs truncate flex-1">{ev.titolo} <span className="text-purple-600 font-normal">• {ev.locale}</span></p>
                          <p className="text-[10px] text-gray-500 ml-2 whitespace-nowrap">{formatDate(ev.data)} {ev.orario}</p>
                        </div>
                      </button>
                    ))}
                  </div>
                </div>
              ) : (
                <>
                  <div>
                    <label className="block text-sm font-medium text-gray-700 mb-1">Locale *</label>
                    <select value={form.localeId} onChange={e => setForm({ ...form, localeId: e.target.value })} className="w-full border border-gray-300 rounded-xl px-4 py-3" required>
                      <option value="">Seleziona...</option>
                      {locali.map(l => <option key={l.id} value={l.id}>{l.nome}</option>)}
                      <option value="altro">Altro...</option>
                    </select>
                  </div>
                  {form.localeId === 'altro' && <input type="text" value={form.localeAltro} onChange={e => setForm({ ...form, localeAltro: e.target.value })} className="w-full border border-gray-300 rounded-xl px-4 py-3" placeholder="Nome locale" required />}
                  <div className="grid grid-cols-2 gap-3">
                    <div><label className="block text-sm font-medium text-gray-700 mb-1">Data *</label><input type="date" value={form.data} onChange={e => setForm({ ...form, data: e.target.value })} className="w-full border border-gray-300 rounded-xl px-4 py-3" min={new Date().toISOString().split('T')[0]} required /></div>
                    <div><label className="block text-sm font-medium text-gray-700 mb-1">Orario *</label><input type="time" value={form.orario} onChange={e => setForm({ ...form, orario: e.target.value })} className="w-full border border-gray-300 rounded-xl px-4 py-3" required /></div>
                  </div>
                </>
              )}
              <div><label className="block text-sm font-medium text-gray-700 mb-1">Posti</label><select value={form.posti} onChange={e => setForm({ ...form, posti: e.target.value })} className="w-full border border-gray-300 rounded-xl px-4 py-3">{[1,2,3,4].map(n => <option key={n} value={n}>{n}</option>)}</select></div>
              <div className="bg-gray-50 rounded-xl p-3">
                <div className="flex justify-between items-center"><span className="text-sm text-gray-700">📍 Partenza:</span><span className="font-semibold text-pink-500">{currentUser.zona || 'Non impostata'}</span></div>
                <label className="flex items-center gap-2 mt-2 text-sm text-gray-600"><input type="checkbox" checked={useDiffZona} onChange={e => setUseDiffZona(e.target.checked)} className="rounded text-pink-500" />Parto da altra zona</label>
              </div>
              {useDiffZona && <AddressInput value={addr} onChange={setAddr} />}
              <div className="bg-blue-50 rounded-xl p-4">
                <p className="text-sm font-medium text-gray-700 mb-3">📞 Contatto</p>
                <label className="flex items-center gap-3 mb-2"><input type="checkbox" checked={form.accettaPrenotazioni} onChange={e => setForm({ ...form, accettaPrenotazioni: e.target.checked })} className="w-5 h-5 rounded text-pink-500" /><span className="text-sm">🔔 Prenota in-app</span></label>
                <label className="flex items-center gap-3"><input type="checkbox" checked={form.accettaWhatsapp} onChange={e => setForm({ ...form, accettaWhatsapp: e.target.checked })} className="w-5 h-5 rounded text-green-500" /><span className="text-sm">💬 WhatsApp</span></label>
              </div>
              <label className="flex items-center gap-3 p-3 bg-gray-50 rounded-xl"><input type="checkbox" checked={form.ritorno} onChange={e => setForm({ ...form, ritorno: e.target.checked })} className="w-5 h-5 rounded text-pink-500" /><span className="text-sm">🔄 Offro ritorno (+5 pt)</span></label>
              <div><label className="block text-sm font-medium text-gray-700 mb-1">Note</label><textarea value={form.note} onChange={e => setForm({ ...form, note: e.target.value })} className="w-full border border-gray-300 rounded-xl px-4 py-3" placeholder="Es: contributo benzina 5€" rows={2} /></div>
              <button type="submit" className="w-full bg-gradient-to-r from-pink-500 to-purple-500 text-white py-4 rounded-xl font-semibold shadow-lg">Pubblica</button>
            </form>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      const sw = `const C='mll-v7';self.addEventListener('install',e=>e.waitUntil(caches.open(C).then(c=>c.addAll(['/']))));self.addEventListener('fetch',e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request))));`;
      navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'application/javascript'}))).catch(()=>{});
    }
  </script>
</body>
</html>
